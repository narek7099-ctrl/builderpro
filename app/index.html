<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>BuilderPro</title>
<style>html,body{margin:0;height:100%;background:#F2F4F7}@media(prefers-color-scheme:dark){html,body{background:#0C111D}}</style>
<script>
/* /app is the portal's own address. GitHub Pages serves this file for /app/;
   it hands over to the portal in index.html, which then shows /app in the
   address bar again (portal/shell.js bpShell.appUrl). */
(function(){var q=location.search.replace(/^\?/,'');location.replace('../index.html?app=1'+(q?'&'+q:'')+location.hash);})();
</script></head><body></body></html>
