<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f3a5f">
<title>You're offline · BuilderPro</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#0f1729;--grey:#6b7280;--line:#e6e9ef;--blue:#006fff}
  @media (prefers-color-scheme:dark){:root{--bg:#0c111d;--card:#161b26;--ink:#f2f4f7;--grey:#98a2b3;--line:#262c38}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .c{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center}
  img{width:64px;height:64px;border-radius:16px}
  h1{margin:16px 0 8px;font-size:22px;letter-spacing:-.01em}
  p{margin:0 0 20px;color:var(--grey);font-size:15px;line-height:1.5}
  button{width:100%;height:50px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
  <main class="c">
    <img src="logo-256.png" alt="BuilderPro">
    <h1>You're offline</h1>
    <p id="msg">BuilderPro opens with what was saved on this phone the last time you were online. Anything you do with no signal is kept and sent when you’re back.</p>
    <button type="button" onclick="go()">Open BuilderPro</button>
  </main>
  <script>
  /* the app shell shows this page when it can't load builderpro-os.com. The website keeps a
     copy of the app on the phone (sw.js), so opening it again usually works with no signal. */
  var APP = 'https://builderpro-os.com/app.html?portal=1&source=app';
  function go() { location.href = APP; }
  window.addEventListener('online', go);
  /* Android serves this page from the website's own address, so it can see that copy */
  try { caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.open(k).then(function (c) { return c.match('/app.html'); }); })); }).then(function (hits) {
    if (!hits.some(Boolean) && location.protocol === 'https:') document.getElementById('msg').textContent = 'BuilderPro needs a connection the first time it opens on this phone. Check your Wi-Fi or signal, then try again.';
  }).catch(function () {}); } catch (e) {}
  </script>
</body>
</html>
