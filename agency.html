<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Agency Command Center</title>
<style>
:root{--bg:#0e0e13;--card:#17161d;--line:#2a2833;--ink:#eceaf3;--mut:#9b98a8;--pri:#7c5cff;--pri2:#5b86f5;--ok:#34d399;--danger:#f2555a;--soft:#1d1c25;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
button{font:inherit;cursor:pointer;}
input,select,textarea{font:inherit;}
.hidden{display:none!important;}
a{color:var(--pri2);}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login .card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;}
.login h1{font-size:20px;margin-bottom:4px;}
.login p{color:var(--mut);font-size:13px;margin-bottom:18px;}
.login label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;}
.login input{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--ink);outline:none;}
.login input:focus{border-color:var(--pri);}
.login button{width:100%;margin-top:18px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:10px;padding:12px;font-weight:600;}
.login .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:1em;}
/* app */
.app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr;}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);}
.top .brand{font-weight:700;letter-spacing:-.01em;}
.top .brand span{color:var(--pri);}
.top .who{margin-left:auto;color:var(--mut);font-size:12px;}
.top .out{background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:12px;}
/* AI bar */
.ai{padding:14px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(124,92,255,.08),transparent);}
.ai .row{display:flex;gap:8px;}
.ai input{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);outline:none;}
.ai input:focus{border-color:var(--pri);}
.ai .go{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:10px;padding:0 20px;font-weight:600;}
.ai .hint{color:var(--mut);font-size:12px;margin-top:8px;}
.plan{margin-top:12px;background:var(--card);border:1px solid var(--pri);border-radius:12px;padding:14px;}
.plan .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--pri);margin-bottom:6px;}
.plan .sum{font-size:15px;margin-bottom:6px;}
.plan .op{font-family:ui-monospace,monospace;font-size:12px;color:var(--mut);word-break:break-all;margin-bottom:12px;}
.plan .clarify{color:#f0b866;font-size:13px;margin-bottom:12px;}
.plan .btns{display:flex;gap:8px;}
.plan .approve{background:var(--ok);color:#04231a;border:0;border-radius:9px;padding:10px 18px;font-weight:700;}
.plan .cancel{background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:10px 18px;}
/* chat */
.chatlog{max-height:300px;overflow-y:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;}
.chatlog:empty{display:none;}
.cmsg{max-width:82%;padding:9px 13px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;}
.cmsg.user{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px;}
.cmsg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;}
.actcard{margin-top:8px;background:var(--soft);border:1px solid var(--pri);border-radius:10px;padding:11px;}
.actcard .op{font-family:ui-monospace,monospace;font-size:11px;color:var(--mut);word-break:break-all;margin:6px 0 10px;}
.actcard .btns{display:flex;gap:8px;}
.actcard .approve{background:var(--ok);color:#04231a;border:0;border-radius:8px;padding:8px 16px;font-weight:700;}
.actcard .cancel{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 16px;}
.actcard .clarify{color:#f0b866;font-size:13px;margin-bottom:8px;}
/* body */
.wrap{display:grid;grid-template-columns:210px 1fr;min-height:0;}
.side{border-right:1px solid var(--line);padding:16px 12px;background:var(--card);}
.side .loc{margin-bottom:16px;}
.side .loc label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.side select{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--ink);outline:none;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav button{text-align:left;background:none;border:0;color:var(--mut);border-radius:9px;padding:9px 12px;font-weight:500;}
.nav button.on{background:var(--soft);color:var(--ink);}
.main{padding:20px;overflow:auto;}
.main h2{font-size:18px;margin-bottom:12px;}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.bar input{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--ink);outline:none;}
.btn{background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 14px;font-weight:600;}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));border:0;color:#fff;}
.btn.dng{border-color:rgba(242,85,90,.5);color:var(--danger);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:9px 10px;border-bottom:1px solid var(--line);}
td{padding:10px;border-bottom:1px solid var(--soft);}
tr:hover td{background:rgba(255,255,255,.02);}
.rowbtn{background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:5px 10px;font-size:12px;margin-left:6px;}
.rowbtn.dng{color:var(--danger);border-color:rgba(242,85,90,.4);}
.muted{color:var(--mut);}
.out-log{margin-top:14px;background:#0a0a0e;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:ui-monospace,monospace;font-size:12px;color:#9fe6c4;white-space:pre-wrap;max-height:220px;overflow:auto;}
.empty{color:var(--mut);padding:24px;text-align:center;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="card">
    <h1>Agency Command Center</h1>
    <p>Private. Sign in with your admin account.</p>
    <label>Email</label>
    <input type="email" id="email" placeholder="you@email.com">
    <label>Password</label>
    <input type="password" id="pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div class="app hidden" id="app">
  <div class="top">
    <div class="brand">Agency<span> · Command Center</span></div>
    <div class="who" id="who"></div>
    <button class="out" onclick="doLogout()">Sign out</button>
  </div>

  <div class="ai">
    <div id="chatlog" class="chatlog"></div>
    <div class="row">
      <input id="cmd" placeholder="Ask me anything, or tell me what to do…" onkeydown="if(event.key==='Enter')chatSend()">
      <button class="go" onclick="chatSend()">Send</button>
    </div>
    <div class="hint">I can answer questions and take actions — I’ll always ask before changing anything.</div>
  </div>

  <div class="wrap">
    <aside class="side">
      <div class="loc">
        <label>Client (sub-account)</label>
        <select id="locSel" onchange="onLocChange()"><option value="">Loading…</option></select>
      </div>
      <nav class="nav" id="nav">
        <button data-tab="dashboard" class="on" onclick="go('dashboard')">📊 Dashboard</button>
        <button data-tab="clients" onclick="go('clients')">Clients</button>
        <button data-tab="contacts" onclick="go('contacts')">Contacts</button>
        <button data-tab="conversations" onclick="go('conversations')">Conversations</button>
        <button data-tab="pipelines" onclick="go('pipelines')">Pipelines & Workflows</button>
        <button data-tab="forms" onclick="go('forms')">Forms & Submissions</button>
        <button data-tab="fields" onclick="go('fields')">Custom Fields</button>
        <button data-tab="calendars" onclick="go('calendars')">Calendars</button>
        <button data-tab="activity" onclick="go('activity')">Activity & Memory</button>
      </nav>
    </aside>
    <main class="main" id="view"></main>
  </div>
</div>

<script>
var SB_URL="https://ttzwzouhiwdwamuimhpo.supabase.co";
var SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0end6b3VoaXdkd2FtdWltaHBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMTc2NjgsImV4cCI6MjA5ODY5MzY2OH0.oVqdHZlZLWJd_8nkgPRA9VgAqY4ytg51N1mT3Hqekso";
var TOKEN=localStorage.getItem('agency_tok')||'';
var RTOK=localStorage.getItem('agency_rtok')||'';
var EMAIL=localStorage.getItem('agency_email')||'';
var LOCS=[], CURLOC='', TAB='clients', PLAN=null;

function el(id){return document.getElementById(id);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---------- auth (direct Supabase REST, no library) ---------- */
async function doLogin(){
  var err=el('loginErr');err.textContent='';
  var email=el('email').value.trim(), pass=el('pass').value;
  if(!email||!pass){err.textContent='Enter your email and password.';return;}
  try{
    var r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SB_ANON,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})});
    var d=await r.json();
    if(!r.ok||!d.access_token){err.textContent=(d.error_description||d.msg||'Sign-in failed.');return;}
    TOKEN=d.access_token; RTOK=d.refresh_token||''; EMAIL=email;
    localStorage.setItem('agency_tok',TOKEN); localStorage.setItem('agency_rtok',RTOK); localStorage.setItem('agency_email',EMAIL);
    startApp();
  }catch(e){err.textContent='Network error — try again.';}
}
function doLogout(){TOKEN='';RTOK='';localStorage.removeItem('agency_tok');localStorage.removeItem('agency_rtok');location.reload();}
/* refresh the Supabase access token when it expires (~1h) so the tool never locks up */
async function refreshToken(){
  if(!RTOK) return false;
  try{
    var r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':SB_ANON,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:RTOK})});
    var d=await r.json();
    if(!r.ok||!d.access_token) return false;
    TOKEN=d.access_token; RTOK=d.refresh_token||RTOK;
    localStorage.setItem('agency_tok',TOKEN); localStorage.setItem('agency_rtok',RTOK);
    return true;
  }catch(e){ return false; }
}

/* ---------- call the secure agency function ---------- */
/* Supabase function slugs are case-sensitive; try the known name, then alternates. */
var FN_NAMES=['agency','AGENCY','Agency'];
var FN=FN_NAMES[0]; localStorage.removeItem('agency_fn');
var LAST={status:0,body:null};
async function callFn(name,payload){
  return fetch(SB_URL+'/functions/v1/'+name,{method:'POST',
    headers:{'Authorization':'Bearer '+TOKEN,'apikey':SB_ANON,'Content-Type':'application/json'},
    body:JSON.stringify(payload)});
}
async function api(op,args,command,_retried){
  args=args||{};
  // sub-account ops need a locationId so the function can use the right client token
  if(command===undefined && op.indexOf('locations.')!==0 && !args.locationId && CURLOC) args.locationId=CURLOC;
  var payload=(command!==undefined?{op:op,command:command,history:(args&&args.history)||[]}:(op==='batch'?{op:'batch',steps:args.steps||[]}:{op:op,args:args}));
  var r=null,lastErr=null;
  var tries=[FN].concat(FN_NAMES.filter(function(n){return n!==FN;}));
  for(var i=0;i<tries.length;i++){
    try{
      var resp=await callFn(tries[i],payload);
      if(resp.status===404){ lastErr='404 at /'+tries[i]; continue; }   // wrong slug, try next
      r=resp; FN=tries[i]; localStorage.setItem('agency_fn',FN); break;
    }catch(e){ lastErr='network error: '+(e.message||e); }
  }
  if(!r){ LAST={status:-1,body:lastErr||'not reachable'}; throw new Error('Could not reach the agency function. Tried: '+tries.join(', ')+' — '+(lastErr||'')); }
  LAST.status=r.status;
  var body; try{ body=await r.json(); }catch(e){ try{ body={__raw:(await r.text()).slice(0,500)}; }catch(_){ body={__raw:'(no body)'}; } }
  LAST.body=body;
  // expired login token → silently refresh and retry once
  if(r.status===403 && body && /token lookup failed/i.test(body.reason||'') && !_retried){
    if(await refreshToken()) return api(op,args,command,true);
    doLogout(); throw new Error('Your session expired — please sign in again.');
  }
  if(r.status===403){ throw new Error('403 not authorized — check ADMIN_EMAILS includes your email. ('+JSON.stringify(body).slice(0,160)+')'); }
  if(r.status>=500){ throw new Error('Function error '+r.status+' — check the agency function’s secrets. ('+JSON.stringify(body).slice(0,160)+')'); }
  return body;
}
function diagHTML(){ return '<div class="out-log" style="margin-top:14px">Diagnostics — paste this to Claude:\nHTTP '+LAST.status+'\n'+esc(JSON.stringify(LAST.body,null,2)).slice(0,900)+'</div>'; }

/* ---------- AI chat: ask questions + take actions (with approval) ---------- */
var CHAT=[];
function chatAdd(role,html){ var l=el('chatlog'); var d=document.createElement('div'); d.className='cmsg '+role; d.innerHTML=html; l.appendChild(d); l.scrollTop=l.scrollHeight; return d; }
async function chatSend(){
  var t=el('cmd').value.trim(); if(!t) return; el('cmd').value='';
  chatAdd('user',esc(t)); CHAT.push({role:'user',content:t});
  var node=chatAdd('bot','<span class="muted">…</span>');
  await chatTurn(t,node,0);
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function chatTurn(userText,node,depth){
  var res,err;
  for(var attempt=0;attempt<3;attempt++){
    try{ res=await api('ai.plan',{history:CHAT.slice(-14)},userText); err=null; break; }
    catch(e){ err=e; if(/503|high demand|overloaded|UNAVAILABLE|429|rate/i.test(e.message||'')){ node.innerHTML='<span class="muted">Model busy — retrying…</span>'; await sleep(1500*(attempt+1)); continue; } break; }
  }
  if(err){ node.innerHTML='<span style="color:#f0b866">'+esc(err.message)+'</span>'; return; }
  var p=res.plan||{};
  var text=p.text||'';
  if(p.mode==='plan' && Array.isArray(p.steps) && p.steps.length){
    // multi-step plan → one approval runs every step in order
    if(text) CHAT.push({role:'assistant',content:text});
    var list=p.steps.map(function(s,i){return '<div id="st-'+i+'" style="margin:3px 0"><span class="muted">'+(i+1)+'.</span> '+esc(s.summary||s.op)+' <span class="muted" style="font-size:11px">('+esc(s.op)+')</span></div>';}).join('');
    node.innerHTML=(text?esc(text)+'<br>':'')
      +'<div class="actcard"><div style="font-weight:600;margin-bottom:6px">'+esc(p.summary||'Plan — '+p.steps.length+' steps')+'</div>'+list
      +'<div class="btns" style="margin-top:10px"><button class="approve">Approve all &amp; run</button><button class="cancel">Cancel</button></div></div>';
    var card2=node.querySelector('.actcard');
    card2.querySelector('.approve').onclick=function(){ runPlanSteps(p.steps,card2); };
    card2.querySelector('.cancel').onclick=function(){ card2.innerHTML='<span class="muted">Cancelled.</span>'; };
    return;
  }
  if(p.mode==='action' && p.op){
    if(p.readonly && depth<1){
      // read data automatically, then answer using it
      node.innerHTML=esc(text||'Let me check…');
      var r; try{ r=await api(p.op,p.args||{}); }catch(e){ node.innerHTML=esc(text||'')+'<br><span style="color:#f0b866">'+esc(e.message)+'</span>'; return; }
      if(text) CHAT.push({role:'assistant',content:text});
      CHAT.push({role:'user',content:'(data from '+p.op+'): '+JSON.stringify(r.data).slice(0,3500)});
      var n2=chatAdd('bot','<span class="muted">…</span>');
      return chatTurn('Answer my question using that data. Be concise and specific.',n2,depth+1);
    }
    // a change → show approval card
    if(text) CHAT.push({role:'assistant',content:text});
    node.innerHTML=(text?esc(text)+'<br>':'')
      +'<div class="actcard"><div class="muted" style="font-size:12px">'+esc(p.summary||p.op)+'</div>'
      +'<div class="op">'+esc(p.op)+' '+esc(JSON.stringify(p.args||{}))+'</div>'
      +'<div class="btns"><button class="approve">Approve &amp; run</button><button class="cancel">Cancel</button></div></div>';
    var card=node.querySelector('.actcard');
    card.querySelector('.approve').onclick=function(){ runAction(p,card); };
    card.querySelector('.cancel').onclick=function(){ card.innerHTML='<span class="muted">Cancelled.</span>'; };
  }else{
    node.innerHTML=esc(text||'(no reply)');
    CHAT.push({role:'assistant',content:text||''});
  }
}
async function runPlanSteps(steps,card){
  var btns=card.querySelector('.btns'); if(btns)btns.innerHTML='<span class="muted">Running…</span>';
  try{
    var r=await api('batch',{steps:steps});
    var results=(r&&r.results)||[];
    for(var i=0;i<steps.length;i++){
      var row=card.querySelector('#st-'+i); if(!row)continue;
      var res=results[i];
      row.innerHTML=(res? (res.ok?'✅ ':'❌ '):'⏭ ')+row.innerHTML.replace(/^([✅❌⏭] )?/,'');
    }
    if(btns)btns.innerHTML=(r&&r.ok)?'<span style="color:var(--ok)">✓ All '+results.length+' steps done.</span>':'<span style="color:#f0b866">Stopped — a step failed. '+esc(JSON.stringify((results.filter(function(x){return x&&!x.ok;})[0]||{}).data||'').slice(0,200))+'</span>';
    CHAT.push({role:'user',content:'(plan results): '+JSON.stringify(results.map(function(x){return {op:x.op,ok:x.ok};}))});
    go(TAB);
  }catch(e){ if(btns)btns.innerHTML='<span style="color:#f0b866">'+esc(e.message)+'</span>'; }
}
async function runAction(p,card){
  card.innerHTML='<span class="muted">Running…</span>';
  try{
    var r=await api(p.op,p.args||{});
    card.innerHTML=(r.ok!==false)?'✓ Done.':('✗ '+esc(JSON.stringify(r.data).slice(0,300)));
    CHAT.push({role:'user',content:'(result of '+p.op+'): '+((r.ok!==false)?'success':'failed — '+JSON.stringify(r.data).slice(0,300))});
    if(r.ok!==false) go(TAB);
  }catch(e){ card.innerHTML='<span style="color:#f0b866">'+esc(e.message)+'</span>'; }
}

/* ---------- boot ---------- */
async function startApp(){
  el('login').classList.add('hidden'); el('app').classList.remove('hidden');
  el('who').textContent=EMAIL;
  await loadLocations();
  go('dashboard');
}
var LOAD_ERR='';
async function loadLocations(){
  LOAD_ERR='';
  try{
    var res=await api('locations.list',{});
    var arr=(res.data&&(res.data.locations||res.data))||[];
    LOCS=Array.isArray(arr)?arr:[];
    var sel=el('locSel');
    if(!LOCS.length){ sel.innerHTML='<option value="">No clients found</option>'; if(res.ok===false) LOAD_ERR='GHL returned HTTP '+res.status; return; }
    sel.innerHTML=LOCS.map(function(l){return '<option value="'+esc(l.id)+'">'+esc(l.name||l.id)+'</option>';}).join('');
    var saved=localStorage.getItem('agency_loc');
    CURLOC=(saved&&LOCS.some(function(l){return l.id===saved;}))?saved:LOCS[0].id;
    sel.value=CURLOC;
  }catch(e){ el('locSel').innerHTML='<option value="">Error</option>'; LOAD_ERR=e.message; }
}
function onLocChange(){CURLOC=el('locSel').value;localStorage.setItem('agency_loc',CURLOC);window._wfs=null;if(TAB!=='clients')go(TAB);}
function go(tab){
  TAB=tab;
  var btns=el('nav').querySelectorAll('button'); for(var i=0;i<btns.length;i++) btns[i].classList.toggle('on',btns[i].getAttribute('data-tab')===tab);
  if(tab==='dashboard')viewDashboard();
  else if(tab==='clients')viewClients();
  else if(tab==='contacts')viewContacts();
  else if(tab==='conversations')viewConversations();
  else if(tab==='pipelines')viewPipelines();
  else if(tab==='forms')viewForms();
  else if(tab==='fields')viewFields();
  else if(tab==='calendars')viewCalendars();
  else if(tab==='activity')viewActivity();
}

/* ---------- Activity (audit log) + AI Memory ---------- */
async function viewActivity(){
  el('view').innerHTML='<h2>Activity &amp; Memory</h2>'
    +'<h3 style="font-size:14px;margin:6px 0 8px">🧠 What your AI remembers</h3><div id="memlist" class="muted">Loading…</div>'
    +'<div class="bar" style="margin-top:8px"><input id="mem-new" placeholder="Teach it something to remember forever…" style="flex:1"><button class="btn pri" onclick="addMemory()">Remember</button></div>'
    +'<h3 style="font-size:14px;margin:20px 0 8px">📜 Recent actions (audit log)</h3><div id="audlist" class="muted">Loading…</div>';
  try{
    var m=await api('memory.list',{});
    var rows=(m.data||[]);
    el('memlist').innerHTML=rows.length?'<table><tbody>'+rows.map(function(x){return '<tr><td>'+esc(x.note)+'</td><td class="muted" style="font-size:11px;white-space:nowrap">'+esc((x.created_at||'').slice(0,10))+'</td><td style="text-align:right"><button class="rowbtn dng" onclick="delMemory(\''+esc(x.id)+'\')">Forget</button></td></tr>';}).join('')+'</tbody></table>':'<div class="muted">Nothing yet — tell the AI "remember that…" or add one below.</div>';

}
function filterContacts(q){q=(q||'').toLowerCase();drawContacts((window._cts||[]).filter(function(c){return JSON.stringify(c).toLowerCase().indexOf(q)>=0;}));}
function toggleAll(on){var b=document.querySelectorAll('.csel');for(var i=0;i<b.length;i++)b[i].checked=on;selCount();}
function selCount(){var n=document.querySelectorAll('.csel:checked').length;var s=el('selcount');if(s)s.textContent=n+' selected';}
function selectedIds(){var r=[],b=document.querySelectorAll('.csel:checked');for(var i=0;i<b.length;i++)r.push(b[i].value);return r;}
async function bulkTag(){
  var ids=selectedIds(); if(!ids.length){alert('Select contacts first.');return;}
  var tags=el('bulktags').value.trim(); if(!tags){alert('Enter tags.');return;}
  if(!confirm('Tag '+ids.length+' contact(s) with: '+tags+'?'))return;
  var ok=0; for(var i=0;i<ids.length;i++){var res=await api('contacts.tag',{id:ids[i],tags:tags}); if(res.ok)ok++;}
  alert('Tagged '+ok+' of '+ids.length+'.'); viewContacts();
}
async function bulkEnroll(){
  var ids=selectedIds(); if(!ids.length){alert('Select contacts first.');return;}
  var wf=el('bulkwf').value; if(!wf){alert('Pick a workflow.');return;}
  if(!confirm('Enroll '+ids.length+' contact(s) into the selected workflow?'))return;
  var ok=0; for(var i=0;i<ids.length;i++){var res=await api('workflows.enroll',{contactId:ids[i],workflowId:wf}); if(res.ok)ok++;}
  alert('Enrolled '+ok+' of '+ids.length+'.');
}
async function noteContact(id){
  var body=prompt('Note for this contact:'); if(!body)return;
  var res=await api('notes.create',{contactId:id,body:body}); alert(res.ok?'Note added.':'Failed: '+JSON.stringify(res.data).slice(0,160));
}
async function taskContact(id){
  var title=prompt('Task title:'); if(!title)return;
  var due=prompt('Due date (YYYY-MM-DD), or leave blank:')||'';
  var args={contactId:id,title:title}; if(due)args.dueDate=due+'T09:00:00.000Z';
  var res=await api('tasks.create',args); alert(res.ok?'Task created.':'Failed: '+JSON.stringify(res.data).slice(0,160));
}
async function addContact(){
  var name=el('nn').value.trim(); if(!name){alert('Enter a name.');return;}
  var res=await api('contacts.create',{locationId:CURLOC,name:name,phone:el('np').value.trim(),email:el('ne').value.trim()});
  if(res.ok)viewContacts();else alert('Add failed: '+JSON.stringify(res.data).slice(0,200));
}
async function delContact(id){
  if(!confirm('Delete this contact?'))return;
  var res=await api('contacts.delete',{id:id});
  if(res.ok)viewContacts();else alert('Delete failed.');
}

/* ---------- Conversations ---------- */
async function viewConversations(){
  if(!CURLOC){el('view').innerHTML='<h2>Conversations</h2><div class="empty">Pick a client first.</div>';return;}
  el('view').innerHTML='<h2>Conversations</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div id="convs" class="muted">Loading…</div><div id="thread" class="muted">Pick a conversation.</div></div>';
  var res;
  try{ res=await api('conversations.list',{locationId:CURLOC}); }
  catch(e){ el('convs').innerHTML=viewErr(e); return; }
  if(res.ok===false){ el('convs').innerHTML=viewErr(null,res); return; }
  var arr=(res.data&&(res.data.conversations||res.data))||[];
  if(!Array.isArray(arr))arr=[];
  window._convs=arr;
  if(!arr.length){el('convs').innerHTML='<div class="empty">No conversations.</div>';return;}
  el('convs').innerHTML='<table><tbody>'+arr.map(function(c,i){
    return '<tr style="cursor:pointer" onclick="openThread('+i+')"><td><div>'+esc(c.fullName||c.contactName||c.name||'—')+'</div><div class="muted" style="font-size:12px">'+esc((c.lastMessageBody||c.last||'').slice(0,60))+'</div></td></tr>';}).join('')+'</tbody></table>';
}
async function openThread(i){
  var c=(window._convs||[])[i]; if(!c)return;
  window._curConv=c;
  el('thread').classList.remove('muted');
  el('thread').innerHTML='<div style="font-weight:600;margin-bottom:8px">'+esc(c.fullName||c.contactName||c.name||'—')+'</div><div id="tmsgs" class="muted">Loading…</div>'
    +'<div class="bar" style="margin-top:10px"><select id="mtype" class="btn" style="padding:9px"><option>SMS</option><option>Email</option></select><input id="mbody" placeholder="Type a message…" style="flex:1"><button class="btn pri" onclick="sendMsg()">Send</button></div>';
  var res=await api('conversations.messages',{id:c.id});
  var msgs=(res.data&&(res.data.messages&&(res.data.messages.messages||res.data.messages)||res.data))||[];
  if(!Array.isArray(msgs))msgs=[];
  el('tmsgs').innerHTML=msgs.length?msgs.map(function(m){var out=(m.direction==='outbound');return '<div style="margin:6px 0;text-align:'+(out?'right':'left')+'"><span style="display:inline-block;background:'+(out?'var(--pri)':'var(--soft)')+';color:'+(out?'#fff':'var(--ink)')+';padding:7px 11px;border-radius:10px;max-width:80%">'+esc(m.body||m.message||'')+'</span></div>';}).join(''):'<div class="muted">No messages.</div>';
}
async function sendMsg(){
  var c=window._curConv; if(!c)return;
  var body=el('mbody').value.trim(); if(!body)return;
  var cid=c.contactId||c.contact_id; if(!cid){alert('No contact id on this conversation.');return;}
  var res=await api('conversations.send',{contactId:cid,type:el('mtype').value,message:body});
  if(res.ok){el('mbody').value='';alert('Sent.');}else alert('Send failed: '+JSON.stringify(res.data).slice(0,200));
}

/* ---------- Pipelines & Workflows (move deals between stages) ---------- */
async function viewPipelines(){
  if(!CURLOC){el('view').innerHTML='<h2>Pipelines & Workflows</h2><div class="empty">Pick a client first.</div>';return;}
  el('view').innerHTML='<h2>Pipelines & Workflows</h2><div id="pp" class="muted">Loading…</div>';
  var pipes,opps,wfs;
  try{
    pipes=await api('pipelines.list',{locationId:CURLOC});
    opps=await api('opportunities.list',{locationId:CURLOC});
    wfs=await api('workflows.list',{locationId:CURLOC});
  }catch(e){ el('pp').innerHTML=viewErr(e); return; }
  if(pipes.ok===false&&opps.ok===false){ el('pp').innerHTML=viewErr(null,pipes); return; }
  var pl=(pipes.data&&(pipes.data.pipelines||pipes.data))||[]; if(!Array.isArray(pl))pl=[];
  var ol=(opps.data&&(opps.data.opportunities||opps.data))||[]; if(!Array.isArray(ol))ol=[];
  var wl=(wfs.data&&(wfs.data.workflows||wfs.data))||[]; if(!Array.isArray(wl))wl=[];
  window._pipes=pl;
  // build stage lookups
  var stageName={}; pl.forEach(function(p){(p.stages||[]).forEach(function(s){stageName[s.id]=s.name;});});
  function stageSelect(o){
    var p=pl.filter(function(x){return x.id===o.pipelineId;})[0]||pl[0]; if(!p)return '';
    var opts=(p.stages||[]).map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===o.pipelineStageId?' selected':'')+'>'+esc(s.name)+'</option>';}).join('');
    return '<select class="btn" style="padding:7px" onchange="moveDeal(\''+esc(o.id)+'\',\''+esc(p.id)+'\',this.value)">'+opts+'</select>';
  }
  el('pp').innerHTML=
    '<h3 style="margin:6px 0 8px;font-size:14px">Opportunities ('+ol.length+') — change the stage to move a deal</h3>'
    +(ol.length?'<table><thead><tr><th>Deal</th><th>Value</th><th>Stage</th><th>Status</th></tr></thead><tbody>'+ol.map(function(o){
        return '<tr><td>'+esc(o.name||o.contact&&o.contact.name||'—')+'</td><td class="muted">'+(o.monetaryValue?('$'+o.monetaryValue):'')+'</td><td>'+stageSelect(o)+'</td>'
          +'<td><select class="btn" style="padding:7px" onchange="dealStatus(\''+esc(o.id)+'\',this.value)">'+['open','won','lost','abandoned'].map(function(s){return '<option'+(o.status===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></td></tr>';}).join('')+'</tbody></table>':'<div class="muted">No opportunities.</div>')
    +'<h3 style="margin:20px 0 8px;font-size:14px">Pipelines</h3>'+(pl.length?'<table><tbody>'+pl.map(function(p){return '<tr><td>'+esc(p.name||p.id)+'<span class="muted" style="font-size:12px"> — '+((p.stages||[]).length)+' stages</span></td></tr>';}).join('')+'</tbody></table>':'<div class="muted">None.</div>')
    +'<h3 style="margin:20px 0 8px;font-size:14px">Workflows</h3>'+(wl.length?'<table><thead><tr><th>Name</th><th>ID</th></tr></thead><tbody>'+wl.map(function(w){return '<tr><td>'+esc(w.name||'—')+'</td><td class="muted">'+esc(w.id)+'</td></tr>';}).join('')+'</tbody></table>':'<div class="muted">None. Build workflows in GHL; enroll contacts from the Contacts tab.</div>');
}
async function moveDeal(id,pipelineId,stageId){
  var res=await api('opportunities.move',{id:id,pipelineId:pipelineId,pipelineStageId:stageId});
  if(!res.ok)alert('Move failed: '+JSON.stringify(res.data).slice(0,200));
}
async function dealStatus(id,status){
  var res=await api('opportunities.status',{id:id,status:status});
  if(!res.ok)alert('Status change failed: '+JSON.stringify(res.data).slice(0,200));
}

/* ---------- Forms & Submissions ---------- */
async function viewForms(){
  if(!CURLOC){el('view').innerHTML='<h2>Forms</h2><div class="empty">Pick a client first.</div>';return;}
  el('view').innerHTML='<h2>Forms &amp; Submissions</h2><div class="muted" style="margin-bottom:10px">Form design is built in GHL; here you can see forms and the leads they captured.</div><div id="fm">Loading…</div>';

    +(subs.length?'<table><thead><tr><th>Contact</th><th>Form</th><th>When</th></tr></thead><tbody>'+subs.slice(0,50).map(function(s){return '<tr><td>'+esc(s.contactName||s.name||(s.contact&&s.contact.name)||'—')+'</td><td class="muted">'+esc(s.formName||s.formId||'')+'</td><td class="muted">'+esc((s.createdAt||s.dateAdded||'').slice(0,10))+'</td></tr>';}).join('')+'</tbody></table>':'<div class="muted">No submissions.</div>');
}

/* ---------- Custom Fields ---------- */

  if(!CURLOC){el('view').innerHTML='<h2>Custom Fields</h2><div class="empty">Pick a client first.</div>';return;}

    +'<div class="bar"><input id="cf-name" placeholder="New field name"><select id="cf-type" class="btn" style="padding:9px"><option value="TEXT">Text</option><option value="NUMERICAL">Number</option><option value="PHONE">Phone</option><option value="EMAIL">Email</option><option value="DATE">Date</option><option value="LARGE_TEXT">Large text</option></select><button class="btn pri" onclick="addField()">+ Add field</button></div>'
    +'<div id="cflist">Loading…</div>';
  loadFields();
}
async function loadFields(){
  var res; try{ res=await api('customfields.list',{}); }catch(e){ el('cflist').innerHTML=viewErr(e); return; }
  if(res.ok===false){ el('cflist').innerHTML=viewErr(null,res); return; }
  var f=(res.data&&(res.data.customFields||res.data))||[]; if(!Array.isArray(f))f=[];
  el('cflist').innerHTML=f.length?'<table><thead><tr><th>Name</th><th>Type</th><th></th></tr></thead><tbody>'+f.map(function(x){return '<tr><td>'+esc(x.name||'—')+'</td><td class="muted">'+esc(x.dataType||'')+'</td><td style="text-align:right"><button class="rowbtn dng" onclick="delField(\''+esc(x.id)+'\')">Delete</button></td></tr>';}).join('')+'</tbody></table>':'<div class="muted">No custom fields.</div>';
}
async function addField(){
  var name=el('cf-name').value.trim(); if(!name){alert('Enter a field name.');return;}
  var res=await api('customfields.create',{name:name,dataType:el('cf-type').value});
  if(res.ok)viewFields();else alert('Add failed: '+JSON.stringify(res.data).slice(0,200));
}
async function delField(id){ if(!confirm('Delete this custom field?'))return; var res=await api('customfields.delete',{id:id}); if(res.ok)viewFields();else alert('Delete failed.'); }

function logMsg(m){var l=el('log'); if(l){l.classList.remove('hidden'); l.textContent+=(l.textContent?'\n':'')+m;}}

if(TOKEN){startApp();}
