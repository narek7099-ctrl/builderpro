<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap"><link rel="icon" href="assets/brand/logo-mark-64.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* Same theme as builderpro-os.com: light, #edf2f6 canvas, white 16px panels,
   navy ink, one blue accent, pill buttons, General Sans + Geist. */
:root{--bg:#edf2f6;--bg2:#f6f8fb;--card:#ffffff;--card2:#f4f7fa;--line:#dce3ec;--line2:#cfd8e3;--ink:#001530;--mut:#788493;--dim:#9aa3b1;
  --pri:#006fff;--pri-d:#003db8;--pri-ink:#ffffff;--pri-soft:rgba(0,111,255,.14);--ok:#1faa5a;--warn:#c98a0b;--danger:#e0574e;--pill:#0b1021;
  --r1:10px;--r2:16px;--sans:'General Sans','Geist',system-ui,sans-serif;--mono:'Geist',ui-sans-serif,system-ui,sans-serif;--ease:cubic-bezier(.39,.575,.565,1)}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:light}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--mut)}
.num,.kpi .v,td.muted,.bstat{font-variant-numeric:tabular-nums}
.btn{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 18px;color:var(--ink);font-weight:500;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--line2);background:var(--bg2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:600}
.btn.pri:hover{background:var(--pri-d);border-color:var(--pri-d)}
.btn.ok{background:var(--pill);border-color:var(--pill);color:#fff;font-weight:600}
.btn.sm{padding:6px 13px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
input,textarea,select{background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:var(--r1);padding:9px 12px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,textarea:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.login{min-height:100dvh;display:grid;place-items:center;padding:16px}
.login .card{width:100%;max-width:360px;padding:28px}
.login h2{font-size:20px;font-weight:600;letter-spacing:-.02em}
.login label{display:block;font-size:12.5px;color:var(--mut);margin:14px 0 6px;font-weight:500}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:1em}
.top{display:flex;align-items:center;gap:12px;height:64px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
.top>b{font-weight:600;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}.top .bp b{font-weight:600}
.top b img{width:28px;height:28px}.top b .bp b{color:var(--pri)}
.top b span.sub{color:var(--mut);font-weight:400}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 20px;background:transparent}
.tabs button{background:none;border:1px solid transparent;border-radius:999px;padding:8px 16px;color:var(--mut);white-space:nowrap;font-weight:500;transition:color .15s,background .2s,border-color .2s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);background:#fff;border-color:var(--line)}
.tabs .n{background:var(--pri);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:6px;font-weight:600}
main{padding:14px 20px 32px;max-width:1240px;margin:0 auto;animation:enter .45s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
h2{font-size:22px;font-weight:600;letter-spacing:-.025em;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;margin-bottom:18px}
.kpis .kpi{background:var(--card);border:0;border-radius:0;padding:14px 16px}
.kpi .l{font-size:12.5px;color:var(--mut)}
.kpi .v{font:600 28px/1.2 var(--sans);letter-spacing:-.03em;margin-top:4px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 10px;vertical-align:top}
tbody tr+tr td{border-top:1px solid var(--line)}
tbody tr:hover td{background:var(--bg2)}
th{font-size:12px;color:var(--mut);font-weight:500;border-bottom:1px solid var(--line2)}
.tw{overflow-x:auto}
.st{font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.bad{color:var(--danger)}.st.off{color:var(--mut)}
/* ---- the org board ---- */
.bhead{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.bhead h2{margin:0}
.bhead p{color:var(--mut);font-size:13px}
.sw{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);cursor:pointer;user-select:none}
.sw input{appearance:none;width:32px;height:18px;border-radius:9px;background:var(--line2);border:0;padding:0;position:relative;cursor:pointer;transition:background .2s}
.sw input:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.sw input:checked{background:var(--pri)}.sw input:checked:after{transform:translateX(14px)}
.board{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);overflow:auto}
.board{background:#fff}.board:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#dce3ec 1px,transparent 1px);background-size:20px 20px;pointer-events:none;mask-image:radial-gradient(80% 70% at 50% 40%,#000,transparent)}
.board{overflow:hidden}.board-in{position:relative;width:1120px;height:700px}
.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ln{fill:none;stroke:var(--line2);stroke-width:1.25}
.ln.tool{stroke-dasharray:3 4;stroke:#cfd8e3}
.ln.hot{stroke:var(--pri);stroke-width:1.5;stroke-dasharray:4 8;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.pk{fill:var(--pri);opacity:.45}
.pk.hot{fill:var(--pri);opacity:1}
.nd{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;color:var(--ink);opacity:0;animation:pop .6s var(--ease) forwards;animation-delay:var(--dl,0s)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-44%)}to{opacity:1;transform:translate(-50%,-50%)}}
.nd .box{background:var(--card);border:1px solid var(--line2);border-radius:var(--r2);padding:11px 12px;display:flex;align-items:center;gap:11px;width:196px;position:relative;text-align:left;transition:border-color .2s,transform .2s var(--ease),background .2s}
.nd:hover .box{border-color:var(--pri);box-shadow:0 8px 24px -12px rgba(0,21,48,.25);transform:translateY(-2px);background:var(--card2)}
.nd.on .box{border-color:var(--pri)}
.nd.lead .box{width:216px;padding:13px 14px}
.nd .ico{width:36px;height:36px;border-radius:var(--r1);display:grid;place-items:center;flex:none;background:#e6f0ff;border:0;color:var(--pri);color:var(--ink);font-size:18px}
.nd.lead .ico{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.nd .t{font-weight:600;font-size:13.5px;white-space:nowrap;letter-spacing:-.01em}
.nd .s{font-size:12px;color:var(--mut);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd.work .box{border-color:rgba(0,111,255,.5)}
.nd.work .box:after{content:"";position:absolute;inset:-1px;border-radius:inherit;border:1px solid var(--pri);animation:ring 1.6s var(--ease) infinite;pointer-events:none}
@keyframes ring{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.06,1.18)}}
.nd.work .s{color:var(--pri)}
.nd .badge{position:absolute;top:-8px;right:-8px;background:var(--danger);color:#fff;font:600 10.5px/18px var(--sans);border-radius:9px;min-width:18px;padding:0 5px;text-align:center}
.tl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--ink);width:78px;text-align:center;opacity:0;animation:fade .6s var(--ease) forwards;animation-delay:var(--dl,0s)}
@keyframes fade{to{opacity:1}}
.tl i{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line2);display:grid;place-items:center;font-size:18px;color:var(--mut);font-style:normal}
.tl small{color:var(--dim);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78px;margin-top:-3px}
.tl.soon{opacity:0;animation-name:fadeSoon}
@keyframes fadeSoon{to{opacity:.4}}
.tl.soon i{border-style:dashed}
.bstat{position:absolute;left:18px;bottom:14px;font:500 12.5px var(--sans);color:var(--dim);display:flex;gap:18px}
.bstat b{color:var(--mut);font-weight:500}
.bstat .on{color:var(--ok)}
/* ---- chat drawer ---- */
.scrim{position:fixed;inset:0;background:rgba(0,21,48,.25);opacity:0;pointer-events:none;transition:opacity .3s;z-index:19}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);background:#fff;box-shadow:-20px 0 60px -20px rgba(0,21,48,.25);border-left:1px solid var(--line);z-index:20;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .45s var(--ease)}
.drawer.open{transform:none}
.drawer .hd{display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;border-bottom:1px solid var(--line)}
.drawer .hd b{display:flex;align-items:center;gap:9px;font-weight:600}
.drawer .hd b i{font-size:18px;color:var(--pri)}
.drawer .hd select{width:auto;max-width:200px;padding:5px 8px;font-size:12.5px;margin-left:auto}
.xbtn{background:none;border:0;color:var(--mut);font-size:18px;width:30px;height:30px;border-radius:var(--r1);display:grid;place-items:center}
.xbtn:hover{background:var(--card2);color:var(--ink)}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.m{max-width:100%;animation:enter .35s var(--ease)}
.m.user{align-self:flex-end;max-width:85%;background:var(--pri);color:#fff;border:0;border-radius:var(--r2);padding:9px 13px;white-space:pre-wrap}
.m.assistant{align-self:flex-start;line-height:1.6}
.m.sys{align-self:flex-start;font:500 12.5px var(--sans);color:var(--mut)}
.m.sys.busy:after{content:"";display:inline-block;width:6px;height:12px;background:var(--pri);margin-left:6px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.m.assistant h3,.m.assistant h4{font-size:14px;font-weight:600;margin:10px 0 4px}
.m.assistant ul,.m.assistant ol{padding-left:20px;margin:4px 0}
.m.assistant p{margin:4px 0}
.m.assistant a{color:var(--pri)}
.m.assistant code{background:var(--bg2);padding:1px 5px;border-radius:4px;font:12.5px ui-monospace,Menlo,monospace}
.tools{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.tools span{font:500 11.5px var(--sans);background:var(--bg2);color:var(--dim);border:1px solid var(--line);border-radius:var(--r1);padding:1px 7px}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.compose textarea{resize:none;height:44px}
.intro{color:var(--mut);font-size:13px}
.hint{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.hint button{text-align:left;font-size:13px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:var(--r1);padding:9px 12px;transition:border-color .15s,background .15s}
.hint button:hover{border-color:var(--line2);background:var(--card2)}
.appr{display:flex;flex-direction:column;gap:10px}
.appr .card{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.appr pre{white-space:pre-wrap;font:12px ui-monospace,Menlo,monospace;color:var(--mut);background:var(--bg2);border:1px solid var(--line);border-radius:var(--r1);padding:10px;max-height:160px;overflow:auto;width:100%}
.pill{font-size:12px;border-radius:var(--r1);padding:1px 8px;background:var(--card2);border:1px solid var(--line2);color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{padding:28px;text-align:center;color:var(--mut)}
.warnbar{background:#fff8e6;border-bottom:1px solid #f1dfae;color:#6b4a00;padding:10px 24px;font-size:13px}
.warnbar b{color:#3d2a00}
@media (max-width:760px){.grid2{grid-template-columns:1fr}main{padding:16px}.top{padding:0 16px}.top .sub,#who{display:none}.btn{white-space:nowrap}.nd.work .box:after{display:none}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}.pk{display:none}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="card">
    <img src="assets/brand/logo-mark-64.png" alt="" width="36" height="36" style="margin-bottom:14px"><h2>Command Center</h2>
    <div class="muted" style="font-size:13px;margin-top:2px">Sign in with your owner account.</div>
    <label>Email</label><input id="email" type="email" autocomplete="username">
    <label>Password</label><input id="pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn pri" style="width:100%;margin-top:16px" onclick="doLogin()">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="top"><b><img src="assets/brand/logo-mark-64.png" alt=""><span class="bp">Builder<b>Pro</b></span> <span class="sub">Command Center</span></b><span class="muted" id="who" style="margin-left:auto;font-size:12px"></span><button class="btn sm" onclick="doLogout()">Sign out</button></div>
  <div class="tabs" id="tabs"></div>
  <div id="warn"></div>
  <main id="view"></main>
</div>

<script>
var SB_URL="https://ttzwzouhiwdwamuimhpo.supabase.co";
var SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0end6b3VoaXdkd2FtdWltaHBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMTc2NjgsImV4cCI6MjA5ODY5MzY2OH0.oVqdHZlZLWJd_8nkgPRA9VgAqY4ytg51N1mT3Hqekso";
var TOKEN=localStorage.getItem('cc_tok')||'', RTOK=localStorage.getItem('cc_rtok')||'';
var ME=null, TAB='team', AGENT='ceo', THREAD=null, BUSY=false, PENDING=0;
var AG={ceo:{c:'#e8612c',d:'Runs the company, delegates to the teams',h:['What should we focus on this week?','Get every team to report on where we stand','Which trials should we save before they end?']},
  sales:{c:'#1f9d60',d:'Trials into customers',h:['Which trials end in the next 3 days?','Write a follow-up for trials that went quiet','Draft a call script for a roofer on day 10 of the trial']},
  marketing:{c:'#7c5cff',d:'Ads, copy and SEO',h:['Write 3 Facebook ads for plumbers','Plan a 30-day content calendar','How do competitors position themselves?']},
  support:{c:'#2f80ed',d:'Client setup and fixes',h:['Any open support or cancellation requests?','Check which clients have no AI receptionist','Who is waiting on a business number?']},
  builder:{c:'#c98a0b',d:'Builds GHL accounts',h:['Audit the newest client sub-account setup','Add standard roofing tags to a client','Fill in a client\'s AI receptionist knowledge']},
  research:{c:'#8a8f98',d:'Markets and competitors',h:['Top 5 lead sources for HVAC contractors in 2026','Compare our pricing with Jobber and ServiceTitan','Which trades grow fastest in Texas?']}};
var ICON={ceo:'ti-briefcase',sales:'ti-trending-up',marketing:'ti-speakerphone',support:'ti-headset',builder:'ti-hammer',research:'ti-telescope'};
var NAMES={ceo:'CEO',sales:'Sales Team',marketing:'Marketing Team',support:'Support Team',builder:'Builder Team',research:'Research Team'};

function el(i){return document.getElementById(i)}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function md(t){
  var h=esc(t||'');
  h=h.replace(/```([\s\S]*?)```/g,function(_,c){return '<pre style="white-space:pre-wrap;background:var(--soft);padding:8px;border-radius:8px;font-size:12px">'+c+'</pre>'});
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  var out=[],list=null;
  h.split('\n').forEach(function(l){
    var m;
    if(m=l.match(/^\s*[-*] (.*)/)){ if(list!=='ul'){if(list)out.push('</'+list+'>');out.push('<ul>');list='ul'} out.push('<li>'+m[1]+'</li>'); return; }
    if(m=l.match(/^\s*\d+[.)] (.*)/)){ if(list!=='ol'){if(list)out.push('</'+list+'>');out.push('<ol>');list='ol'} out.push('<li>'+m[1]+'</li>'); return; }
    if(list){out.push('</'+list+'>');list=null}
    if(m=l.match(/^#{1,2} (.*)/)) out.push('<h3>'+m[1]+'</h3>');
    else if(m=l.match(/^#{3,6} (.*)/)) out.push('<h4>'+m[1]+'</h4>');
    else if(l.trim()) out.push('<p>'+l+'</p>');
  });
  if(list)out.push('</'+list+'>');
  return out.join('');
}

async function doLogin(){
  var e=el('email').value.trim(),p=el('pass').value; el('loginErr').textContent='';
  try{
    var r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_ANON,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});
    var d=await r.json(); if(!r.ok||!d.access_token){el('loginErr').textContent=d.error_description||d.msg||'Sign-in failed.';return}
    TOKEN=d.access_token;RTOK=d.refresh_token||'';localStorage.setItem('cc_tok',TOKEN);localStorage.setItem('cc_rtok',RTOK);start();
  }catch(x){el('loginErr').textContent='Network error.'}
}
function doLogout(){localStorage.removeItem('cc_tok');localStorage.removeItem('cc_rtok');location.reload()}
async function refresh(){
  if(!RTOK)return false;
  var r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_ANON,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:RTOK})});
  var d=await r.json().catch(function(){return {}}); if(!r.ok||!d.access_token)return false;
  TOKEN=d.access_token;RTOK=d.refresh_token||RTOK;localStorage.setItem('cc_tok',TOKEN);localStorage.setItem('cc_rtok',RTOK);return true;
}
async function call(fn,body,retried){
  var r=await fetch(SB_URL+'/functions/v1/'+fn,{method:'POST',headers:{Authorization:'Bearer '+TOKEN,apikey:SB_ANON,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===403&&!retried&&await refresh())return call(fn,body,true);
  var d=await r.json().catch(function(){return {ok:false,error:'HTTP '+r.status}});
  if(r.status===403&&!retried)d.denied=true;
  return d;
}
var api=function(b){return call('command',b)};

async function start(){
  el('login').classList.add('hidden');
  var me=await api({op:'me'});
  if(!me.ok){ el('login').classList.remove('hidden'); el('loginErr').textContent=me.denied?'This login is not an admin.':(me.error||'Could not sign in.'); return; }
  ME=me; el('app').classList.remove('hidden'); el('who').textContent=me.email;
  var w=[]; if(!me.ai)w.push('Add <b>ANTHROPIC_API_KEY</b> in Supabase to Edge Functions to Secrets so the team can think.');
  /* each plan builds from its own template snapshot (Foundation, OS, Enterprise), set in sign-up */
  if(me.stripe===false)w.push('Add <b>STRIPE_SECRET_KEY</b> so sign-ups add a card for their trial.');
  el('warn').innerHTML=w.length?'<div class="warnbar">'+w.join(' ')+'</div>':'';
  countPending(); tab(TAB);
}
async function countPending(){ var r=await api({op:'approvals',status:'pending'}); PENDING=(r.data||[]).length; drawTabs(); }
function drawTabs(){
  var T=[['team','AI Team'],['approvals','Approvals'+(PENDING?'<span class="n">'+PENDING+'</span>':'')],['accounts','Accounts'],['phones','Phone numbers'],['memory','Memory'],['conn','Connections']];
  el('tabs').innerHTML=T.map(function(t){return '<button class="'+(t[0]===TAB?'on':'')+'" onclick="tab(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
}

  {k:'github',n:'GitHub',u:'https://api.githubcopilot.com/mcp/',t:['builder'],i:'ti-brand-github',d:'Your website code. Needs an access token.',token:1}];
async function viewConn(){
  el('view').innerHTML=(window._connNote||'')+'<h2>Connections</h2><div class="muted" style="margin:-6px 0 16px;max-width:70ch">Sign in once and your teams can use it from then on. Actions through these run right away (they skip Approvals), so each one only goes to the teams shown on it.</div>'
    +'<div id="svcGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:22px"><div class="muted">Loading…</div></div>'
    +'<details class="card" id="cfBox"><summary style="cursor:pointer;font-weight:600">Add another service or edit one</summary><input type="hidden" id="cfId">'
    +'<div class="grid2" style="margin-top:12px"><input id="cfLabel" placeholder="Name"><input id="cfUrl" placeholder="MCP server address (https://...)">'
    +'<input id="cfTok" type="password" placeholder="Access key (leave blank to sign in instead)" autocomplete="off"><input id="cfOff" placeholder="Actions to switch off (optional, comma separated)"></div>'
    +'<div style="margin:12px 0 6px;font-size:13px" class="muted">Which teams can use it</div><div style="display:flex;gap:12px;flex-wrap:wrap">'+TEAMKEYS.map(function(k){return '<label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" style="width:auto" data-team="'+k+'">'+NAMES[k]+'</label>'}).join('')+'</div>'
    +'<div style="display:flex;gap:8px;align-items:center;margin-top:14px"><button class="btn pri" onclick="connSave(this)">Save</button><span id="cfMsg" style="font-size:13px"></span></div></details>';
  window._connNote='';
  var r=await api({op:'mcp_list'}); var rows=r.data||[]; window._conns=rows;
  var byName={}; rows.forEach(function(x){byName[x.name]=x;});
  var cards=SERVICES.map(function(sv){return {sv:sv,x:byName[sv.k]}}).concat(rows.filter(function(x){return !SERVICES.some(function(sv){return sv.k===x.name})}).map(function(x){return {sv:{k:x.name,n:x.label||x.name,u:x.url,t:x.agents,i:'ti-plug-connected',d:x.url,token:!x.signin},x:x}}));
  var mt=r.meta||{};
  var metaCard='<div class="card" style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:10px;align-items:center"><span style="width:38px;height:38px;border-radius:10px;background:#e6f0ff;color:var(--pri);display:grid;place-items:center;font-size:20px"><i class="ti ti-brand-facebook"></i></span><div style="flex:1"><b>Facebook &amp; Instagram</b><div>'
    +(mt.connected?'<span class="st ok"><i class="ti ti-circle-check"></i>Connected</span>':!mt.ready?'<span class="st warn"><i class="ti ti-settings"></i>One-time setup</span>':'<span class="st off">Not connected</span>')+'</div></div></div>'
    +'<div class="muted" style="font-size:13px;min-height:2.6em">'+(mt.connected?esc((mt.pages||[]).join(', ')):'Post to your Page and Instagram, and see how posts do. Posts wait for your approval.')+'</div><div class="muted" style="font-size:12px">For: Marketing Team, CEO</div><div>'
    +(mt.connected?'<button class="btn sm" onclick="metaGo(this)">Sign in again</button> <button class="btn sm" onclick="metaOff()">Disconnect</button>'
      :!mt.ready?'<button class="btn sm pri" onclick="metaHow()">How to set up</button>':'<button class="btn sm pri" onclick="metaGo(this)">Sign in with Facebook</button>')+'</div></div>';
  window._metaRedirect=mt.redirect||'';
  el('svcGrid').innerHTML=metaCard+cards.map(function(c){
    var sv=c.sv,x=c.x,on=x&&x.connected&&x.enabled, teams=(x?x.agents:sv.t).map(function(k){return NAMES[k]||k}).join(', ');
    var st=on?'<span class="st ok"><i class="ti ti-circle-check"></i>Connected'+(x.stays?'':' ')+'</span>':x&&x.connected&&!x.enabled?'<span class="st off">Paused</span>':x&&x.error?'<span class="st warn"><i class="ti ti-alert-triangle"></i>Sign in again</span>':'<span class="st off">Not connected</span>';
    var btn=on?'<button class="btn sm" onclick="svcTeams(\''+sv.k+'\')">Teams</button> <button class="btn sm" onclick="svcOff(\''+sv.k+'\')">Disconnect</button>'
      :sv.token?'<button class="btn sm pri" onclick="svcToken(\''+sv.k+'\')">Add token</button>'
      :'<button class="btn sm pri" onclick="svcSignIn(\''+sv.k+'\',this)">Sign in with '+esc(sv.n)+'</button>';
    return '<div class="card" style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:10px;align-items:center"><span style="width:38px;height:38px;border-radius:10px;background:#e6f0ff;color:var(--pri);display:grid;place-items:center;font-size:20px"><i class="ti '+sv.i+'"></i></span><div style="flex:1"><b>'+esc(sv.n)+'</b><div>'+st+'</div></div></div>'
      +'<div class="muted" style="font-size:13px;min-height:2.6em">'+esc(sv.d)+'</div><div class="muted" style="font-size:12px">For: '+esc(teams||'no team yet')+'</div><div>'+btn+'</div></div>';
  }).join('');
}
async function metaGo(b){ b.disabled=true; b.textContent='Opening Facebook\u2026'; var r=await api({op:'meta_start'}); if(r.url){location.href=r.url;return;} alert(r.error||'Could not start.'); viewConn(); }
async function metaOff(){ if(!confirm('Disconnect Facebook & Instagram? Your teams can no longer post or read insights.'))return; await api({op:'meta_disconnect'}); viewConn(); }
function metaHow(){
  el('view').insertAdjacentHTML('afterbegin','<div class="card" id="metaHelp" style="margin-bottom:14px"><b>Facebook &amp; Instagram: one-time setup (about 10 minutes)</b><ol style="margin:10px 0 0 18px;line-height:1.8;font-size:14px">'
    +'<li>Your Instagram must be a <b>Business or Creator</b> account, linked to your Facebook Page (Instagram app: Settings, Account type and tools).</li>'
    +'<li>Go to <a href="https://developers.facebook.com/apps" target="_blank" rel="noopener">developers.facebook.com/apps</a>, click <b>Create app</b>, choose <b>Other</b> then <b>Business</b>, name it \u201cBuilderPro Command Center\u201d.</li>'
    +'<li>In the app, add <b>Facebook Login for Business</b>. Under its Settings, add this to <b>Valid OAuth Redirect URIs</b>:<br><code style="user-select:all;background:var(--bg2);padding:3px 6px;border-radius:6px;font-size:12px">'+esc(window._metaRedirect)+'</code></li>'
    +'<li>Also add <b>Instagram</b> (Instagram API with Facebook Login) to the app.</li>'
    +'<li>In <b>App settings \u2192 Basic</b>, copy the <b>App ID</b> and <b>App secret</b>. In Supabase \u2192 Edge Functions \u2192 Secrets add them as <code>META_APP_ID</code> and <code>META_APP_SECRET</code>.</li>'
    +'<li>Come back here and click <b>Sign in with Facebook</b>. Pick your Page and its Instagram when Facebook asks.</li></ol>'
    +'<div class="muted" style="font-size:13px;margin-top:8px">Leave the app in Development mode. As its admin you can post to your own Page and Instagram without Meta\u2019s app review.</div></div>');
  el('metaHelp').scrollIntoView({behavior:'smooth'});
}
function svcDef(k){ return SERVICES.filter(function(s){return s.k===k})[0]||(function(){var x=(window._conns||[]).filter(function(c){return c.name===k})[0];return x?{k:x.name,n:x.label,u:x.url,t:x.agents}:null})(); }
async function svcSignIn(k,b){
  var sv=svcDef(k), x=(window._conns||[]).filter(function(c){return c.name===k})[0];
  b.disabled=true; b.textContent='Opening sign-in…';
  var id=x&&x.id;
  if(!id){ var r=await api({op:'mcp_save',name:sv.k,label:sv.n,url:sv.u,agents:sv.t,enabled:true}); if(!r.ok){alert(r.error||'Could not set it up.');return viewConn();} id=r.id; }
  connSignIn(id,b);
}
async function svcToken(k){
  var sv=svcDef(k), x=(window._conns||[]).filter(function(c){return c.name===k})[0];
  var t=prompt('Paste your '+sv.n+' access token.'+(k==='github'?' Create one at github.com/settings/tokens (fine-grained, repo access).':'')); if(!t)return;
  var r=await api({op:'mcp_save',id:x&&x.id,name:sv.k,label:sv.n,url:sv.u,agents:x?x.agents:sv.t,token:t.trim(),enabled:true});
  if(!r.ok)alert(r.error||'Could not save.'); viewConn();
}
function svcTeams(k){ var i=(window._conns||[]).findIndex(function(c){return c.name===k}); if(i<0)return; el('cfBox').open=true; connEdit(i); }
async function svcOff(k){ var x=(window._conns||[]).filter(function(c){return c.name===k})[0]; if(!x||!confirm('Disconnect '+(x.label||x.name)+'? Your teams lose access right away.'))return; await api({op:'mcp_delete',id:x.id}); viewConn(); }
function connPreset(k){var p=PRESETS.filter(function(x){return x[0]===k})[0]; el('cfLabel').value=p[1]; if(p[2])el('cfUrl').value=p[2]; document.querySelectorAll('[data-team]').forEach(function(c){c.checked=c.getAttribute('data-team')===p[3];}); el('cfUrl').focus();}
function connEdit(i){var x=window._conns[i]; el('cfId').value=x.id; el('cfLabel').value=x.label||x.name; el('cfUrl').value=x.url; el('cfTok').value=''; el('cfOff').value=(x.disabled_tools||[]).join(', '); if(el('cfBox'))el('cfBox').scrollIntoView({behavior:'smooth'});
  document.querySelectorAll('[data-team]').forEach(function(c){c.checked=(x.agents||[]).indexOf(c.getAttribute('data-team'))>=0;});}
async function connSave(b){
  var label=el('cfLabel').value.trim(), id=el('cfId').value;
  var cur=id?window._conns.filter(function(x){return String(x.id)===id})[0]:null;
  var body={op:'mcp_save',id:id||undefined,name:cur?cur.name:label,label:label,url:el('cfUrl').value.trim(),token:el('cfTok').value.trim()||undefined,disabled_tools:el('cfOff').value,
    agents:[].slice.call(document.querySelectorAll('[data-team]:checked')).map(function(c){return c.getAttribute('data-team')}),enabled:cur?cur.enabled:true};
  b.disabled=true; var r=await api(body); b.disabled=false;
  if(!r.ok){el('cfMsg').style.color='var(--danger)';el('cfMsg').textContent=r.error||'Could not save.';return;}
  if(!body.token&&(!cur||!cur.connected)&&r.id)return connSignIn(r.id,b);
  viewConn();
}
async function connSignIn(id,b){ if(b){b.disabled=true;b.textContent='Opening sign-in\u2026';}
  var r=await api({op:'mcp_oauth_start',id:id});
  if(r.url){location.href=r.url;return;}
  if(b)b.disabled=false; alert(r.error||'Could not start sign-in.'); viewConn(); }
async function connToggle(i){var x=window._conns[i]; await api({op:'mcp_save',id:x.id,name:x.name,label:x.label,url:x.url,agents:x.agents,disabled_tools:x.disabled_tools,enabled:!x.enabled}); viewConn();}
async function connDel(id){ if(!confirm('Remove this connection? Teams lose access right away.'))return; await api({op:'mcp_delete',id:id}); viewConn(); }

(function(){var q=new URLSearchParams(location.search);var ok=q.get('connected'),er=q.get('conn_error');
  if(ok||er){TAB='conn';history.replaceState(null,'',location.pathname);window._connNote=ok?'<div class="warnbar" style="background:#e9f8ef;color:#0f5132;border-color:#b9e6c9">'+esc(ok)+' is connected. Your teams can use it now, and it stays connected.</div>':'<div class="warnbar" style="background:#fdecec;color:#7a1f1f;border-color:#f3c2c2">Sign-in didn\u2019t finish: '+esc(er)+'</div>';}})();
if(TOKEN)start();
</script>
</body>
</html>
