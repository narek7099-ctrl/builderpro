<!-- ROOF SCAN — injected into the roofing estimator by tools/inject-roof-scan.py.
     Edit this file, then run:  python3 tools/inject-roof-scan.py && python3 tools/build-embeds.py

     The homeowner traces the roof on the satellite map (tap each corner, tap
     the first one to close), and only then does the scan run. The house in
     the scan rises from THAT outline; the slope, and hip or gable, come from
     the satellite read (Google Solar, through the rapid-handler function),
     which loads in the background while they trace. Roof area is the traced
     plan area over cos(pitch); with no satellite read, a typical 22°.

     The 15 seconds are deliberate. A number that appears instantly reads as
     a guess; one that visibly took work reads as measured. The steps name
     what really happened.

     The trace controller and its CSS sit inside the block shared with the
     house scan (tools/build-house-scan.py), so pool and landscaping trace
     the yard with the same map tools. -->
<style id="rs-style">
/* The main site's own tokens (index.html :root): Geist, ink #001530, grey
   #788493, hairline #dce3ec, blue #006fff, and its one easing curve.
   White on white; the house carries the depth, not the frame. */
#est-embed .rs-stage,#est-embed .rs-result{--rs-ink:#001530;--rs-grey:#788493;--rs-line:#dce3ec;--rs-line2:#eef1f6;--rs-blue:#006fff;--rs-blue-l:#e6f0ff;--rs-ease:cubic-bezier(.22,1,.36,1);
  font-family:'Geist',system-ui,-apple-system,sans-serif;}
#est-embed .e-addrpanel.rs-mode #e-mapwrap,
#est-embed .e-addrpanel.rs-mode .e-flatrow,
#est-embed .e-addrpanel.rs-mode #e-mresult,
#est-embed .e-addrpanel.rs-mode #e-slopecard,
#est-embed .e-addrpanel.rs-mode #e-manualbtn,
#est-embed .e-addrpanel.rs-mode #e-sldwrap{display:none !important;}
#est-embed .rs-stage{display:none;position:relative;margin:14px 0 6px;border:1px solid var(--rs-line);border-radius:18px;overflow:hidden;background:#fff;color:var(--rs-ink);}
#est-embed .rs-stage.on{display:block;animation:rsIn .6s var(--rs-ease) both;}
@keyframes rsIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#est-embed .rs-canvas-wrap{position:relative;height:300px;}
#est-embed .rs-canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
#est-embed .rs-addr{position:absolute;left:18px;top:16px;right:18px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--rs-grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#est-embed .rs-addr i{flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:var(--rs-blue);}
#est-embed .rs-readout{position:absolute;right:18px;bottom:16px;text-align:right;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .5s var(--rs-ease);}
#est-embed .rs-readout.on{opacity:1;}

#est-embed .rs-panel{padding:16px 18px 18px;border-top:1px solid var(--rs-line2);}
/* the loading line: one label, a percentage, a bar */
#est-embed .rs-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;}
#est-embed .rs-row b{font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--rs-ink);}
#est-embed .rs-row span{font-size:13px;font-weight:500;color:var(--rs-grey);font-variant-numeric:tabular-nums;}
#est-embed .rs-bar{height:4px;border-radius:4px;background:var(--rs-line2);overflow:hidden;}
#est-embed .rs-bar i{display:block;height:100%;width:0;border-radius:4px;background:var(--rs-blue);transition:width .3s linear;}
@media(max-width:560px){#est-embed .rs-canvas-wrap{height:250px;}}
/* the measurements, once the scan has finished */
#est-embed .rs-result{display:none;}
#est-embed .rs-result.on{display:block;animation:rsIn .5s var(--rs-ease) both;}
#est-embed .rs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
#est-embed .rs-grid div{border:1px solid var(--rs-line);border-radius:12px;padding:12px 14px;background:#fff;}
#est-embed .rs-grid b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--rs-ink);font-variant-numeric:tabular-nums;}

@media(max-width:560px){#est-embed .rs-grid{grid-template-columns:repeat(2,1fr);}}
#est-embed .rs-note{font-size:12.5px;color:var(--rs-grey);line-height:1.55;margin:12px 0 0;}

#est-embed .rs-fix:hover{text-decoration:underline;text-underline-offset:3px;}
#est-embed .rs-fix:focus-visible{outline:2px solid var(--rs-blue);outline-offset:3px;border-radius:3px;}

@media(prefers-reduced-motion:reduce){#est-embed .rs-stage.on,#est-embed .rs-result.on{animation:none;}}
/* the trace: the satellite map, the homeowner taps the corners, then the scan */
#est-embed .rs-tracing #e-mapwrap{display:block !important;}
#est-embed .rs-tracing .e-maptb,#est-embed .rs-tracing .e-mhint,#est-embed .rs-tracing #e-solarbanner,
#est-embed .rs-tracing #e-mresult,#est-embed .rs-tracing #e-slopecard,#est-embed .rs-tracing .e-flatrow,
#est-embed .rs-tracing #e-manualbtn,#est-embed .rs-tracing #e-sldwrap{display:none !important;}
#est-embed .rs-thead,#est-embed .rs-tfoot{display:none;}
#est-embed .rs-tracing .rs-thead,#est-embed .rs-tracing .rs-tfoot{display:flex;}
#est-embed .rs-thead{--rs-ink:#001530;--rs-grey:#788493;--rs-blue:#006fff;font-family:'Geist',system-ui,-apple-system,sans-serif;align-items:flex-start;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid #eef1f6;}
#est-embed .rs-tstep{flex:0 0 26px;height:26px;border-radius:50%;background:var(--rs-blue);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;}
#est-embed .rs-tmsg{display:flex;flex-direction:column;gap:3px;min-width:0;}
#est-embed .rs-tmsg b{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--rs-ink);line-height:1.3;}
#est-embed .rs-tmsg span{font-size:13px;color:var(--rs-grey);line-height:1.45;font-variant-numeric:tabular-nums;}
#est-embed .rs-tfoot{--rs-ink:#001530;--rs-grey:#788493;--rs-blue:#006fff;--rs-line:#dce3ec;font-family:'Geist',system-ui,-apple-system,sans-serif;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid #eef1f6;}
#est-embed .rs-tbtn{appearance:none;border:1px solid var(--rs-line);background:#fff;color:var(--rs-ink);border-radius:40px;min-height:44px;padding:0 18px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}

#est-embed .rs-tgo:disabled{background:#c9d3df;border-color:#c9d3df;cursor:default;}
#est-embed .rs-tbtn:focus-visible,#est-embed .rs-tgo:focus-visible{outline:3px solid var(--rs-blue);outline-offset:2px;}
#est-embed .rs-tskip{flex:1 0 100%;margin:2px 0 0;text-align:left;font-size:12.5px;}
#est-embed .rs-tracing #e-mapel{touch-action:none;}
#est-embed .rs-vx{background:#fff;border:2px solid #006fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,21,48,.35);}
#est-embed .rs-vx.rs-v0{background:#006fff;border-color:#fff;}
#est-embed .rs-vx.rs-v0.rs-close{box-shadow:0 0 0 6px rgba(0,111,255,.30),0 1px 3px rgba(0,21,48,.35);}
@media(max-width:560px){#est-embed .rs-tgo{flex:1 0 100%;margin-left:0;order:3;}#est-embed .rs-tbtn{flex:1 1 0;}#est-embed .rs-tskip{order:4;}}
</style>
<script id="rs-script">
(function(){
  /* ── timeline: when each step begins, in seconds. The last entry is the end. ── */
  var RS_STEPS=[
    {t:0.0,  k:'Locating your home',            s:''},
    {t:2.6,  k:'Analyzing satellite imagery',   s:''},
    {t:5.6,  k:'Mapping your roof',             s:''},
    {t:8.8,  k:'Measuring pitch',               s:''},
    {t:11.8, k:'Calculating roof area',         s:''}
  ];
  var RS_END=15.0;
  var RS_WAIT_MAX=28;      /* never hold the homeowner longer than this for a slow answer */
  var RS_LABELS=['Locate','Imagery','Roof planes','Slope','Area'];

  var st=null;             /* the running scan */
  (function(){ try{ if(document.getElementById('rs-geist')) return; var l=document.createElement('link'); l.id='rs-geist'; l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap'; (document.head||document.documentElement).appendChild(l); }catch(e){} })();

  function $(id){ return document.getElementById(id); }
  function reduced(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }

  /* ── stage markup, built once, placed where the trace map used to sit ── */
  function ensureStage(){
    var stage=$('rs-stage'); if(stage) return stage;
    var panel=$('e-addrpanel'), anchor=$('e-mapwrap'); if(!panel||!anchor) return null;
    stage=document.createElement('div'); stage.className='rs-stage'; stage.id='rs-stage';
    stage.setAttribute('role','status'); stage.setAttribute('aria-live','polite');
    stage.innerHTML=
      '<div class="rs-canvas-wrap"><canvas id="rs-mapcv" aria-hidden="true"></canvas><canvas id="rs-cv" aria-hidden="true"></canvas>'
     +'<div class="rs-addr"><i></i><span id="rs-addr"></span></div>'
     +'<div class="rs-readout" id="rs-readout"><b id="rs-rv">0</b><span id="rs-rl">sq ft of roof</span></div></div>'
     +'<div class="rs-panel">'
     +  '<div id="rs-live"><div class="rs-row"><b id="rs-now">Analyzing your roof</b><span id="rs-pct">0%</span></div>'
     +  '<div class="rs-bar"><i id="rs-bar"></i></div></div>'
     +  '<div class="rs-result" id="rs-result"></div>'
     +'</div>';
    anchor.parentNode.insertBefore(stage, anchor);
    return stage;
  }

  /* ── the house model, in feet ──────────────────────────────────────────────
     Footprint from the measured area and slope: plan = true area × cos(slope).
     Proportioned 1.55 : 1, which is close to the median US single-family
     footprint. Satellite gives the area and the pitch, not the plan shape, so
     the shape is the typical one and the size and steepness are theirs. */
  function modelFor(trueSqft, pitchDeg){
    var p=Math.max(0, Math.min(55, pitchDeg||22));
    var plan=Math.max(600, (trueSqft||2000)*Math.cos(p*Math.PI/180));
    var D=Math.sqrt(plan/1.55), W=D*1.55;
    return { W:W, D:D, H:10, pitch:p, o:1.6 };
  }

  /* ── the trace ──────────────────────────────────────────────────────────────
     Before any scan, the homeowner outlines the thing being priced on the
     satellite map — their roof, their yard — by tapping its corners, and
     closes it by tapping the first one again. The scan then builds from that
     outline: it is their shape and their size, not a guess from the map.
     Drawn on the estimator's own Leaflet map (eLmap), with its own layers and
     its own click handler, so it works the same with a mouse or a finger:
     a tap is a corner, a drag pans, Undo and Clear are big buttons. Shared
     with the house scan (pool and landscaping trace the yard). */
  var rsT=null;
  var RS_TCOPY={
    roof:     {main:'Tap each corner of your roof', sub:'Go around the outside edge of the roof. Tap the first point again to finish.', go:'Scan my roof', skip:'Can’t see your roof? Enter the size instead'},
    yard:     {main:'Tap each corner of the yard you want landscaped', sub:'Go around the area to be worked on. Tap the first point again to finish.', go:'Scan my yard', skip:'Can’t trace it? Enter the size instead'},
    backyard: {main:'Tap each corner of your backyard', sub:'Go around the yard where the pool would go. Tap the first point again to finish.', go:'Scan my backyard', skip:'Can’t trace it? Pick a pool size instead'}
  };
  function rsMapObj(){ try{ return (typeof eLmap!=='undefined' && eLmap) ? eLmap : null; }catch(e){ return null; } }
  function rsLLArea(pts){
    if(!pts||pts.length<3) return 0;
    var R=6378137, a=0, n=pts.length;
    for(var i=0;i<n;i++){ var j=(i+1)%n, l1=pts[i].lat*Math.PI/180, l2=pts[j].lat*Math.PI/180, dl=(pts[j].lng-pts[i].lng)*Math.PI/180; a+=dl*(2+Math.sin(l1)+Math.sin(l2)); }
    return Math.round(Math.abs(a*R*R/2)*10.7639);
  }
  function rsTracePanel(){ return document.getElementById('hs-addrpanel') || document.getElementById('e-addrpanel'); }
  function rsTraceUI(){
    var mw=document.getElementById('e-mapwrap'), el=document.getElementById('e-mapel'); if(!mw||!el) return false;
    if(document.getElementById('rs-thead')) return true;
    var h=document.createElement('div'); h.className='rs-thead'; h.id='rs-thead';
    h.innerHTML='<div class="rs-tstep" aria-hidden="true">✓</div><div class="rs-tmsg" role="status" aria-live="polite"><b id="rs-tmain"></b><span id="rs-tsub"></span></div>';
    mw.insertBefore(h, mw.firstChild);
    var f=document.createElement('div'); f.className='rs-tfoot'; f.id='rs-tfoot';
    f.innerHTML='<button type="button" class="rs-tbtn" id="rs-tundo">Undo</button><button type="button" class="rs-tbtn" id="rs-tclear">Clear</button>'
      +'<button type="button" class="rs-tgo" id="rs-tgo" disabled></button><button type="button" class="rs-fix rs-tskip" id="rs-tskip"></button>';
    el.parentNode.insertBefore(f, el.nextSibling);
    document.getElementById('rs-tundo').onclick=function(){ if(!rsT) return; if(rsT.closed) rsT.closed=false; else rsT.pts.pop(); rsTraceDraw(); };
    document.getElementById('rs-tclear').onclick=function(){ if(!rsT) return; rsT.pts=[]; rsT.closed=false; rsTraceDraw(); };
    document.getElementById('rs-tgo').onclick=function(){ if(!rsT||rsT.pts.length<3) return; rsT.closed=true; rsTraceDraw(); rsTraceDone(); };
    document.getElementById('rs-tskip').onclick=function(){ if(!rsT) return; var o=rsT.o; rsTraceHide(); if(o.onSkip) o.onSkip(); };
    return true;
  }
  /* o: {kind:'roof'|'yard'|'backyard', onDone(latlngs, sqft), onSkip()} */
  function rsTraceOpen(o){
    rsT={o:o, pts:[], closed:false, lay:[]};
    rsTraceShow();
  }
  window.rsTraceState=function(){ return rsT ? {n:rsT.pts.length, closed:rsT.closed, sqft:rsLLArea(rsT.pts)} : null; };   /* for tests */
  function rsTraceShow(){
    if(!rsT||!rsTraceUI()) return;
    var c=RS_TCOPY[rsT.o.kind]||RS_TCOPY.roof;
    document.getElementById('rs-tgo').textContent=c.go;
    document.getElementById('rs-tskip').textContent=c.skip;
    var p=rsTracePanel(); if(p) p.classList.add('rs-tracing');
    rsTraceAttach();
  }
  function rsTraceHide(){ var p=rsTracePanel(); if(p) p.classList.remove('rs-tracing'); }
  function rsTraceActive(){ var p=rsTracePanel(); return !!(rsT && p && p.classList.contains('rs-tracing')); }
  /* called when the map exists (and again whenever the estimator re-inits it) */
  function rsTraceAttach(){
    var m=rsMapObj(); if(!rsT) return;
    if(m){
      try{ eSetTool('pan'); }catch(e){}           /* the estimator's own drawing tools stay idle; dragging pans */
      try{ m.dragging.enable(); m.getContainer().style.cursor='crosshair'; }catch(e){}
      if(!m._rsBound){ m.on('click', rsTraceClick); m._rsBound=true; }
      setTimeout(function(){ try{ m.invalidateSize(); }catch(e){} }, 120);
    }
    /* pools place a draggable pool shape on the map once it is ready; while
       the yard is being traced that waits */
    if(typeof ePoolMode==='function' && !ePoolMode._rs){
      var _pm=ePoolMode, w=function(){ if(rsTraceActive()){ try{ eClearDrawing(); }catch(e){} try{ eSetTool('pan'); }catch(e){} return; } return _pm.apply(this, arguments); };
      w._rs=true; try{ ePoolMode=w; }catch(e){} window.ePoolMode=w;
    }
    rsTraceDraw();
  }
  function rsTraceCenter(lat, lng, zoom){
    var m=rsMapObj(); if(!m||!rsT||rsT.pts.length) return;
    try{ m.setView([lat,lng], zoom||m.getZoom()); }catch(e){}
  }
  function rsTraceClick(e){
    if(!rsTraceActive()||rsT.closed) return;
    var m=rsMapObj();
    if(rsT.pts.length>=3 && m){
      var a=m.latLngToContainerPoint(rsT.pts[0]), b=m.latLngToContainerPoint(e.latlng);
      if(Math.hypot(a.x-b.x, a.y-b.y)<24){ rsT.closed=true; rsTraceDraw(); return; }
    }
    rsT.pts.push(e.latlng); rsTraceDraw();
  }
  function rsTraceDraw(){
    if(!rsT) return;
    var m=rsMapObj(), pts=rsT.pts, n=pts.length, closed=rsT.closed&&n>=3;
    if(m && typeof L!=='undefined'){
      rsT.lay.forEach(function(l){ try{ m.removeLayer(l); }catch(e){} }); rsT.lay=[];
      if(n>=3) rsT.lay.push(L.polygon(pts,{color:'#006fff',weight:closed?3:2,dashArray:closed?null:'6 6',fillColor:'#006fff',fillOpacity:closed?0.22:0.12,interactive:false}).addTo(m));
      else if(n===2) rsT.lay.push(L.polyline(pts,{color:'#006fff',weight:3,interactive:false}).addTo(m));
      if(n>=3&&!closed) rsT.lay.push(L.polyline(pts,{color:'#006fff',weight:3,interactive:false}).addTo(m));
      pts.forEach(function(p,i){
        var first=i===0, sz=first?18:14, cls='rs-vx'+(first?' rs-v0':'')+(first&&n>=3&&!closed?' rs-close':'');
        rsT.lay.push(L.marker(p,{interactive:false,keyboard:false,icon:L.divIcon({className:cls,iconSize:[sz,sz]})}).addTo(m));
      });
    }
    var c=RS_TCOPY[rsT.o.kind]||RS_TCOPY.roof, sq=rsLLArea(pts), main, sub;
    if(!n){ main=c.main; sub=c.sub; }
    else if(n<3){ main=c.main; sub=n+' corner'+(n>1?'s':'')+' placed — keep going. Drag to move the map.'; }
    else if(!closed){ main='Tap the first point to finish'; sub=n+' corners · about '+sq.toLocaleString()+' sq ft so far. Or tap “'+c.go+'”.'; }
    else { main='Outline done · '+sq.toLocaleString()+' sq ft'; sub='Looks right? Start the scan. Undo reopens the outline.'; }
    var mn=document.getElementById('rs-tmain'), sb=document.getElementById('rs-tsub');
    if(mn) mn.textContent=main; if(sb) sb.textContent=sub;
    var u=document.getElementById('rs-tundo'), cl=document.getElementById('rs-tclear'), g=document.getElementById('rs-tgo');
    if(u) u.disabled=!n; if(cl) cl.disabled=!n; if(g) g.disabled=n<3;
  }
  function rsTraceDone(){
    if(!rsT||rsT.pts.length<3) return;
    var pts=rsT.pts.map(function(p){ return {lat:p.lat, lng:p.lng}; }), sq=rsLLArea(pts), o=rsT.o;
    rsTraceHide();
    if(o.onDone) o.onDone(pts, sq);
  }
  /* forget the outline: a new address, back to the ZIP, start over */
  function rsTraceReset(){
    var m=rsMapObj();
    if(rsT&&m){ rsT.lay.forEach(function(l){ try{ m.removeLayer(l); }catch(e){} }); }
    rsTraceHide(); rsT=null;
  }

  /* the outline in the scan's world: north-up feet around the origin */
  function rsTraceWorld(pts, origin){ return pts.map(function(p){ return worldOf(origin, p.lat, p.lng); }); }

  /* Which way the roof runs, from the planes satellite found: how much of
     the roof faces along the outline's long side (hip ends, or a ridge
     running across) against how much faces across it (the two main slopes).
     Almost nothing along it: gable ends. Otherwise a hip. Null when there
     are no planes. */
  function rsRoofStyle(roof, ring){
    var ps=(roof&&roof.planes)||[]; if(ps.length<2||!ring||ring.length<3) return null;
    var lo=0, th=0, n=ring.length;
    for(var i=0;i<n;i++){ var p=ring[i], q=ring[(i+1)%n], l=Math.hypot(q[0]-p[0],q[1]-p[1]); if(l>lo){ lo=l; th=Math.atan2(q[1]-p[1],q[0]-p[0]); } }
    var ux=Math.cos(th), uz=Math.sin(th), along=0, across=0, flat=0;
    ps.forEach(function(p){ var w=Math.max(0,+p.groundSqft||0); if(!w) return;
      if((+p.pitch||0)<5){ flat+=w; return; }
      var az=(+p.azimuth||0)*Math.PI/180, fx=Math.sin(az), fz=-Math.cos(az);   /* facing, x east z south */
      if(Math.abs(fx*ux+fz*uz)>0.7071) along+=w; else across+=w; });
    var tot=along+across; if(tot<=0) return null;
    return {gable: along<0.12*tot, along:Math.round(along), across:Math.round(across)};
  }


  /* ── their actual roof, from the planes satellite found ────────────────────
     Solar returns every roof plane with its slope, the compass direction it
     faces, its height and a north-up bounding box. Houses are rarely built
     square to north, so first find the house's own grid (planes face along
     it, 90° apart), turn everything onto that grid, and each plane becomes a
     rectangle sloping one of four ways. Its size comes from its measured
     ground area, so a garage wing is garage-sized and sits where the garage
     is. Under each plane, walls to the ground — a white block, not a render,
     but the outline and the roof are theirs. */
  function planesModel(roof, origin){
    var ps=(roof&&roof.planes)||[]; if(ps.length<2) return null;
    var lat0=0,lng0=0; ps.forEach(function(p){ lat0+=p.lat; lng0+=p.lng; }); lat0/=ps.length; lng0/=ps.length;
    var FT=3.28084, kx=111320*Math.cos(lat0*Math.PI/180)*FT, kz=110574*FT;
    function loc(la,ln){ return [ (ln-lng0)*kx, -(la-lat0)*kz ]; }        /* x east, z south */
    /* the house's grid: circular mean of the facing directions, folded to 90° */
    var sx=0, sy=0; ps.forEach(function(p){ var a=p.azimuth*Math.PI/180*4, w=p.groundSqft; sx+=Math.cos(a)*w; sy+=Math.sin(a)*w; });

      var c=rot(loc(p.lat,p.lng));

         For a w×d rectangle turned th, the box is  Bx = w|cos|+d|sin|,
         Bz = w|sin|+d|cos|  — solve that for w and d. Shrinking the loose box
         evenly instead would square every plane off: a 52 ft eave came out 32.

  }

  function buildGeometry(m){
    var W=m.W/2, D=m.D/2, H=m.H, o=m.o;
    var faces=[], roofEdges=[];

  /* ── projection ── */
  /* The house turns about a vertical axis through its own centre, and the
     framing is worked out once from the model rather than every frame: the
     scale fits the house's widest turning circle, so no angle of the turn
     is ever larger than another, and the centre never moves. Measuring each
     frame's outline and re-centring on it (as before) chased a shape that
     changes as it turns, which read as the house shaking. Orthographic, for
     the same reason — perspective makes the near corner swell and shrink. */

  /* cam: c (centre, world feet), R and H (what must fit), tilt (0.46 is

  /* ── the street around the house ─────────────────────────────────────────────
     The same white map the Lead Radar uses: OpenFreeMap's OpenMapTiles data
     (free, no key, no watermark, fine for commercial use). Rather than a map
     library, the scan fetches the one or few vector tiles around the address
     and draws the roads and buildings itself, in the same scene and with the
     same camera as the house — so the map can tilt and the house can rise
     out of it in one continuous shot, with no hand-off between two renderers.
     No key, no per-visitor cost, and nothing to download beyond the tiles.
     If the tiles cannot be had, the scan runs exactly as before, on white. */
  var RS_TILEJSON='https://tiles.openfreemap.org/planet';
  var RS_MAP_R=900;                 /* feet of street to draw around the house */
  var rsTileTpl=null;

  /* A minimal Mapbox Vector Tile reader: protobuf wire format, the layers,
     their features' tags and geometry commands. ~60 lines rather than a
     library on every contractor's site. */
  function rsMvt(buf){
    var b=new Uint8Array(buf), p=0;
    function vint(){ var r=0, s=0, c; do{ c=b[p++]; r+=(c&0x7f)*Math.pow(2,s); s+=7; }while(c>=0x80); return r; }

    function str(end){ var out=''; try{ out=new TextDecoder().decode(b.subarray(p,end)); }catch(e){} p=end; return out; }

      while(p<lend){
        var k2=vint(), f2=k2>>3, t2=k2&7;
        if(f2===1&&t2===2){ var e1=vint()+p; L.name=str(e1); }
        else if(f2===5&&t2===0){ L.extent=vint(); }
        else if(f2===3&&t2===2){ var e3=vint()+p; L.keys.push(str(e3)); }
        else if(f2===4&&t2===2){
          var e4=vint()+p, v=null;
          while(p<e4){ var k4=vint(), f4=k4>>3, t4=k4&7;
            if(f4===1&&t4===2){ var e5=vint()+p; v=str(e5); }
            else if(f4===4||f4===5){ v=vint(); }
            else if(f4===7){ v=!!vint(); }
            else skip(t4); }

        }
        else if(f2===2&&t2===2){

          while(p<e2){ var k3=vint(), f3=k3>>3, t3=k3&7;
            if(f3===2&&t3===2){ var et=vint()+p; F.tags=packed(et); }
            else if(f3===3&&t3===0){ F.type=vint(); }
            else if(f3===4&&t3===2){ var eg=vint()+p; F.geom=packed(eg); }

  /* geometry commands -> rings / lines, in tile pixels */

  var RS_ROAD={motorway:60,trunk:56,primary:48,secondary:42,tertiary:36,minor:28,service:16};

  function rsMapFromTiles(tiles, origin){
    var FT=3.28084, kx=111320*Math.cos(origin.lat*Math.PI/180)*FT, kz=110574*FT;
    var roads=[], blds=[], water=[], park=[], lim=RS_MAP_R*1.35;

        rings.forEach(function(r){ if(near(r)) roads.push({w:wd, pts:r}); }); });
      each('building', function(L,F,rings){ if(F.type!==3) return; rings.forEach(function(r){ if(r.length>2&&near(r)) blds.push(r); }); });
      each('water', function(L,F,rings){ if(F.type!==3) return; rings.forEach(function(r){ if(near(r)) water.push(r); }); });
      each('park', function(L,F,rings){ if(F.type!==3) return; rings.forEach(function(r){ if(near(r)) park.push(r); }); });

  function rsFetch(url, ms, kind){
    return new Promise(function(res,rej){
      var done=false, t=setTimeout(function(){ if(!done){ done=true; rej(new Error('timeout')); } }, ms);
      fetch(url).then(function(r){ if(!r.ok) throw new Error(r.status); return kind==='json'?r.json():r.arrayBuffer(); })
        .then(function(v){ if(!done){ done=true; clearTimeout(t); res(v); } })
        .catch(function(e){ if(!done){ done=true; clearTimeout(t); rej(e); } });
    });
  }

  function rsMapLoad(lat, lng){
    if(!st) return;
    var me=st, origin={lat:+lat, lng:+lng};
    me.origin=origin;
    if(typeof window.RS_DEMO_MAP==='function'){ setTimeout(function(){ if(st===me) me.map=window.RS_DEMO_MAP(origin); }, 250); return; }
    var tpl=rsTileTpl ? Promise.resolve(rsTileTpl)
      : rsFetch(RS_TILEJSON, 5000, 'json').then(function(j){ rsTileTpl={t:j.tiles[0], z:Math.min(14, j.maxzoom||14)}; return rsTileTpl; });
    tpl.then(function(tt){
      var z=tt.z, n=Math.pow(2,z);
      var xf=(origin.lng+180)/360*n, lr=origin.lat*Math.PI/180;
      var yf=(1-Math.log(Math.tan(lr)+1/Math.cos(lr))/Math.PI)/2*n;
      var tileFt=40075016*Math.cos(lr)/n*3.28084, m=RS_MAP_R*1.3/tileFt;
      var want=[];
      for(var dx=-1;dx<=1;dx++) for(var dy=-1;dy<=1;dy++){
        var tx=Math.floor(xf)+dx, ty=Math.floor(yf)+dy;
        if(tx+1<xf-m||tx>xf+m||ty+1<yf-m||ty>yf+m) continue;

      return Promise.all(want.map(function(T){
        var url=tt.t.replace('{z}',T.z).replace('{x}',T.x).replace('{y}',T.y);
        return rsFetch(url, 6000, 'buf').then(function(buf){ T.layers=rsMvt(buf); return T; }).catch(function(){ return null; });
      }));

  }
  window.rsMvt=rsMvt; window.rsGeom=rsGeom; window.rsMapFromTiles=rsMapFromTiles;   /* for tools/roof-map.test.js */

  function rsInside(pt, ring){
    var c=false; for(var i=0,j=ring.length-1;i<ring.length;j=i++){
      var a=ring[i], b=ring[j];
      if(((a[1]>pt[1])!==(b[1]>pt[1])) && (pt[0] < (b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])) c=!c; }
    return c;
  }

  /* the map, drawn flat at ground level through the same camera as the house */
  /* The map is flat, and the camera is orthographic, so every frame's view
     of it is just a stretch-and-turn of one top-down picture. It is painted
     once (twice: a wide one for the opening and a sharp close one for the
     lot) and each frame only places that picture — one drawImage instead of
     re-drawing a few hundred roads and houses 60 times a second. */
  function paintMap(map, halfFt, px, core){
    var c=document.createElement('canvas'); c.width=c.height=px;
    var m=c.getContext('2d'), k=px/(2*halfFt);
    m.setTransform(k,0,0,k,px/2,px/2);            /* world feet -> texture pixels, origin in the middle */
    function path(ring){ m.beginPath(); ring.forEach(function(q,i){ i?m.lineTo(q[0],q[1]):m.moveTo(q[0],q[1]); }); }
    m.fillStyle='#f3f5f8'; m.fillRect(-halfFt,-halfFt,2*halfFt,2*halfFt);
    m.fillStyle='#e7eee4'; map.park.forEach(function(r){ path(r); m.fill(); });
    m.fillStyle='#dde8f3'; map.water.forEach(function(r){ path(r); m.fill(); });
    m.lineCap='butt'; m.lineJoin='round';   /* square ends: round caps draw a loop at every dead end up close */
    m.strokeStyle='#dfe4ea'; map.roads.forEach(function(rd){ m.lineWidth=rd.w+6; path(rd.pts); m.stroke(); });
    m.strokeStyle='#ffffff'; map.roads.forEach(function(rd){ m.lineWidth=rd.w; path(rd.pts); m.stroke(); });
    /* every building, this one included: the measured outline is drawn
       over its own, and repainting to cut it out cost a visible hitch at
       the moment the house arrived */
    m.fillStyle='#e4e8ee'; m.strokeStyle='#d3d9e1'; m.lineWidth=1/k;
    map.blds.forEach(function(r){ path(r); m.fill(); m.stroke(); });

       being cut off by it */
    m.setTransform(1,0,0,1,0,0);
    m.globalCompositeOperation='destination-in';
    var gr=m.createRadialGradient(px/2,px/2,px*core,px/2,px/2,px*0.5);
    gr.addColorStop(0,'rgba(0,0,0,1)'); gr.addColorStop(1,'rgba(0,0,0,0)');
    m.fillStyle=gr; m.fillRect(0,0,px,px);

  /* painted as soon as the street arrives, in its own task, so no frame
     of the animation ever waits on it */
  function rsPaintMaps(me){
    if(!me||!me.map||me.mapWide) return;
    setTimeout(function(){ if(st!==me) return;
      me.mapWide=paintMap(me.map, RS_MAP_R, 1536, 0.22);
      setTimeout(function(){ if(st!==me) return; me.mapNear=paintMap(me.map, 260, 2048, 0.40); }, 0);
    }, 0);

  function drawMap(ctx, P, dpr, alpha, foot, footA){
    if(!st.mapWide) return;
    /* the affine map from the ground plane to the screen, read off the camera */
    var o=P([0,0,0]), ex=P([1,0,0]), ez=P([0,0,1]);
    var A=ex.x-o.x, B=ex.y-o.y, C=ez.x-o.x, D=ez.y-o.y;

       cost. The house stays sharp on the layer above. */
    var mcv=st.mcv, mctx=st.mctx, mr=mcv.getBoundingClientRect();
    if(mcv.width!==Math.round(mr.width)||mcv.height!==Math.round(mr.height)){ mcv.width=Math.round(mr.width); mcv.height=Math.round(mr.height); }
    if(mapA>0||st.mapDrawn){ mctx.clearRect(0,0,mcv.width,mcv.height); st.mapDrawn=false; }
    var PM=makeProj(mcv,{c:st.cam.c,R:st.cam.R,H:st.cam.H,tilt:tilt,yaw:yaw,zoom:zoom,grow:1});
    if(st.mapWide&&mapA>0){ st.mapDrawn=true;
      var footA=geo?Math.min(span(T,Math.max(3.0,start),Math.max(4.2,start+1.2)),1):0;
      drawMap(mctx,PM,1,mapA,geo&&geo.foot,footA);
    }
    if(!geo||grow<=0.01){ st.raf=requestAnimationFrame(draw); return; }
    st.geoLocked=geo;

    var edgeP=span(T,7.8,10.4), tintP=span(T,8.6,10.4), labelP=span(T,10.6,11.8);

    /* faces, back to front */
    var faces=geo.faces.map(function(f){ var pts=f.v.map(P), z=pts.reduce(function(s,p){ return s+p.z; },0)/pts.length; return {f:f,pts:pts,z:z}; });
    var gz={}; faces.forEach(function(F){ var g=F.f.grp; if(g===undefined) return; var o=gz[g]||(gz[g]={s:0,n:0}); F.pts.forEach(function(p){ o.s+=p.z; o.n++; }); });
    faces.sort(function(a,b){
      var ga=a.f.grp, gb=b.f.grp;
      if(ga!==undefined&&gb!==undefined&&ga!==gb) return gz[gb].s/gz[gb].n - gz[ga].s/gz[ga].n;
      return b.z-a.z;
    });
    ctx.save(); ctx.globalAlpha=Math.min(1,grow*4);
    faces.forEach(function(F){
      var s=shade(F.f,P,F.f.kind);
      /* white roof; walls a cool grey that deepens on the side turned from
         the light, so the block reads as a solid on a white page */
      var base=F.f.kind==='roof'?[255,255,255]:[226,232,240];
      var col=base.map(function(c){ return Math.round(c*s); });
      if(F.f.kind==='roof'&&tintP>0){ col=[Math.round(col[0]-(col[0]-230)*tintP*0.6),Math.round(col[1]-(col[1]-240)*tintP*0.6),Math.round(col[2]-(col[2]-255)*tintP*0.6)]; }
      ctx.fillStyle='rgb('+col.join(',')+')';
      ctx.strokeStyle='rgba(0,21,48,.16)'; ctx.lineWidth=1*dpr; ctx.lineJoin='round';
      ctx.beginPath(); F.pts.forEach(function(p,i){ i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); }); ctx.closePath(); ctx.fill(); ctx.stroke();
    });
    ctx.restore();

    /* roof lines, drawn edge by edge */
    if(edgeP>0){
      var n=geo.roofEdges.length, done=edgeP*n;
      ctx.save(); ctx.lineCap='round';
      for(var i2=0;i2<n;i2++){
        var part=Math.max(0,Math.min(1,done-i2)); if(part<=0) break;
        var a=P(geo.roofEdges[i2][0]), b=P(geo.roofEdges[i2][1]);
        ctx.strokeStyle='#006fff'; ctx.lineWidth=2*dpr;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(a.x+(b.x-a.x)*part, a.y+(b.y-a.y)*part); ctx.stroke();
        ctx.fillStyle='#006fff'; ctx.beginPath(); ctx.arc(a.x,a.y,2.2*dpr,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    /* dimension tags on the ridge and the front eave, from the real model */
    if(labelP>0){
      ctx.save(); ctx.globalAlpha=labelP;
      var boxes=[];
      var tag=function(seg, text, lift){
        var a=P(seg[0]), b=P(seg[1]); var mx=(a.x+b.x)/2, my=(a.y+b.y)/2-lift*dpr;
        ctx.font='600 '+(11*dpr)+'px "General Sans",Geist,system-ui,sans-serif';
        var tw=ctx.measureText(text).width+14*dpr, th=20*dpr;
        for(var q=0;q<boxes.length;q++){ var o=boxes[q]; if(Math.abs(o.x-mx)<(o.w+tw)/2+4*dpr && Math.abs(o.y-my)<th+4*dpr){ my=o.y-th-6*dpr; } }
        boxes.push({x:mx,y:my,w:tw});
        ctx.fillStyle='#ffffff'; ctx.strokeStyle='#dce3ec'; ctx.lineWidth=1*dpr;
        roundRect(ctx, mx-tw/2, my-th/2, tw, th, 6*dpr); ctx.fill(); ctx.stroke();
        ctx.fillStyle='#001530'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text, mx, my+0.5*dpr);
      };
      var m=st.target;
      var eaves=geo.eaves, near=eaves[0];
      var zs=eaves.map(function(e2){ return (P(e2[0]).z+P(e2[1]).z)/2; }), zm=zs.reduce(function(a,b){return a+b;},0)/zs.length, best=-1;
      eaves.forEach(function(e2,i){ var L=Math.hypot(e2[1][0]-e2[0][0], e2[1][2]-e2[0][2]); if(zs[i]<=zm+1e-6 && L>best){ best=L; near=e2; } });
      var len=Math.hypot(near[1][0]-near[0][0], near[1][2]-near[0][2]);
      tag(near, 'Eave '+Math.round(len)+' ft', -16);
      if(geo.ridge){ tag(geo.ridge, 'Ridge '+Math.round(Math.max(1,(m.W+2*m.o)-(m.D+2*m.o)))+' ft', 16); }
      ctx.restore();
    }

    st.raf=requestAnimationFrame(draw);
  }
  function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

  /* ── the clock: steps advance on schedule, but the last one waits for the answer ── */
  function tick(){
    if(!st) return;
    var el=(performance.now()-st.t0)/1000;
    /* hold on "measuring the slope" until the measurement is actually here:
       the clock stops, the house keeps turning, nothing jumps */
    var holdAt=RS_STEPS[4].t-0.2, raw=el-(st.paused||0);
    if(st.data===undefined && raw>holdAt){
      st.paused=el-holdAt; raw=holdAt;
      /* satellite never answered: the outline is theirs, the slope is the typical one */
      if(el>RS_WAIT_MAX){ if(st.trace){ st.solar=null; rsRoofBuild(); } else { finish(null); return; } }
    }
    if(st.failed && raw>=RS_STEPS[2].t){ finish(null); return; }
    st.clock=Math.min(RS_END, raw);
    /* tick() runs 16 times a second, which is plenty for the words and the
       bar but not for motion: frames read the clock through clockNow(),
       which carries it forward between ticks unless it is holding */
    st.clockAt=performance.now(); st.clockHeld=(st.data===undefined && raw>=holdAt) || st.clock>=RS_END;
    var T=st.clock;

    var idx=0; for(var i=0;i<RS_STEPS.length;i++){ if(T>=RS_STEPS[i].t) idx=i; }
    if(idx!==st.idx){
      st.idx=idx;
      $('rs-now').textContent=RS_STEPS[idx].k;
    }
    /* once the slope is known, say it — this is the moment it stops feeling generic */
    var pc=Math.round(T/RS_END*100); $('rs-bar').style.width=pc+'%'; $('rs-pct').textContent=pc+'%';

    /* the area counts up through the last step */
    if(st.target&&T>=RS_STEPS[4].t){
      var f=Math.min(1,(T-RS_STEPS[4].t)/(RS_END-RS_STEPS[4].t-0.4)); f=1-Math.pow(1-f,3);
      $('rs-readout').classList.add('on'); $('rs-rv').textContent=Math.round(st.data.trueSqft*f).toLocaleString();
    }
    if(T>=RS_END && st.data){ finish(st.data); return; }
    st.timer=setTimeout(tick, 60);
  }

  function pitchText(deg){
    var over12=Math.round(12*Math.tan(deg*Math.PI/180));
    return deg<5 ? 'flat / low-slope' : (over12+'/12 pitch ('+Math.round(deg)+'°)');
  }

  /* ── start: called the moment an address is chosen. The street map and the
     satellite read start loading now, in the background; the scan itself
     waits until the homeowner has traced the roof. ── */
  window.eRoofScanStart=function(addr){
    var stage=ensureStage(); if(!stage) return;
    var panel=$('e-addrpanel'); panel.classList.remove('rs-mode','rs-fallback');
    stop(); stage.classList.remove('on');
    $('rs-addr').textContent=String(addr||'').split(',').slice(0,3).join(',');
    var cv=$('rs-cv'), mcv=$('rs-mapcv');
    st={ cv:cv, ctx:cv.getContext('2d'), mcv:mcv, mctx:mcv.getContext('2d'), dpr:Math.min(2, window.devicePixelRatio||1), t0:performance.now(),
         clock:0, idx:-1, data:undefined, target:null, yaw:0.62, waiting:true, solar:undefined };
    /* the continue button stays off until the numbers are in */
    try{ eS.sqft=0; eS.usedMap=false; eCheckBtn1(); }catch(e){}
    var b=$('e-btn1'); if(b) b.classList.remove('rs-ready');
    rsTraceReset();
    rsTraceOpen({kind:'roof', onDone:rsRoofTraced, onSkip:rsRoofSkip});
  };

  /* the outline is closed: the scan runs on it */
  function rsRoofTraced(pts, sq){
    if(!st) return;
    if(!st.origin) st.origin={lat:pts[0].lat, lng:pts[0].lng};
    st.traceLL=pts; st.tracePlan=sq; st.trace=rsTraceWorld(pts, st.origin);
    rsRoofRun();
  }
  function rsRoofRun(){
    var s=st; if(!s) return;
    clearTimeout(s.timer); cancelAnimationFrame(s.raf);
    s.t0=performance.now(); s.clock=0; s.idx=-1; s.paused=0; s.clockAt=undefined; s.clockHeld=false; s.lastMs=undefined; s.spin=0;
    s.cam=null; s.arrive=undefined; s.geoLocked=null; s.poly=null; s.polyTried=true; s.frame=null; s.frameGeo=null;
    s.done=false; s.still=false; s.data=undefined; s.target=null; s.failed=false; s.waiting=false; s.mapDrawn=false;
    var panel=$('e-addrpanel'); panel.classList.add('rs-mode'); panel.classList.remove('rs-fallback');
    $('rs-live').style.display=''; $('rs-result').className='rs-result'; $('rs-result').innerHTML='';
    $('rs-readout').classList.remove('on'); $('rs-rv').textContent='0'; $('rs-bar').style.width='0';
    $('rs-pct').textContent='0%'; $('rs-now').textContent='Analyzing your roof';
    var stage=$('rs-stage'); stage.classList.add('on');
    try{ if(stage.scrollIntoView) stage.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(e){}
    rsRoofBuild();
    draw(); tick();
  }
  /* The numbers and the house, from the trace plus whatever satellite said.
     Plan area is the traced outline's; the slope turns it into roof area
     (plan ÷ cos pitch). No satellite read: a typical 22° slope. Called
     again if the satellite answer lands after the scan has started — until
     the house has risen, it takes the measured slope. */
  function rsRoofBuild(){
    var s=st; if(!s||!s.trace) return;
    var d=s.solar, has=!!(d&&d.totalAreaSqft>0);
    var pitch=has ? Math.max(0, +d.avgPitchDegrees||0) : 22, flat=has&&pitch<5;
    var plan=s.tracePlan, trueSqft=Math.round(flat ? plan : plan/Math.cos(Math.min(60,pitch)*Math.PI/180));
    var nPlanes=has&&d.roof&&d.roof.planes ? d.roof.planes.length : 0;
    var style=null; try{ style=has ? rsRoofStyle(d.roof, s.trace) : null; }catch(e){}
    s.target=modelFor(trueSqft, pitch);
    if(!s.geoLocked){
      try{ s.poly=polyModel(s.trace, pitch, {flat:flat, style:style}); }catch(e){ s.poly=null; }
      if(!s.poly){ var cx=0, cz=0; s.trace.forEach(function(p){ cx+=p[0]; cz+=p[1]; }); cx/=s.trace.length; cz/=s.trace.length;
        var g0=buildGeometry(s.target), seen=[], mv=function(v){ if(v._m) return; v._m=1; seen.push(v); v[0]+=cx; v[2]+=cz; };
        g0.faces.forEach(function(f){ f.v.forEach(mv); }); g0.roofEdges.forEach(function(e){ mv(e[0]); mv(e[1]); }); (g0.foot||[]).forEach(function(f){ f.forEach(mv); });
        if(g0.ridge){ mv(g0.ridge[0]); mv(g0.ridge[1]); } seen.forEach(function(v){ delete v._m; }); s.gen=g0; }
    }
    if(s.solar!==undefined){
      s.data={ trueSqft:trueSqft, planSqft:plan, pitch:pitch, planes:nPlanes, solar:has, gable:!!(style&&style.gable),
               satSqft: has ? Math.round(d.totalAreaSqft) : 0 };
    }
  }

  /* ── the satellite read (or null if there wasn't one) ── */
  window.eRoofScanData=function(d){
    if(!st) return;
    st.solar=(d && d.totalAreaSqft>0) ? d : null;
    if(st.solar && d.centerLat && d.centerLng) rsTraceCenter(d.centerLat, d.centerLng, 20);
    if(st.trace) rsRoofBuild();
  };

  function finish(data){
    if(!st) return;
    clearTimeout(st.timer);
    var res=$('rs-result');
    $('rs-live').style.display='none';
    if(!data){
      st.still=true;
      res.innerHTML='<div class="rs-fail">We couldn’t measure this roof</div>'
        +'<p class="rs-note">Trace it again on the map, or enter a rough size.</p>'
        +'<button type="button" class="rs-fix" onclick="eRoofScanFix()">Redraw the outline</button>';
      res.className='rs-result on';
      fallback(true);
      return;
    }
    $('rs-bar').style.width='100%';
    $('rs-rv').textContent=data.trueSqft.toLocaleString();
    setTimeout(function(){ var ro=$('rs-readout'); if(ro) ro.classList.remove('on'); }, 900);
    var squares=Math.ceil(data.trueSqft/100), flat=data.solar&&data.pitch<5;
    var note = data.solar
      ? 'Area from the outline you traced; slope measured from satellite'+(data.planes>1?' ('+data.planes+' roof planes'+(data.gable?', gable ends':'')+')':'')+'. Roof area includes the slope.'
      : 'Area from the outline you traced. Satellite had no slope for this address, so a typical 5/12 pitch is used — you can change it on the next steps.';
    res.innerHTML=
      '<div class="rs-grid">'
      +'<div><b>'+data.trueSqft.toLocaleString()+'</b><span>Roof area, sq ft</span></div>'
      +'<div><b>'+squares+'</b><span>Roofing squares</span></div>'
      +'<div><b>'+(flat?'Flat':Math.round(12*Math.tan(data.pitch*Math.PI/180))+'/12')+'</b><span>Pitch'+(!flat?' · '+Math.round(data.pitch)+'°':'')+(data.solar?'':' (typical)')+'</span></div>'
      +'<div><b>'+data.planSqft.toLocaleString()+'</b><span>Footprint traced, sq ft</span></div>'
      +'</div>'
      +'<p class="rs-note">'+note+'</p>'
      +'<button type="button" class="rs-fix" onclick="eRoofScanFix()">Redraw the outline</button>';
    res.className='rs-result on';

    /* hand the numbers to the estimator exactly as a trace would have */
    try{
      eS.sqft=data.trueSqft; eS.planSqft=data.planSqft; eS.usedMap=true;
      eS.flatRoof=!!flat;
      if(data.solar){
        eS.solarPitchDeg=Math.round(data.pitch*10)/10;
        eS.pitch=eSolarPitchCategory(data.pitch);
        eMeasurePitch=eDegToPitch(data.pitch);
        eSolarPreselectPitch(eS.pitch);
      } else { eS.solarPitchDeg=null; }
      eCheckBtn1();
      var b=$('e-btn1'); if(b){ b.classList.add('rs-ready'); }
    }catch(e){}
    /* let the finished model settle and keep turning, slower */
    st.done=true;
  }

  function stop(){ if(st){ clearTimeout(st.timer); cancelAnimationFrame(st.raf); } st=null; }

  function fallback(showMap){
    var panel=$('e-addrpanel'); panel.classList.remove('rs-mode'); panel.classList.add('rs-fallback');
    var mw=$('e-mapwrap'); if(mw) mw.style.display='block';
    try{ if(eLmap) setTimeout(function(){ eLmap.invalidateSize(); },120); }catch(e){}
  }

  /* can't trace it: the size slider, as before */
  function rsRoofSkip(){
    var panel=$('e-addrpanel'); panel.classList.remove('rs-mode'); panel.classList.add('rs-fallback');
    var mw=$('e-mapwrap'); if(mw) mw.style.display='none';
    try{ if(!eManualOpen) eToggleManual(); }catch(e){}
  }

  /* "Redraw": back to the map, with the outline as it was, to adjust or clear */
  window.eRoofScanFix=function(){
    if(st){ clearTimeout(st.timer); cancelAnimationFrame(st.raf); st.done=false; }
    var stage=$('rs-stage'); if(stage) stage.classList.remove('on');
    var panel=$('e-addrpanel'); panel.classList.remove('rs-mode','rs-fallback');
    try{ eS.sqft=0; eS.usedMap=false; eCheckBtn1(); }catch(e){}
    var b=$('e-btn1'); if(b) b.classList.remove('rs-ready');
    if(!rsT) rsTraceOpen({kind:'roof', onDone:rsRoofTraced, onSkip:rsRoofSkip}); else rsTraceShow();
    var mw=$('e-mapwrap'); if(mw&&mw.scrollIntoView) mw.scrollIntoView({behavior:'smooth',block:'center'});
  };

  /* ── wire into the estimator ──────────────────────────────────────────────
     Wrapped rather than rewritten, so the map, the manual slider and the
     pricing logic underneath are exactly what they were. */
  function wire(){
    if(typeof eSelectAddress!=='function'||typeof eSolarMeasure!=='function') return false;
    var _select=eSelectAddress;
    eSelectAddress=window.eSelectAddress=function(fullAddr, lat, lon, stateAbbr){
      window.eRoofScanStart(fullAddr);
      return _select.apply(this, arguments);
    };
    /* the estimator's map is the trace map: once it is up, the trace takes it */
    if(typeof eInitMap==='function'){
      var _init=eInitMap;
      eInitMap=window.eInitMap=function(){
        var r; try{ r=_init.apply(this, arguments); }catch(e){}
        if(rsTraceActive()) rsTraceAttach();
        return r;
      };
    }
    eSolarMeasure=window.eSolarMeasure=function(lat, lon){
      rsMapLoad(lat, lon);   /* the street, in parallel with the measurement */
      if(window.RS_DEMO){ setTimeout(function(){ window.eRoofScanData(window.RS_DEMO); }, 1400); return; }
      fetch(E_SOLAR_URL,{ method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+E_SOLAR_ANON,'apikey':E_SOLAR_ANON}, body:JSON.stringify({lat:lat,lng:lon}) })
        .then(function(r){ return r.json(); })
        .then(function(d){ window.eRoofScanData(d&&d.found&&d.totalAreaSqft>0 ? d : null); })
        .catch(function(){ window.eRoofScanData(null); });
    };
    var sub=document.querySelector('#e-addrpanel .e-ssub');
    if(sub) sub.textContent='Enter the address, then tap the corners of your roof on the satellite map. We measure the slope from satellite and build your roof from your outline.';
    /* going back to the ZIP step abandons a scan in progress */
    if(typeof eZipBack==='function'){ var _back=eZipBack; eZipBack=window.eZipBack=function(){ stop(); rsTraceReset(); var s=$('rs-stage'); if(s) s.classList.remove('on'); return _back.apply(this, arguments); }; }
    if(typeof eRestart==='function'){ var _rs=eRestart; eRestart=window.eRestart=function(){ stop(); rsTraceReset(); var s=$('rs-stage'); if(s) s.classList.remove('on'); var p=$('e-addrpanel'); if(p){ p.classList.remove('rs-mode','rs-fallback'); } return _rs.apply(this, arguments); }; }
    window.rsDebug={ get st(){ return st; }, get trace(){ return rsT; } };
    return true;
  }
  if(!wire()){ document.addEventListener('DOMContentLoaded', wire); }
})();
</script>
