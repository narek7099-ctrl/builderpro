<!-- ROOF SCAN — injected into the roofing estimator by tools/inject-roof-scan.py.
     Edit this file, then run:  python3 tools/inject-roof-scan.py && python3 tools/build-embeds.py

     Replaces "trace your roof with dots" with a measured scan. The measurement
     is real — it is the same satellite roof measurement (Google Solar, through
     the rapid-handler function) the estimator already fetched and then threw
     half of away: it kept the slope and made the homeowner trace the area by
     hand. Now it keeps both.

     The 15 seconds are deliberate. The answer usually arrives in one or two,
     and a number that appears instantly reads as a guess; one that visibly
     took work reads as measured. The time is spent on a white-block model of
     THEIR roof — its footprint and slope come from the measurement, so a
     steep roof looks steep — while the steps name what really happened.

     If satellite has no read on the address (new build, rural, dense tree
     cover), the scan says so plainly and hands over to the old trace map and
     the manual size slider, which are kept for exactly that. -->

<script id="rs-script">
(function(){
  /* ── timeline: when each step begins, in seconds. The last entry is the end. ── */
  var RS_STEPS=[
    {t:0.0,  k:'Locating your property',        s:'Matching the address to its parcel'},
    {t:2.6,  k:'Pulling satellite imagery',      s:'High-resolution overhead imagery of the roof'},
    {t:5.6,  k:'Detecting roof planes',          s:'Finding every edge, ridge and hip'},
    {t:8.8,  k:'Measuring the slope',            s:'Reading pitch from the surface model'},
    {t:11.8, k:'Calculating true roof area',     s:'Footprint × slope — the surface you actually shingle'}
  ];
  var RS_END=15.0;
  var RS_WAIT_MAX=28;      /* never hold the homeowner longer than this for a slow answer */
  var RS_LABELS=['Locate','Imagery','Roof planes','Slope','Area'];

  var st=null;             /* the running scan */

  function $(id){ return document.getElementById(id); }
  function reduced(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }

  /* ── stage markup, built once, placed where the trace map used to sit ── */
  function ensureStage(){
    var stage=$('rs-stage'); if(stage) return stage;
    var panel=$('e-addrpanel'), anchor=$('e-mapwrap'); if(!panel||!anchor) return null;
    stage=document.createElement('div'); stage.className='rs-stage'; stage.id='rs-stage';
    stage.setAttribute('role','status'); stage.setAttribute('aria-live','polite');
    stage.innerHTML=
      '<div class="rs-canvas-wrap"><canvas id="rs-cv" aria-hidden="true"></canvas>'
     +'<div class="rs-addr"><i></i><span id="rs-addr"></span></div>'
     +'<div class="rs-readout" id="rs-readout"><b id="rs-rv">0</b><span id="rs-rl">sq ft of roof</span></div></div>'
     +'<div class="rs-panel">'
     +  '<div id="rs-live"><div class="rs-now"><span class="rs-spin"></span><span id="rs-now">Starting scan</span></div>'
     +  '<div class="rs-sub" id="rs-sub"></div><div class="rs-bar"><i id="rs-bar"></i></div>'
     +  '<div class="rs-steps" id="rs-steps">'+RS_LABELS.map(function(l){ return '<div>'+l+'</div>'; }).join('')+'</div></div>'
     +  '<div class="rs-result" id="rs-result"></div>'
     +'</div>';
    anchor.parentNode.insertBefore(stage, anchor);
    return stage;
  }

  /* ── the house model, in feet ──────────────────────────────────────────────
     Footprint from the measured area and slope: plan = true area × cos(slope).
     Proportioned 1.55 : 1, which is close to the median US single-family
     footprint. Satellite gives the area and the pitch, not the plan shape, so
     the shape is the typical one and the size and steepness are theirs. */
  function modelFor(trueSqft, pitchDeg){
    var p=Math.max(0, Math.min(55, pitchDeg||22));
    var plan=Math.max(600, (trueSqft||2000)*Math.cos(p*Math.PI/180));
    var D=Math.sqrt(plan/1.55), W=D*1.55;
    return { W:W, D:D, H:10, pitch:p, o:1.6 };
  }


  /* ── their actual roof, from the planes satellite found ────────────────────
     Solar returns every roof plane with its slope, the compass direction it
     faces, its height and a north-up bounding box. Houses are rarely built
     square to north, so first find the house's own grid (planes face along
     it, 90° apart), turn everything onto that grid, and each plane becomes a
     rectangle sloping one of four ways. Its size comes from its measured
     ground area, so a garage wing is garage-sized and sits where the garage
     is. Under each plane, walls to the ground — a white block, not a render,
     but the outline and the roof are theirs. */
  function planesModel(roof){
    var ps=(roof&&roof.planes)||[]; if(ps.length<2) return null;
    var lat0=0,lng0=0; ps.forEach(function(p){ lat0+=p.lat; lng0+=p.lng; }); lat0/=ps.length; lng0/=ps.length;
    var FT=3.28084, kx=111320*Math.cos(lat0*Math.PI/180)*FT, kz=110574*FT;
    function loc(la,ln){ return [ (ln-lng0)*kx, -(la-lat0)*kz ]; }        /* x east, z south */
    /* the house's grid: circular mean of the facing directions, folded to 90° */
    var sx=0, sy=0; ps.forEach(function(p){ var a=p.azimuth*Math.PI/180*4, w=p.groundSqft; sx+=Math.cos(a)*w; sy+=Math.sin(a)*w; });
    var th=Math.atan2(sy,sx)/4, ct=Math.cos(-th), st2=Math.sin(-th);
    function rot(v){ return [v[0]*ct - v[1]*st2, v[0]*st2 + v[1]*ct]; }
    var facets=ps.map(function(p){
      var c=rot(loc(p.lat,p.lng));
      /* Solar's box is north-up around a plane that is turned th off north.
         For a w×d rectangle turned th, the box is  Bx = w|cos|+d|sin|,
         Bz = w|sin|+d|cos|  — solve that for w and d. Shrinking the loose box
         evenly instead would square every plane off: a 52 ft eave came out 32.
         Near 45° the two equations say the same thing, so there it falls
         back to the even shrink. Either way the result is trimmed to the
         plane's measured ground area. */
      var a=loc(p.sw[0],p.sw[1]), b=loc(p.ne[0],p.ne[1]);
      var Bx=Math.abs(b[0]-a[0]), Bz=Math.abs(b[1]-a[1]);
      var cc=Math.abs(Math.cos(th)), ss=Math.abs(Math.sin(th)), den=cc*cc-ss*ss, ex, ez;
      if(Math.abs(den)>0.25){ ex=(Bx*cc-Bz*ss)/den; ez=(Bz*cc-Bx*ss)/den; }
      if(!(ex>2&&ez>2)){ ex=Bx; ez=Bz; }
      var g=Math.max(20,p.groundSqft), k=Math.sqrt(g/(ex*ez));
      ex=Math.max(4,ex*k); ez=Math.max(4,ez*k);
      /* which of the four grid directions this plane slopes down toward */
      var q=Math.round(((p.azimuth*Math.PI/180 - th)/(Math.PI/2)))%4; if(q<0) q+=4;
      var dir=[[0,-1],[1,0],[0,1],[-1,0]][q];                          /* north, east, south, west */
      return {cx:c[0], cz:c[1], ex:ex, ez:ez, dir:dir, pitch:p.pitch, h:p.h*FT};
    });
    /* centre it, and put the ground one storey under the lowest eave */
    var minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9,lowEave=1e9,top=-1e9;
    facets.forEach(function(f){
      minX=Math.min(minX,f.cx-f.ex/2); maxX=Math.max(maxX,f.cx+f.ex/2);
      minZ=Math.min(minZ,f.cz-f.ez/2); maxZ=Math.max(maxZ,f.cz+f.ez/2);
      var half=(f.dir[0]?f.ex:f.ez)/2, rise=half*Math.tan(Math.min(60,f.pitch)*Math.PI/180);
      f.rise=rise; lowEave=Math.min(lowEave,f.h-rise); top=Math.max(top,f.h+rise);
    });
    var ox=(minX+maxX)/2, oz=(minZ+maxZ)/2, base=lowEave-10;
    var faces=[], roofEdges=[], eaves=[];
    facets.forEach(function(f, gi){
      var x0=f.cx-ox-f.ex/2, x1=f.cx-ox+f.ex/2, z0=f.cz-oz-f.ez/2, z1=f.cz-oz+f.ez/2;
      var hc=f.h-base, flat=f.pitch<5;
      /* height of the roof at a corner: lower on the downslope side */
      function hy(x,z){ if(flat) return hc; var t=f.dir[0]? (x-(x0+x1)/2)/((x1-x0)/2)*f.dir[0] : (z-(z0+z1)/2)/((z1-z0)/2)*f.dir[1]; return hc - t*f.rise; }
      var c=[[x0,z0],[x1,z0],[x1,z1],[x0,z1]];
      var top4=c.map(function(p){ return [p[0],hy(p[0],p[1]),p[1]]; });
      var bot4=c.map(function(p){ return [p[0],0,p[1]]; });
      for(var i=0;i<4;i++){ var j=(i+1)%4; faces.push({v:[bot4[i],bot4[j],top4[j],top4[i]], kind:'wall', grp:gi}); }
      faces.push({v:top4, kind:'roof', grp:gi});
      for(var i2=0;i2<4;i2++){ roofEdges.push([top4[i2],top4[(i2+1)%4]]); }
      /* the eave is the low edge of the plane */
      var lo=[0,1,2,3].filter(function(i){ return Math.abs(top4[i][1]-(hc-f.rise))<0.01; });
      if(lo.length===2) eaves.push([top4[lo[0]],top4[lo[1]]]);
    });
    var W=maxX-minX, D=maxZ-minZ;
    return { m:{ W:W, D:D, H:(top-base)*0.7, pitch:0, o:0 },
             geo:{ faces:faces, roofEdges:roofEdges, ridge:null, eaves:eaves.length?eaves:roofEdges.slice(0,4), planes:facets.length } };
  }

  function buildGeometry(m){
    var W=m.W/2, D=m.D/2, H=m.H, o=m.o;
    var faces=[], roofEdges=[];
    /* walls */
    var g=[[-W,0,-D],[W,0,-D],[W,0,D],[-W,0,D]], t=[[-W,H,-D],[W,H,-D],[W,H,D],[-W,H,D]];
    for(var i=0;i<4;i++){ var j=(i+1)%4; faces.push({v:[g[i],g[j],t[j],t[i]], kind:'wall'}); }
    var tan=Math.tan(m.pitch*Math.PI/180);
    var ex=W+o, ez=D+o, eh=H-o*tan*0.6;       /* eaves overhang the walls a little */
    var e=[[-ex,eh,-ez],[ex,eh,-ez],[ex,eh,ez],[-ex,eh,ez]];
    if(m.pitch<5){
      var top=H+1.2;
      faces.push({v:[[-ex,top,-ez],[ex,top,-ez],[ex,top,ez],[-ex,top,ez]], kind:'roof'});
      roofEdges=[[[-ex,top,-ez],[ex,top,-ez]],[[ex,top,-ez],[ex,top,ez]],[[ex,top,ez],[-ex,top,ez]],[[-ex,top,ez],[-ex,top,-ez]]];
      return {faces:faces, roofEdges:roofEdges, ridge:null, eave:roofEdges[0], eaves:roofEdges.slice(0,4)};
    }
    /* hip roof: ridge runs along the long side */
    var rh=eh+ez*tan, rx=Math.max(0.5, ex-ez);
    var r1=[-rx,rh,0], r2=[rx,rh,0];
    faces.push({v:[e[0],e[1],r2,r1], kind:'roof'});     /* front slope  */
    faces.push({v:[e[2],e[3],r1,r2], kind:'roof'});     /* back slope   */
    faces.push({v:[e[1],e[2],r2], kind:'roof'});        /* right hip    */
    faces.push({v:[e[3],e[0],r1], kind:'roof'});        /* left hip     */
    /* drawn in the order a roofer would read them: eaves, then hips, then the ridge */
    roofEdges=[[e[0],e[1]],[e[1],e[2]],[e[2],e[3]],[e[3],e[0]],[e[0],r1],[e[1],r2],[e[2],r2],[e[3],r1],[r1,r2]];
    return {faces:faces, roofEdges:roofEdges, ridge:[r1,r2], eave:[e[0],e[1]], eaves:roofEdges.slice(0,4)};
  }

  /* ── projection ── */
  function makeProj(cv, m, yaw, bob){
    var w=cv.width, h=cv.height, tilt=0.46;
    var span=Math.max(m.W, m.D)+m.o*2;
    var scale=Math.min(w, h*1.45)/(span*1.55);
    var cy=Math.cos(yaw), sy=Math.sin(yaw), ct=Math.cos(tilt), stl=Math.sin(tilt);
    return function(p){
      var x=p[0]*cy - p[2]*sy, z=p[0]*sy + p[2]*cy, y=p[1]-m.H*0.9+bob;
      /* camera above and in front, looking down: far points sit higher on
         screen, high points sit nearer the camera */
      var y2=y*ct + z*stl, z2=z*ct - y*stl;
      var persp=1/(1+z2/(span*6));
      return {x:w/2 + x*scale*persp, y:h*0.53 - y2*scale*persp, z:z2};
    };
  }

  function shade(face, P, kind){
    /* light from above-left-front, in screen space after projection */
    var a=P(face.v[0]), b=P(face.v[1]), c=P(face.v[2]);
    var ux=b.x-a.x, uy=b.y-a.y, vx=c.x-a.x, vy=c.y-a.y;
    var cross=ux*vy-uy*vx;                        /* sign = facing */
    var lit=Math.abs(cross)/(Math.hypot(ux,uy)*Math.hypot(vx,vy)+1e-6);
    var k=kind==='roof'?(0.86+lit*0.14):(0.72+lit*0.22);
    return k;
  }

  function draw(){
    if(!st) return;
    var cv=st.cv, ctx=st.ctx, dpr=st.dpr;
    var r=cv.getBoundingClientRect();
    if(cv.width!==Math.round(r.width*dpr)||cv.height!==Math.round(r.height*dpr)){ cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); }
    var now=(performance.now()-st.t0)/1000, T=st.clock;
    var w=cv.width, h=cv.height;
    ctx.clearRect(0,0,w,h);

    /* ease the model toward the measured one once it arrives */
    var tgt=st.target||st.model, cur=st.model, k=Math.min(1, 0.06);
    ['W','D','pitch'].forEach(function(f){ cur[f]+= (tgt[f]-cur[f])*k; });
    var geo=st.planes? st.planes.geo : buildGeometry(cur);
    var pm=st.planes? st.planes.m : cur;

    var yaw=st.still? st.yaw : (st.yaw=0.62+now*0.32);
    var bob=reduced()?0:Math.sin(now*1.3)*0.45;
    var P=makeProj(cv, pm, yaw, bob);

    /* ground: a faint survey grid and the house's shadow, well below it */
    ctx.save();
    var grd=ctx.createRadialGradient(w/2,h*0.83,0,w/2,h*0.83,w*0.42);
    grd.addColorStop(0,'rgba(5,12,28,.55)'); grd.addColorStop(1,'rgba(5,12,28,0)');
    ctx.fillStyle=grd; ctx.beginPath(); ctx.ellipse(w/2,h*0.83,w*0.30-bob*3*dpr,h*0.075,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(120,160,230,.10)'; ctx.lineWidth=1*dpr;
    for(var gx=-6; gx<=6; gx++){ var xx=w/2+gx*w*0.06; ctx.beginPath(); ctx.moveTo(w/2+(xx-w/2)*0.55,h*0.72); ctx.lineTo(xx,h*0.98); ctx.stroke(); }
    for(var gz=0; gz<5; gz++){ var yy=h*0.72+gz*h*0.065; ctx.beginPath(); ctx.moveTo(w*0.14,yy); ctx.lineTo(w*0.86,yy); ctx.stroke(); }
    ctx.restore();

    /* how far along each visual beat is */
    var appear=Math.min(1, T/1.6);                            /* house fades in */
    var edgeP=Math.max(0, Math.min(1,(T-5.8)/2.8));             /* roof lines draw */
    var tintP=Math.max(0, Math.min(1,(T-7.0)/1.8));             /* planes light up */
    var labelP=Math.max(0, Math.min(1,(T-9.0)/1.2));            /* measurements  */

    /* faces, back to front */
    var faces=geo.faces.map(function(f){ var pts=f.v.map(P), z=pts.reduce(function(s,p){ return s+p.z; },0)/pts.length; return {f:f,pts:pts,z:z}; });
    var gz={}; faces.forEach(function(F){ var g=F.f.grp; if(g===undefined) return; var o=gz[g]||(gz[g]={s:0,n:0}); F.pts.forEach(function(p){ o.s+=p.z; o.n++; }); });
    faces.sort(function(a,b){
      var ga=a.f.grp, gb=b.f.grp;
      if(ga!==undefined&&gb!==undefined&&ga!==gb) return gz[gb].s/gz[gb].n - gz[ga].s/gz[ga].n;
      return b.z-a.z;
    });
    ctx.save(); ctx.globalAlpha=appear;
    faces.forEach(function(F){
      var s=shade(F.f,P,F.f.kind);
      var base=F.f.kind==='roof'?[246,249,255]:[233,238,247];
      var col=base.map(function(c){ return Math.round(c*s); });
      if(F.f.kind==='roof'&&tintP>0){ col=[Math.round(col[0]-(col[0]-205)*tintP*0.55),Math.round(col[1]-(col[1]-222)*tintP*0.55),Math.round(col[2]-(col[2]-255)*tintP*0.25)]; }
      ctx.fillStyle='rgb('+col.join(',')+')';
      ctx.strokeStyle='rgba(40,70,130,.22)'; ctx.lineWidth=1*dpr; ctx.lineJoin='round';
      ctx.beginPath(); F.pts.forEach(function(p,i){ i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); }); ctx.closePath(); ctx.fill(); ctx.stroke();
    });
    ctx.restore();

    /* scan beam, while imagery is being read */
    if(T>2.4&&T<6.2){
      var bp=((T-2.4)/1.9)%1, by=h*0.12+bp*h*0.72;
      var bg=ctx.createLinearGradient(0,by-h*0.10,0,by+2);
      bg.addColorStop(0,'rgba(91,147,255,0)'); bg.addColorStop(1,'rgba(143,180,255,.30)');
      ctx.fillStyle=bg; ctx.fillRect(w*0.1,by-h*0.10,w*0.8,h*0.10);
      ctx.fillStyle='rgba(190,215,255,.9)'; ctx.fillRect(w*0.1,by,w*0.8,1.5*dpr);
    }

    /* roof lines, drawn edge by edge */
    if(edgeP>0){
      var n=geo.roofEdges.length, done=edgeP*n;
      ctx.save(); ctx.lineCap='round'; ctx.shadowColor='rgba(91,147,255,.9)'; ctx.shadowBlur=8*dpr;
      for(var i=0;i<n;i++){
        var part=Math.max(0,Math.min(1,done-i)); if(part<=0) break;
        var a=P(geo.roofEdges[i][0]), b=P(geo.roofEdges[i][1]);
        ctx.strokeStyle= (geo.ridge&&i===n-1)?'#ffd27a':'#5b93ff';
        ctx.lineWidth=2.4*dpr;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(a.x+(b.x-a.x)*part, a.y+(b.y-a.y)*part); ctx.stroke();
        ctx.fillStyle='#dbe8ff'; ctx.beginPath(); ctx.arc(a.x,a.y,2.4*dpr,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    /* dimension tags on the ridge and the front eave, from the real model */
    if(labelP>0&&st.target){
      ctx.save(); ctx.globalAlpha=labelP;
      var boxes=[];
      var tag=function(seg, text, lift){
        var a=P(seg[0]), b=P(seg[1]); var mx=(a.x+b.x)/2, my=(a.y+b.y)/2-lift*dpr;
        ctx.font='600 '+(11*dpr)+'px Inter,system-ui,sans-serif';
        var tw=ctx.measureText(text).width+14*dpr, th=20*dpr;
        /* step clear of any tag already placed */
        for(var q=0;q<boxes.length;q++){ var o=boxes[q]; if(Math.abs(o.x-mx)<(o.w+tw)/2+4*dpr && Math.abs(o.y-my)<th+4*dpr){ my=o.y-th-6*dpr; } }
        boxes.push({x:mx,y:my,w:tw});
        ctx.fillStyle='rgba(8,20,46,.86)'; ctx.strokeStyle='rgba(143,180,255,.55)'; ctx.lineWidth=1*dpr;
        roundRect(ctx, mx-tw/2, my-th/2, tw, th, 6*dpr); ctx.fill(); ctx.stroke();
        ctx.fillStyle='#e6efff'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text, mx, my+0.5*dpr);
      };
      var m=cur;
      /* the eave nearest the viewer, so its tag is never hidden behind the roof */
      var eaves=geo.eaves, near=eaves[0], nz=1e9;
      var zs=eaves.map(function(e2){ return (P(e2[0]).z+P(e2[1]).z)/2; }), zm=zs.reduce(function(a,b){return a+b;},0)/zs.length, best=-1;
      eaves.forEach(function(e2,i){ var L=Math.hypot(e2[1][0]-e2[0][0], e2[1][2]-e2[0][2]); if(zs[i]<=zm+1e-6 && L>best){ best=L; near=e2; } });
      var len=Math.hypot(near[1][0]-near[0][0], near[1][2]-near[0][2]);
      tag(near, 'Eave '+Math.round(len)+' ft', -16);
      if(geo.ridge){ tag(geo.ridge, 'Ridge '+Math.round(Math.max(1,(m.W+2*m.o)-(m.D+2*m.o)))+' ft', 16); }
      ctx.restore();
    }

    st.raf=requestAnimationFrame(draw);
  }
  function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

  /* ── the clock: steps advance on schedule, but the last one waits for the answer ── */
  function tick(){
    if(!st) return;
    var el=(performance.now()-st.t0)/1000;
    /* hold on "measuring the slope" until the measurement is actually here:
       the clock stops, the house keeps turning, nothing jumps */
    var holdAt=RS_STEPS[4].t-0.2, raw=el-(st.paused||0);
    if(st.data===undefined && raw>holdAt){
      st.paused=el-holdAt; raw=holdAt;
      if(el>RS_WAIT_MAX){ finish(null); return; }
    }
    if(st.failed && raw>=RS_STEPS[2].t){ finish(null); return; }
    st.clock=Math.min(RS_END, raw);
    var T=st.clock;

    var idx=0; for(var i=0;i<RS_STEPS.length;i++){ if(T>=RS_STEPS[i].t) idx=i; }
    if(idx!==st.idx){
      st.idx=idx;
      $('rs-now').textContent=RS_STEPS[idx].k+'…';
      $('rs-sub').textContent=RS_STEPS[idx].s;
      var ds=$('rs-steps').children; for(var j=0;j<ds.length;j++){ ds[j].className=j<idx?'done':(j===idx?'act':''); }
    }
    /* once the slope is known, say it — this is the moment it stops feeling generic */
    if(idx===3&&st.target&&!st.saidPitch){ st.saidPitch=1; $('rs-sub').textContent='Slope found: '+pitchText(st.target.pitch); }
    $('rs-bar').style.width=Math.round(T/RS_END*100)+'%';

    /* the area counts up through the last step */
    if(st.target&&T>=RS_STEPS[4].t){
      var f=Math.min(1,(T-RS_STEPS[4].t)/(RS_END-RS_STEPS[4].t-0.4)); f=1-Math.pow(1-f,3);
      $('rs-readout').classList.add('on'); $('rs-rv').textContent=Math.round(st.data.trueSqft*f).toLocaleString();
    }
    if(T>=RS_END && st.data){ finish(st.data); return; }
    st.timer=setTimeout(tick, 60);
  }

  function pitchText(deg){
    var over12=Math.round(12*Math.tan(deg*Math.PI/180));
    return deg<5 ? 'flat / low-slope' : (over12+'/12 pitch ('+Math.round(deg)+'°)');
  }

  /* ── start: called the moment an address is chosen ── */
  window.eRoofScanStart=function(addr){
    var stage=ensureStage(); if(!stage) return;
    var panel=$('e-addrpanel'); panel.classList.add('rs-mode'); panel.classList.remove('rs-fallback');
    stop();
    $('rs-addr').textContent=String(addr||'').split(',').slice(0,3).join(',');
    $('rs-live').style.display=''; $('rs-result').className='rs-result'; $('rs-result').innerHTML='';
    $('rs-readout').classList.remove('on'); $('rs-rv').textContent='0'; $('rs-bar').style.width='0';
    var ds=$('rs-steps').children; for(var j=0;j<ds.length;j++) ds[j].className='';
    stage.classList.add('on');
    var cv=$('rs-cv');
    st={ cv:cv, ctx:cv.getContext('2d'), dpr:Math.min(2, window.devicePixelRatio||1), t0:performance.now(),
         clock:0, idx:-1, data:undefined, model:modelFor(2000, 22), target:null, yaw:0.62 };
    /* the continue button stays off until the numbers are in */
    try{ eS.sqft=0; eS.usedMap=false; eCheckBtn1(); }catch(e){}
    draw(); tick();
  };

  /* ── the measurement, from the satellite read (or null if there wasn't one) ── */
  window.eRoofScanData=function(d){
    if(!st) return;
    if(d && d.totalAreaSqft>0){
      var pitch=+d.avgPitchDegrees||0;
      var trueSqft=Math.round(d.totalAreaSqft);
      var plan=Math.round(trueSqft*Math.cos(pitch*Math.PI/180));
      st.data={ trueSqft:trueSqft, planSqft:plan, pitch:pitch, planes:(d.roof&&d.roof.planes&&d.roof.planes.length)||0 };
      st.target=modelFor(trueSqft, pitch);
      try{ st.planes=planesModel(d.roof); }catch(e){ st.planes=null; }   /* no planes: the typical-house model stays */
    } else {
      st.data=null; st.failed=true;
    }
  };

  function finish(data){
    if(!st) return;
    clearTimeout(st.timer);
    var res=$('rs-result');
    $('rs-live').style.display='none';
    if(!data){
      st.still=true;
      res.innerHTML='<div class="rs-now rs-fail">We couldn’t get a clean read on this roof from satellite</div>'
        +'<p class="rs-note">It happens with new builds, heavy tree cover and some rural addresses. Trace it on the map below instead — it takes about a minute — or enter a rough size.</p>';
      res.className='rs-result on';
      fallback(true);
      return;
    }
    $('rs-bar').style.width='100%';
    $('rs-rv').textContent=data.trueSqft.toLocaleString();
    setTimeout(function(){ var ro=$('rs-readout'); if(ro) ro.classList.remove('on'); }, 900);
    var squares=Math.ceil(data.trueSqft/100);
    res.innerHTML=
      '<div class="rs-grid">'
      +'<div><b>'+data.trueSqft.toLocaleString()+'</b><span>Roof area, sq ft</span></div>'
      +'<div><b>'+squares+'</b><span>Roofing squares</span></div>'
      +'<div><b>'+(data.pitch<5?'Flat':Math.round(12*Math.tan(data.pitch*Math.PI/180))+'/12')+'</b><span>Pitch'+(data.pitch>=5?' · '+Math.round(data.pitch)+'°':'')+'</span></div>'
      +(data.planes>1 ? '<div><b>'+data.planes+'</b><span>Roof planes</span></div>' : '<div><b>'+data.planSqft.toLocaleString()+'</b><span>Footprint, sq ft</span></div>')
      +'</div>'
      +'<p class="rs-note">Measured from satellite. Roof area is the sloped surface you actually shingle — larger than the footprint because the roof is pitched. Squares are before waste; your roofer adds that on site.</p>'
      +'<button type="button" class="rs-fix" onclick="eRoofScanFix()">Not your roof? Measure it yourself</button>';
    res.className='rs-result on';

    /* hand the numbers to the estimator exactly as a trace would have */
    try{
      eS.sqft=data.trueSqft; eS.planSqft=data.planSqft; eS.usedMap=true;
      eS.solarPitchDeg=Math.round(data.pitch*10)/10;
      eS.pitch=eSolarPitchCategory(data.pitch); eS.flatRoof=data.pitch<5;
      eMeasurePitch=eDegToPitch(data.pitch);
      eSolarPreselectPitch(eS.pitch);
      eCheckBtn1();
      var b=$('e-btn1'); if(b){ b.classList.add('rs-ready'); }
    }catch(e){}
    /* let the finished model settle and keep turning, slower */
    st.done=true;
  }

  function stop(){ if(st){ clearTimeout(st.timer); cancelAnimationFrame(st.raf); } st=null; }

  function fallback(showMap){
    var panel=$('e-addrpanel'); panel.classList.remove('rs-mode'); panel.classList.add('rs-fallback');
    var mw=$('e-mapwrap'); if(mw) mw.style.display='block';
    try{ if(eLmap) setTimeout(function(){ eLmap.invalidateSize(); },120); }catch(e){}
  }

  window.eRoofScanFix=function(){
    try{ eClearDrawing(); }catch(e){}
    var stage=$('rs-stage'); stage.classList.remove('on');
    stop(); fallback(true);
    var mw=$('e-mapwrap'); if(mw&&mw.scrollIntoView) mw.scrollIntoView({behavior:'smooth',block:'center'});
  };

  /* ── wire into the estimator ──────────────────────────────────────────────
     Wrapped rather than rewritten, so the trace map, the manual slider and the
     pricing logic underneath are exactly what they were. */
  function wire(){
    if(typeof eSelectAddress!=='function'||typeof eSolarMeasure!=='function') return false;
    var _select=eSelectAddress;
    eSelectAddress=window.eSelectAddress=function(fullAddr, lat, lon, stateAbbr){
      window.eRoofScanStart(fullAddr);
      return _select.apply(this, arguments);
    };
    /* the map is still initialised underneath, ready for the fallback; it
       just is not shown while the scan runs */
    if(typeof eInitMap==='function'){
      var _init=eInitMap;
      eInitMap=window.eInitMap=function(){
        var r; try{ r=_init.apply(this, arguments); }catch(e){}
        return r;
      };
    }
    eSolarMeasure=window.eSolarMeasure=function(lat, lon){
      if(window.RS_DEMO){ setTimeout(function(){ window.eRoofScanData(window.RS_DEMO); }, 1400); return; }
      fetch(E_SOLAR_URL,{ method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+E_SOLAR_ANON,'apikey':E_SOLAR_ANON}, body:JSON.stringify({lat:lat,lng:lon}) })
        .then(function(r){ return r.json(); })
        .then(function(d){
          if(d&&d.centerLat&&d.centerLng&&typeof eLmap!=='undefined'&&eLmap){ try{ eLmap.setView([d.centerLat,d.centerLng],20); }catch(e){} }
          window.eRoofScanData(d&&d.found&&d.totalAreaSqft>0 ? d : null);
        })
        .catch(function(){ window.eRoofScanData(null); });
    };
    /* the step copy no longer asks anyone to trace */
    var sub=document.querySelector('#e-addrpanel .e-ssub');
    if(sub) sub.textContent='Enter the address and we’ll measure the roof from satellite — area, pitch and all. Nothing to draw.';
    /* going back to the ZIP step abandons a scan in progress */
    if(typeof eZipBack==='function'){ var _back=eZipBack; eZipBack=window.eZipBack=function(){ stop(); var s=$('rs-stage'); if(s) s.classList.remove('on'); return _back.apply(this, arguments); }; }
    if(typeof eRestart==='function'){ var _rs=eRestart; eRestart=window.eRestart=function(){ stop(); var s=$('rs-stage'); if(s) s.classList.remove('on'); var p=$('e-addrpanel'); if(p){ p.classList.remove('rs-mode','rs-fallback'); } return _rs.apply(this, arguments); }; }
    return true;
  }
  if(!wire()){ document.addEventListener('DOMContentLoaded', wire); }
})();
</script>
