<style id="hs-style">
/* The main site's own tokens (index.html :root): Geist, ink #001530, grey
   #788493, hairline #dce3ec, blue #006fff, and its one easing curve.
   White on white; the house carries the depth, not the frame. */
#est-embed .rs-stage,#est-embed .rs-result{--rs-ink:#001530;--rs-grey:#788493;--rs-line:#dce3ec;--rs-line2:#eef1f6;--rs-blue:#006fff;--rs-blue-l:#e6f0ff;--rs-ease:cubic-bezier(.22,1,.36,1);
  font-family:'Geist',system-ui,-apple-system,sans-serif;}
#est-embed .rs-stage{display:none;position:relative;margin:14px 0 6px;border:1px solid var(--rs-line);border-radius:18px;overflow:hidden;background:#fff;color:var(--rs-ink);}
#est-embed .rs-stage.on{display:block;animation:rsIn .6s var(--rs-ease) both;}
@keyframes rsIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#est-embed .rs-canvas-wrap{position:relative;height:300px;}

#est-embed .rs-addr{position:absolute;left:18px;top:16px;right:18px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--rs-grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

#est-embed .rs-panel{padding:16px 18px 18px;border-top:1px solid var(--rs-line2);}

<script id="hs-script">
/* HOUSE SCAN — the map-to-house shot for every calculator except roofing.
   Source for embed-src/house-scan.html, which tools/build-house-scan.py
   assembles from this file plus the map and house code shared with the roof
   scan (embed-src/roof-scan.html), so that code lives in one place.

   The shot: their street from above, their home's outline lights up, the
   camera tilts and the house rises out of the map — then each trade ends its
   own way, all in the same white-block look:

     hvac         a condenser appears beside the house, fan spinning; the camera
                  closes in and turns around it
     countertops  the roof lifts off and the camera drops into a kitchen
     trim         the roof lifts off; baseboard, casing and crown trace a room
     painting     every wall is traced and washed (a room, for interior jobs)
     pools        a pool is outlined, dug and filled in the back yard
     landscaping  the back yard is laid out: lawn, planting, stepping stones
     plumbing     the house turns to glass; supply lines run in to the fixtures
     electrical   the house turns to glass; circuits run out from the panel
     general      the whole house, every edge traced

   Everything is white — how things will LOOK is the image generator's job —
   and nothing waits on the homeowner's choices: the pool and the yard are
   picked at random (the same for the same address), and the real questions
   come after the scan, on the calculator's own steps.

   The measurement is the roof scan's: rapid-handler's building read, so the
   house is theirs. What it hands to each calculator is the step-1 number that
   trade asks for, where the house can supply it (home size for HVAC, painting
   and electrical; pool and yard size from the questions); otherwise the size
   slider opens for them as before. */
(function(){
  var TRADE = window.HS_TRADE || 'general';
  var HS_END = 15.0, HS_WAIT_MAX = 28;
  var st = null;
  (function(){ try{ if(document.getElementById('rs-geist')) return; var l=document.createElement('link'); l.id='rs-geist'; l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap'; (document.head||document.documentElement).appendChild(l); }catch(e){} })();
  function $(id){ return document.getElementById(id); }
  function reduced(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }

  /* ── the house model, in feet ──────────────────────────────────────────────
     Footprint from the measured area and slope: plan = true area × cos(slope).
     Proportioned 1.55 : 1, which is close to the median US single-family
     footprint. Satellite gives the area and the pitch, not the plan shape, so
     the shape is the typical one and the size and steepness are theirs. */
  function modelFor(trueSqft, pitchDeg){
    var p=Math.max(0, Math.min(55, pitchDeg||22));
    var plan=Math.max(600, (trueSqft||2000)*Math.cos(p*Math.PI/180));
    var D=Math.sqrt(plan/1.55), W=D*1.55;
    return { W:W, D:D, H:10, pitch:p, o:1.6 };
  }


  /* ── their actual roof, from the planes satellite found ────────────────────
     Solar returns every roof plane with its slope, the compass direction it
     faces, its height and a north-up bounding box. Houses are rarely built
     square to north, so first find the house's own grid (planes face along
     it, 90° apart), turn everything onto that grid, and each plane becomes a
     rectangle sloping one of four ways. Its size comes from its measured
     ground area, so a garage wing is garage-sized and sits where the garage
     is. Under each plane, walls to the ground — a white block, not a render,
     but the outline and the roof are theirs. */
  function planesModel(roof, origin){
    var ps=(roof&&roof.planes)||[]; if(ps.length<2) return null;
    var lat0=0,lng0=0; ps.forEach(function(p){ lat0+=p.lat; lng0+=p.lng; }); lat0/=ps.length; lng0/=ps.length;
    var FT=3.28084, kx=111320*Math.cos(lat0*Math.PI/180)*FT, kz=110574*FT;
    function loc(la,ln){ return [ (ln-lng0)*kx, -(la-lat0)*kz ]; }        /* x east, z south */
    /* the house's grid: circular mean of the facing directions, folded to 90° */
    var sx=0, sy=0; ps.forEach(function(p){ var a=p.azimuth*Math.PI/180*4, w=p.groundSqft; sx+=Math.cos(a)*w; sy+=Math.sin(a)*w; });
    var th=Math.atan2(sy,sx)/4, ct=Math.cos(-th), st2=Math.sin(-th);
    function rot(v){ return [v[0]*ct - v[1]*st2, v[0]*st2 + v[1]*ct]; }
    var facets=ps.map(function(p){
      var c=rot(loc(p.lat,p.lng));
      /* Solar's box is north-up around a plane that is turned th off north.
         For a w×d rectangle turned th, the box is  Bx = w|cos|+d|sin|,
         Bz = w|sin|+d|cos|  — solve that for w and d. Shrinking the loose box
         evenly instead would square every plane off: a 52 ft eave came out 32.
         Near 45° the two equations say the same thing, so there it falls
         back to the even shrink. Either way the result is trimmed to the
         plane's measured ground area. */
      var a=loc(p.sw[0],p.sw[1]), b=loc(p.ne[0],p.ne[1]);
      var Bx=Math.abs(b[0]-a[0]), Bz=Math.abs(b[1]-a[1]);
      var cc=Math.abs(Math.cos(th)), ss=Math.abs(Math.sin(th)), den=cc*cc-ss*ss, ex, ez;
      if(Math.abs(den)>0.25){ ex=(Bx*cc-Bz*ss)/den; ez=(Bz*cc-Bx*ss)/den; }
      if(!(ex>2&&ez>2)){ ex=Bx; ez=Bz; }
      var g=Math.max(20,p.groundSqft), k=Math.sqrt(g/(ex*ez));
      ex=Math.max(4,ex*k); ez=Math.max(4,ez*k);
      /* which of the four grid directions this plane slopes down toward */
      var q=Math.round(((p.azimuth*Math.PI/180 - th)/(Math.PI/2)))%4; if(q<0) q+=4;
      var dir=[[0,-1],[1,0],[0,1],[-1,0]][q];                          /* north, east, south, west */
      return {cx:c[0], cz:c[1], ex:ex, ez:ez, dir:dir, pitch:p.pitch, h:p.h*FT};
    });
    /* centre it, and put the ground one storey under the lowest eave */
    var minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9,lowEave=1e9,top=-1e9;
    facets.forEach(function(f){
      minX=Math.min(minX,f.cx-f.ex/2); maxX=Math.max(maxX,f.cx+f.ex/2);
      minZ=Math.min(minZ,f.cz-f.ez/2); maxZ=Math.max(maxZ,f.cz+f.ez/2);
      var half=(f.dir[0]?f.ex:f.ez)/2, rise=half*Math.tan(Math.min(60,f.pitch)*Math.PI/180);
      f.rise=rise; lowEave=Math.min(lowEave,f.h-rise); top=Math.max(top,f.h+rise);
    });
    var ox=(minX+maxX)/2, oz=(minZ+maxZ)/2, base=lowEave-10;
    var faces=[], roofEdges=[], eaves=[], foot=[];
    facets.forEach(function(f, gi){
      var x0=f.cx-ox-f.ex/2, x1=f.cx-ox+f.ex/2, z0=f.cz-oz-f.ez/2, z1=f.cz-oz+f.ez/2;
      var hc=f.h-base, flat=f.pitch<5;
      /* height of the roof at a corner: lower on the downslope side */
      function hy(x,z){ if(flat) return hc; var t=f.dir[0]? (x-(x0+x1)/2)/((x1-x0)/2)*f.dir[0] : (z-(z0+z1)/2)/((z1-z0)/2)*f.dir[1]; return hc - t*f.rise; }
      var c=[[x0,z0],[x1,z0],[x1,z1],[x0,z1]];
      var top4=c.map(function(p){ return [p[0],hy(p[0],p[1]),p[1]]; });
      var bot4=c.map(function(p){ return [p[0],0,p[1]]; });
      foot.push(bot4);
      for(var i=0;i<4;i++){ var j=(i+1)%4; faces.push({v:[bot4[i],bot4[j],top4[j],top4[i]], kind:'wall', grp:gi}); }
      faces.push({v:top4, kind:'roof', grp:gi});
      for(var i2=0;i2<4;i2++){ roofEdges.push([top4[i2],top4[(i2+1)%4]]); }
      /* the eave is the low edge of the plane */
      var lo=[0,1,2,3].filter(function(i){ return Math.abs(top4[i][1]-(hc-f.rise))<0.01; });
      if(lo.length===2) eaves.push([top4[lo[0]],top4[lo[1]]]);
    });
    /* Built on the house's own grid; now set back into the world the map is
       drawn in — north-up feet around the address — so the house rises out
       of the map exactly where it stands on it. Every corner is shared by
       several faces and edges, so each is moved once. */
    var o=origin||{lat:lat0,lng:lng0};
    var offx=(lng0-o.lng)*kx, offz=-(lat0-o.lat)*kz, cth=Math.cos(th), sth=Math.sin(th), seen=[];
    function toWorld(v){ if(v._w) return; v._w=1; seen.push(v); var x=v[0]+ox, z=v[2]+oz; v[0]=x*cth - z*sth + offx; v[2]=x*sth + z*cth + offz; }
    faces.forEach(function(f){ f.v.forEach(toWorld); });
    roofEdges.forEach(function(e){ toWorld(e[0]); toWorld(e[1]); });
    eaves.forEach(function(e){ toWorld(e[0]); toWorld(e[1]); });
    seen.forEach(function(v){ delete v._w; });
    var W=maxX-minX, D=maxZ-minZ;
    return { m:{ W:W, D:D, H:(top-base)*0.7, pitch:0, o:0 },
             geo:{ faces:faces, roofEdges:roofEdges, ridge:null, eaves:eaves.length?eaves:roofEdges.slice(0,4), planes:facets.length, foot:foot, axes:{th:th} } };   /* axes: the house's own grid, for the other trades' scenes */
  }

  function buildGeometry(m){
    var W=m.W/2, D=m.D/2, H=m.H, o=m.o;
    var faces=[], roofEdges=[];
    /* walls */
    var g=[[-W,0,-D],[W,0,-D],[W,0,D],[-W,0,D]], t=[[-W,H,-D],[W,H,-D],[W,H,D],[-W,H,D]];
    for(var i=0;i<4;i++){ var j=(i+1)%4; faces.push({v:[g[i],g[j],t[j],t[i]], kind:'wall'}); }
    var foot=[g];
    var tan=Math.tan(m.pitch*Math.PI/180);
    var ex=W+o, ez=D+o, eh=H-o*tan*0.6;       /* eaves overhang the walls a little */
    var e=[[-ex,eh,-ez],[ex,eh,-ez],[ex,eh,ez],[-ex,eh,ez]];
    if(m.pitch<5){
      var top=H+1.2;
      faces.push({v:[[-ex,top,-ez],[ex,top,-ez],[ex,top,ez],[-ex,top,ez]], kind:'roof'});
      roofEdges=[[[-ex,top,-ez],[ex,top,-ez]],[[ex,top,-ez],[ex,top,ez]],[[ex,top,ez],[-ex,top,ez]],[[-ex,top,ez],[-ex,top,-ez]]];
      return {faces:faces, roofEdges:roofEdges, ridge:null, eave:roofEdges[0], eaves:roofEdges.slice(0,4), foot:foot};
    }
    /* hip roof: ridge runs along the long side */
    var rh=eh+ez*tan, rx=Math.max(0.5, ex-ez);
    var r1=[-rx,rh,0], r2=[rx,rh,0];
    faces.push({v:[e[0],e[1],r2,r1], kind:'roof'});     /* front slope  */
    faces.push({v:[e[2],e[3],r1,r2], kind:'roof'});     /* back slope   */
    faces.push({v:[e[1],e[2],r2], kind:'roof'});        /* right hip    */
    faces.push({v:[e[3],e[0],r1], kind:'roof'});        /* left hip     */
    /* drawn in the order a roofer would read them: eaves, then hips, then the ridge */
    roofEdges=[[e[0],e[1]],[e[1],e[2]],[e[2],e[3]],[e[3],e[0]],[e[0],r1],[e[1],r2],[e[2],r2],[e[3],r1],[r1,r2]];
    return {faces:faces, roofEdges:roofEdges, ridge:[r1,r2], eave:[e[0],e[1]], eaves:roofEdges.slice(0,4), foot:foot};
  }

  /* ── projection ── */
  /* The house turns about a vertical axis through its own centre, and the
     framing is worked out once from the model rather than every frame: the
     scale fits the house's widest turning circle, so no angle of the turn
     is ever larger than another, and the centre never moves. Measuring each
     frame's outline and re-centring on it (as before) chased a shape that
     changes as it turns, which read as the house shaking. Orthographic, for
     the same reason — perspective makes the near corner swell and shrink. */
  function frameFor(geo){
    var mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9];
    geo.faces.forEach(function(f){ f.v.forEach(function(v){ for(var i=0;i<3;i++){ if(v[i]<mn[i])mn[i]=v[i]; if(v[i]>mx[i])mx[i]=v[i]; } }); });
    var c=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2], R=0;
    geo.faces.forEach(function(f){ f.v.forEach(function(v){ var d=Math.hypot(v[0]-c[0], v[2]-c[2]); if(d>R)R=d; }); });
    return {c:c, R:Math.max(1,R), H:Math.max(1,mx[1]-mn[1])};
  }
  /* cam: c (centre, world feet), R and H (what must fit), tilt (0.46 is
     the three-quarter view; PI/2 is straight down), yaw, zoom (1 = the
     house fills the frame; larger shows more of the street). */
  function makeProj(cv, cam){
    var w=cv.width, h=cv.height, ct=Math.cos(cam.tilt), stl=Math.sin(cam.tilt);
    var needW=2*cam.R, needH=2*cam.R*stl + cam.H*ct;
    var scale=Math.min(w*0.78/needW, h*0.74/needH)/cam.zoom;
    var cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw), g=cam.grow===undefined?1:cam.grow;
    var f=function(p){
      var px=p[0]-cam.c[0], py=p[1]*g-cam.c[1], pz=p[2]-cam.c[2];   /* walls rise from the ground */
      var x=px*cy - pz*sy, z=px*sy + pz*cy;
      var y2=py*ct + z*stl, z2=z*ct - py*stl;
      return {x:w/2 + x*scale, y:h/2 - y2*scale, z:z2};
    };
    f.scale=scale;
    return f;
  }



  /* ── the street around the house ─────────────────────────────────────────────
     The same white map the Lead Radar uses: OpenFreeMap's OpenMapTiles data
     (free, no key, no watermark, fine for commercial use). Rather than a map
     library, the scan fetches the one or few vector tiles around the address
     and draws the roads and buildings itself, in the same scene and with the
     same camera as the house — so the map can tilt and the house can rise
     out of it in one continuous shot, with no hand-off between two renderers.
     No key, no per-visitor cost, and nothing to download beyond the tiles.
     If the tiles cannot be had, the scan runs exactly as before, on white. */
  var RS_TILEJSON='https://tiles.openfreemap.org/planet';
  var RS_MAP_R=900;                 /* feet of street to draw around the house */
  var rsTileTpl=null;

  /* A minimal Mapbox Vector Tile reader: protobuf wire format, the layers,
     their features' tags and geometry commands. ~60 lines rather than a
     library on every contractor's site. */
  function rsMvt(buf){
    var b=new Uint8Array(buf), p=0;
    function vint(){ var r=0, s=0, c; do{ c=b[p++]; r+=(c&0x7f)*Math.pow(2,s); s+=7; }while(c>=0x80); return r; }
    function skip(t){ if(t===0) vint(); else if(t===1) p+=8; else if(t===2){ var l=vint(); p+=l; } else if(t===5) p+=4; }
    function str(end){ var out=''; try{ out=new TextDecoder().decode(b.subarray(p,end)); }catch(e){} p=end; return out; }
    function packed(end){ var a=[]; while(p<end) a.push(vint()); return a; }
    var layers={};
    while(p<b.length){
      var key=vint(), f=key>>3, t=key&7;
      if(f!==3||t!==2){ skip(t); continue; }
      var lend=vint()+p, L={name:'',extent:4096,keys:[],vals:[],feats:[]};
      while(p<lend){
        var k2=vint(), f2=k2>>3, t2=k2&7;
        if(f2===1&&t2===2){ var e1=vint()+p; L.name=str(e1); }
        else if(f2===5&&t2===0){ L.extent=vint(); }
        else if(f2===3&&t2===2){ var e3=vint()+p; L.keys.push(str(e3)); }
        else if(f2===4&&t2===2){

  };
  var PREFILL = {
    hvac:function(d){ return d.planSqft; }, painting:function(d){ return d.planSqft; }, electrical:function(d){ return d.planSqft; }
  };
  function fmt(n){ return (typeof n==='number') ? Math.round(n).toLocaleString() : String(n); }

  function finish(data){
    if(!st) return;
    clearTimeout(st.timer);
    var res=$('rs-result'), q=st.q||{};
    $('rs-live').style.display='none';
    if(!data){
      res.innerHTML='<div class="rs-fail">We couldn’t find this home from satellite</div>'
        +'<p class="rs-note">Common with new builds and heavy tree cover. You can still enter the size below.</p>';
      res.className='rs-result on';
      handoff(null, q); return;
    }
    $('rs-bar').style.width='100%';
    var cards=(RESULT[TRADE]||RESULT._)(data,q);
    res.innerHTML='<div class="rs-grid hs-grid3">'+cards.map(function(c){ return '<div><b>'+c[0]+'</b><span>'+c[1]+'</span></div>'; }).join('')+'</div>'
      +'<p class="rs-note">'+(PREFILL[TRADE]?'Measured from satellite. Adjust the size below if it’s off.':'Measured from satellite. Now tell us about the job.')+'</p>';
    res.className='rs-result on';
    handoff(data, q);
    st.done=true;
  }

  function handoff(data, q){
    var pn=panel(); pn.classList.remove('hs-mode'); pn.classList.add('hs-done');
    var v = (data&&PREFILL[TRADE]) ? PREFILL[TRADE](data,q) : null;
    var sw=$('e-sldwrap'), sld=$('e-sld');
    if(sw&&!$('hs-addrpanel')){ sw.style.display='block'; try{ window.eManualOpen=true; eManualOpen=true; }catch(e){} }
    if(sld&&typeof eUpdateSlider==='function'){
      var val = v ? Math.max(+sld.min, Math.min(+sld.max, Math.round(v/10)*10)) : +sld.value;
      if(!$('hs-addrpanel') || v) { try{ eUpdateSlider(val); }catch(e){} }
    }
    try{ eCheckBtn1(); }catch(e){}
    var cont=$('hs-cont'); if(cont) cont.disabled=false;
  }

  function stop(){ if(st){ clearTimeout(st.timer); cancelAnimationFrame(st.raf); } st=null; }

  /* ── plumbing, electrical and remodel had no address step: add one ─────────── */
  function insertPanel(){
    if($('e-mapwrap')||$('hs-addrpanel')) return;          /* already has one */
    var zp=$('e-zippanel'), ap=$('e-addrpanel'); if(!zp||!ap) return;
    var d=document.createElement('div'); d.className='e-addrpanel'; d.id='hs-addrpanel'; d.style.display='none';
    d.innerHTML=
      '<div class="e-shdr"><span class="e-seye">Your property</span>'
     +'<div class="e-stitle">What’s the<br><em>Property Address?</em></div>'
     +'<div class="e-ssub">Enter the address and we’ll find your home from satellite. Nothing to draw.</div></div>'
     +'<div class="e-asearch"><input type="text" class="e-asearch-input" id="e-addrIn" placeholder="Start typing a US address..." autocomplete="off" oninput="eHandleAddrInput(event)" onkeydown="eHandleAddrKey(event)">'
     +'<div class="e-suggestions" id="e-suggestions"></div></div>'
     +'<div id="hs-anchor"></div>'
     +'<div class="e-btnrow"><button class="e-btnback" type="button" id="hs-back">← Back</button>'
     +'<button class="e-btnmain" type="button" id="hs-cont" disabled>Continue →</button></div>';
    ap.parentNode.insertBefore(d, ap);
    $('hs-back').onclick=function(){ stop(); var s=$('rs-stage'); if(s) s.classList.remove('on'); d.style.display='none'; zp.style.display='block'; };
    $('hs-cont').onclick=function(){
      d.style.display='none'; ap.style.display='block';
      var s1=$('e-sld'); if(s1&&typeof eUpdateSlider==='function') try{ eUpdateSlider(+s1.value); }catch(e){}
      /* the house can fill in this trade's size: electrical's home size */
      if(st&&st.data&&PREFILL[TRADE]&&typeof eUpdateSlider==='function'){ var s2=$('e-sld'); if(s2) try{ eUpdateSlider(Math.max(+s2.min,Math.min(+s2.max,Math.round(PREFILL[TRADE](st.data,st.q||{})/50)*50))); }catch(e){} }
    };
    var _next=window.eZipNext;
    window.eZipNext=eZipNext=function(){
      var z=$('e-zippanel'); if(z) z.style.display='none'; d.style.display='block';
      var ts=$('e-tstep'); if(ts) ts.innerHTML='Step <b>1</b> — Address';
    };
    /* back from the size step returns to the address, not the ZIP */
    var _back=window.eZipBack;
    window.eZipBack=eZipBack=function(){ if(ap.style.display!=='none'){ ap.style.display='none'; d.style.display='block'; return; } return _back&&_back.apply(this,arguments); };
  }

  /* ── wire into the estimator, wrapping rather than rewriting ──────────────── */
  function wire(){
    if(typeof eSelectAddress!=='function'||typeof eSolarMeasure!=='function') return false;
    insertPanel();
    var _select=eSelectAddress;
    eSelectAddress=window.eSelectAddress=function(fullAddr){
      begin(fullAddr);
      var r; try{ r=_select.apply(this, arguments); }catch(e){}
      return r;
    };
    if(typeof eInitMap==='function'){ var _init=eInitMap; eInitMap=window.eInitMap=function(){ var r; try{ r=_init.apply(this, arguments); }catch(e){} return r; }; }
    eSolarMeasure=window.eSolarMeasure=function(lat, lon){
      rsMapLoad(lat, lon);
      if(window.RS_DEMO){ setTimeout(function(){ hsData(window.RS_DEMO); }, 1400); return; }
      fetch(E_SOLAR_URL,{ method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+E_SOLAR_ANON,'apikey':E_SOLAR_ANON}, body:JSON.stringify({lat:lat,lng:lon}) })
        .then(function(r){ return r.json(); })
        .then(function(d){ hsData(d&&d.found&&d.totalAreaSqft>0 ? d : null); })
        .catch(function(){ hsData(null); });
    };
    var sub=document.querySelector('#e-addrpanel .e-ssub');
    if(sub&&$('e-mapwrap')) sub.textContent='Enter the address and we’ll find your home from satellite. Nothing to draw.';
    if(typeof eRestart==='function'){ var _rs=eRestart; eRestart=window.eRestart=function(){ stop(); var s=$('rs-stage'); if(s) s.classList.remove('on'); var p=panel(); if(p) p.classList.remove('hs-mode','hs-done','hs-fallback'); return _rs.apply(this, arguments); }; }
    window.hsDebug={ get st(){ return st; } };
    return true;
  }
  if(!wire()){ document.addEventListener('DOMContentLoaded', wire); }
})();
</script>
