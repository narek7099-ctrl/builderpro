<!-- SITE THEME — the calculators as a phone app.

     Every estimator shares one set of class names (.e-shdr, .e-oi,
     .e-btnmain ...), so this one sheet restyles all twelve without touching
     a step, a question or a price. Injected by tools/inject-theme.py.

     The look: a white app bar with the step count and a thin progress line,
     a short bold question, big tappable answer cards with a round check,
     and Back / Continue pinned to the bottom of the screen on phones. The
     accent is the contractor's own colour when they set one (--bp-acc from
     the theme applier), else BuilderPro blue.

     It sits after every other stylesheet and carries !important on purpose:
     the older layers underneath do too. -->
<style id="bp-site-theme">

  --st-acc:var(--bp-acc,#2f6bff); --st-acc-l:var(--bp-acc-l,#eaf1ff); --st-acc-on:#fff;

}

<script id="bp-site-theme-ui">
/* Small app touches the stylesheet can't do alone: a "More" link when the
   question's explanation is cut to three lines, and the progress line held
   under the app bar whatever its height. */
(function(){ try{
  var root=function(){return document.getElementById('est-embed');};
  function more(){
    var r=root(); if(!r) return;
    /* one line per title on a phone: the desktop line break becomes a space;
       an eyebrow that only repeats the step count in the app bar goes */
    r.querySelectorAll('.e-stitle br').forEach(function(br){ br.parentNode.replaceChild(document.createTextNode(' '),br); });
    r.querySelectorAll('.e-seye').forEach(function(e){ if(!e.classList.contains('bp-dup')&&/^\s*step\s+\d/i.test(e.textContent)) e.classList.add('bp-dup'); });
    r.querySelectorAll('.e-sp.active .e-ssub, #e-zippanel .e-ssub').forEach(function(p){
      if(p._bpm) return; p._bpm=1;
      requestAnimationFrame(function(){ if(p.textContent.trim().length>2){ var b=document.createElement('button'); b.type='button'; b.className='bp-more'; b.textContent='Why we ask';
        b.onclick=function(){ var o=p.classList.toggle('bp-open'); b.textContent=o?'Hide':'Why we ask'; }; p.parentNode.insertBefore(b,p.nextSibling); } });
    });
    var bar=r.querySelector('.e-topbar'), h=bar?Math.round(bar.getBoundingClientRect().height)+'px':''; if(h&&r.style.getPropertyValue('--st-barh')!==h) r.style.setProperty('--st-barh',h);
  }
  var go=function(){ var r=root(); if(!r){ setTimeout(go,200); return; } more(); var t=0; new MutationObserver(function(){ if(!t) t=requestAnimationFrame(function(){ t=0; more(); }); }).observe(r,{subtree:true,attributes:true,attributeFilter:['class']}); window.addEventListener('resize',more); };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',go); else go();
}catch(e){} })();
</script>
<script id="bp-site-theme-fonts">
/* General Sans is the site's face and comes from Fontshare, as it does on the
   site; Geist from Google Fonts backs it up. Added once, only if missing. */
(function(){ try{
  [['st-gs','https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap'],
   ['st-geist','https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap']].forEach(function(f){
    if(document.getElementById(f[0])) return;
    var l=document.createElement('link'); l.id=f[0]; l.rel='stylesheet'; l.href=f[1];
    (document.head||document.documentElement).appendChild(l);
  });
}catch(e){} })();
</script>
<script id="bp-lead-relay">
/* Every lead this page sends to its HighLevel webhook also goes to BuilderPro
   (functions/v1/lead-in) with the contractor from the share link (?u=), so it
   lands in their Contacts and their own HighLevel. The original send is left
   exactly as it was. No ?u= (a demo on builderpro-os.com): nothing extra. */
(function(){ try{
  if(window.__bpLeadRelay||!window.fetch)return; window.__bpLeadRelay=1;
  var own=''; try{own=(new URLSearchParams(location.search).get('u')||'').replace(/[^0-9a-f-]/gi,'');}catch(e){}
  if(!/^[0-9a-f-]{36}$/i.test(own))return;
  var F=window.fetch;
  window.fetch=function(u,o){
    try{
      var s=typeof u==='string'?u:(u&&u.url)||'';
      if(/leadconnectorhq\.com\/hooks\/[^\/]+\/webhook-trigger\//i.test(s)&&o&&String(o.method||'').toUpperCase()==='POST'){
        var d; try{d=JSON.parse(o.body);}catch(e){d={};}
        F.call(window,'https://ttzwzouhiwdwamuimhpo.supabase.co/functions/v1/lead-in',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},
          body:JSON.stringify({owner:own,page:(location.pathname.split('/').pop()||''),lead:d})}).catch(function(){});
      }
    }catch(e){}
    return F.apply(this,arguments);
  };
}catch(e){} })();
</script>
