<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plumbing Estimator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#ffffff;--card:#ffffff;--border:#e3e8ef;--bs:#e3e8ef;
--text:#1b2a41;--txt:#1b2a41;--mu:#6b7a90;--muted:#6b7a90;
--a:#2563eb;--al:#60a5fa;--blue-l:#60a5fa;--cyan:#60a5fa;--ag:rgba(37,99,235,.12);
--green:#15803d;--red:#dc2626;}
html,body{margin:0;background:#f6f8fb;font-family:'Inter','Space Grotesk',system-ui,-apple-system,sans-serif;}
.est-stage{max-width:980px;margin:32px auto;padding:0 16px;}
#est-embed{border:1px solid #e3e8ef;border-radius:16px;overflow:hidden;box-shadow:0 10px 34px rgba(15,30,60,.09);}
#est-embed .leaflet-container{background:#e3e8ef !important;}

/* estimator (de-branded, light) */

/* ── Estimator scoped styles ── */
#est-embed {
  font-family: 'Inter','Space Grotesk',system-ui,-apple-system,sans-serif;
  background: #ffffff;
  color: #0c0c0d;
  width: 100%;
  position: relative;
}
#est-embed * { box-sizing: border-box; }

#est-embed {
  --a: #2f6bff;
  --al: #9cc8ee;
  --ag: rgba(47,107,255,0.18);
  --bg: #02040b;
  --card: rgba(47,107,255,0.55);
  --border: rgba(37,99,235,0.18);
  --bs: rgba(255, 255, 255, 0.07);
  --w: #ffffff;
  --txt: rgba(255, 255, 255, 0.75);
  --mu: rgba(255, 255, 255, 0.38);
  --green: #00d478;
  --red: #ff4444;
}

/* TOPBAR inside estimator */
#est-embed .e-topbar {
  padding: 14px 28px;
  border-bottom: 1px solid var(--bs);
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 3px 14px;
  background: #ffffff;
  backdrop-filter: blur(20px);
}
@media (max-width: 540px){
  #est-embed .e-topbar{padding:12px 16px;}
  #est-embed .e-tlogo{font-size:15px;letter-spacing:1.5px;}
  #est-embed .e-tstep{flex-basis:100%;}
}
#est-embed .e-tlogo { font-family: 'Space Grotesk','Inter',system-ui,sans-serif; font-size: 18px; letter-spacing: 3px; color: #fff; display: flex; align-items: center; gap: 8px; }
#est-embed .e-tlogo span { color: var(--al); }
#est-embed .e-ldot { width: 7px; height: 7px; border-radius: 50%; background: var(--a); box-shadow: 0 0 8px var(--a); }
#est-embed .e-tstep { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--mu); }
#est-embed .e-tstep b { color: var(--al); }

/* PROGRESS */
#est-embed .e-prog { height: 3px; background: var(--bs); }
#est-embed .e-pfill { height: 100%; background: linear-gradient(90deg, var(--a), var(--al)); transition: width .7s cubic-bezier(.16,1,.3,1); }

/* STEP PANELS */
#est-embed .e-app { position: relative; }
#est-embed .e-sp { display: none; }
#est-embed .e-sp.active { display: flex; flex-direction: column; animation: eSpIn .52s cubic-bezier(.22,1,.28,1) both; }
#est-embed .e-sp.back { animation: eSpBack .52s cubic-bezier(.22,1,.28,1) both; }
@keyframes eSpIn  { from { opacity:0; transform:translate3d(26px,8px,0) scale(.985) } to { opacity:1; transform:none } }
@keyframes eSpBack { from { opacity:0; transform:translate3d(-26px,8px,0) scale(.985) } to { opacity:1; transform:none } }

#est-embed .e-shdr { padding: 28px 32px 0; max-width: 860px; margin: 0 auto; width: 100%; }
#est-embed .e-sbody { padding: 16px 32px 36px; max-width: 860px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; flex: 1; }
@media (max-width: 640px) {
  #est-embed .e-shdr, #est-embed .e-sbody { padding-left: 16px; padding-right: 16px; }
  #est-embed .e-shdr { padding-top: 20px; }
}

#est-embed .e-seye { font-size: 10px; letter-spacing: 5px; text-transform: uppercase; color: var(--al); margin-bottom: 8px; display: block; }
#est-embed .e-stitle { font-family: 'Space Grotesk','Inter',system-ui,sans-serif; font-size: clamp(28px, 4vw, 46px); line-height: .93; letter-spacing: 1px; color: #fff; margin-bottom: 6px; }
#est-embed .e-stitle em { color: var(--a); font-style: normal; }
#est-embed .e-ssub { font-size: 14px; color: var(--mu); line-height: 1.6; margin-bottom: 18px; max-width: 540px; }

/* CARD */
#est-embed .e-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 22px; backdrop-filter: blur(12px); box-shadow: 0 12px 36px rgba(0,0,0,.26); margin-bottom: 12px; }

/* ADDRESS SEARCH */
#est-embed .e-asearch { position: relative; margin-bottom: 10px; }
#est-embed .e-asearch-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; z-index: 2; }
#est-embed .e-asearch-input {
  width: 100%;
  background: rgba(255,255,255,.06);
  border: 1px solid var(--bs);
  border-radius: 10px;
  padding: 13px 13px 13px 44px;
  font-family: 'Inter','Space Grotesk',system-ui,-apple-system,sans-serif; font-size: 15px; color: #fff;
  outline: none;
  transition: all .3s;
}
#est-embed .e-asearch-input::placeholder { color: var(--mu); }
#est-embed .e-asearch-input:focus { border-color: var(--a); background: rgba(47,107,255,0.09); box-shadow: 0 0 0 3px var(--ag); }

/* SUGGESTIONS */
#est-embed .e-suggestions {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: #08112a;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  z-index: 9999;
  display: none;
  max-height: 240px;
  overflow-y: auto;
  box-shadow: 0 14px 40px rgba(0,0,0,.6);
}
#est-embed .e-suggestions.open { display: block; }
#est-embed .e-suggestion {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--bs);
  transition: background .18s;
  font-size: 13px; color: var(--txt);
}
#est-embed .e-suggestion:last-child { border: none; }
#est-embed .e-suggestion:hover { background: rgba(47,107,255,0.14); color: #fff; }
#est-embed .e-suggestion-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
#est-embed .e-suggestion-main { font-weight: 600; color: #fff; }
#est-embed .e-suggestion-sub { font-size: 11px; color: var(--mu); margin-top: 2px; }
#est-embed .e-suggestion-loading { padding: 12px 14px; font-size: 12px; color: var(--mu); display: flex; align-items: center; gap: 8px; }
#est-embed .e-spin-sm { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--bs); border-top-color: var(--al); animation: eSpin .7s linear infinite; display: inline-block; }
@keyframes eSpin { to { transform: rotate(360deg); } }

/* MAP */
#est-embed .e-mapwrap { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 10px; display: none; }
#est-embed .e-maptb { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #f4f2ec; border-bottom: 1px solid var(--bs); flex-wrap: wrap; }
#est-embed .e-mtbtn {
  display: flex; align-items: center; gap: 4px;
  background: rgba(47,107,255,0.3); border: 1px solid rgba(37,99,235,0.18); border-radius: 6px;
  padding: 5px 10px;
  font-family: 'Inter','Space Grotesk',system-ui,-apple-system,sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  color: var(--al); cursor: pointer; transition: all .22s;
}
#est-embed .e-mtbtn:hover, #est-embed .e-mtbtn.on { background: rgba(47,107,255,0.32); border-color: var(--a); color: #fff; }
#est-embed .e-mtbtn.del { border-color: rgba(255,60,60,.25); color: var(--red); }
#est-embed .e-mtbtn.del:hover { background: rgba(255,60,60,.12); border-color: var(--red); }
#est-embed .e-mstat { margin-left: auto; font-size: 10px; color: var(--mu); letter-spacing: 1px; text-align: right; }
#est-embed #e-mapel { width: 100%; height: 400px; }
@media (max-width: 640px) { #est-embed #e-mapel { height: 280px; } }
#est-embed .e-mhint { padding: 8px 12px; background: rgba(47,107,255,0.2); font-size: 11px; color: #3a6286; border-top: 1px solid var(--bs); line-height: 1.5; }

/* MEASURED RESULT */
#est-embed .e-mresult {
  display: none; align-items: center; gap: 12px;
  padding: 12px 16px;
  background: rgba(47,107,255,0.12); border: 1px solid rgba(47,107,255,0.28); border-radius: 10px;
  margin-bottom: 10px;
}
#est-embed .e-mrn { font-family: 'Space Grotesk','Inter',system-ui,sans-serif; font-size: 32px; color: #fff; line-height: 1; }
#est-embed .e-mrl { font-size: 10px; color: var(--mu); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
#est-embed .e-mrbadge { color: var(--green); }
#est-embed .e-mrsq { font-size: 11px; color: var(--mu); margin-left: 6px; }
#est-embed .e-mredit { margin-left: auto; font-size: 11px; color: var(--al); cursor: pointer; text-decoration: underline; white-space: nowrap; }

/* MANUAL SLIDER */
#est-embed .e-manualbtn {
  background: transparent; border: 1px solid var(--bs); border-radius: 7px;
  padding: 7px 14px; font-size: 11px; color: var(--mu); cursor: pointer;
  transition: all .22s; font-family: 'Inter','Space Grotesk',system-ui,-apple-system,sans-serif; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  margin-bottom: 10px; display: block;
}
#est-embed .e-manualbtn:hover { border-color: var(--border); color: #fff; }
#est-embed .e-sldwrap { display: none; }
#est-embed .e-slddisp { display: flex; align-items: baseline; gap: 6px; margin-bottom: 12px; }
#est-embed .e-sldval { font-family: 'Space Grotesk','Inter',system-ui,sans-serif; font-size: 46px; color: #fff; line-height: 1; }
#est-embed .e-sldunit { font-size: 12px; color: var(--mu); letter-spacing: 2px; text-transform: uppercase; }
#est-embed input[type=range].e-sld { width: 100%; -webkit-appearance: none; height: 5px; background: var(--bs); border-radius: 3px; outline: none; cursor: pointer; }
#est-embed input[type=range].e-sld::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg,var(--a),var(--al)); border: 2px solid rgba(255,255,255,.2); box-shadow: 0 0 12px var(--ag); cursor: pointer; }
#est-embed .e-sldlbl { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: var(--mu); }

/* OPTION LIST */
#est-embed .e-olist { display: flex; flex-direction: column; gap: 8px; }
#est-embed .e-oi {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px;
  background: rgba(255,255,255,.03); border: 1px solid var(--bs); border-radius: 10px;
  cursor: pointer;
  transition: all .32s cubic-bezier(.16,1,.3,1);
  position: relative; overflow: hidden;
}
#est-embed .e-oi::before { content:''; position:absolute; inset:0; background:linear-gradient(90deg,rgba(47,107,255,0.07),transparent 60%); opacity:0; transition:opacity .3s; }
#est-embed .e-oi:hover { border-color: rgba(47,107,255,0.35); background: rgba(47,107,255,0.14); transform: translateX(3px); }
#est-embed .e-oi:hover::before { opacity: 1; }
#est-embed .e-oi.sel { border-color: var(--a); background: rgba(47,107,255,0.2); box-shadow: 0 0 0 1px var(--a), 0 0 18px var(--ag); transform: translateX(5px); }
#est-embed .e-oi.sel::before { opacity: 1; }
#est-embed .e-oi-em { font-size: 22px; flex-shrink: 0; width: 32px; text-align: center; }
#est-embed .e-oi-info { flex: 1; }
#est-embed .e-oi-lbl { font-family: 'Inter','Space Grotesk',system-ui,-apple-system,sans-serif; font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #fff; }
#est-embed .e-oi-desc { font-size: 11px; color: var(--mu); margin-top: 2px; line-height: 1.4; }
#est-embed .e-oi-tag { font-size: 10px; color: var(--al); font-family: 'Inter','Space Grotesk',system-ui,-apple-system,sans-serif; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0; }
#est-embed .e-oi-radio { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--bs); display: flex; align-items: center; justify-content: center; font-size: 9px; color: transparent; flex-shrink: 0; transition: all .28s; }
#est-embed .e-oi.sel .e-oi-radio { background: var(--a); border-color: var(--a); color: #fff; box-shadow: 0 0 8px var(--ag); }

/* REGION GRID */
#est-embed .e-regg { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-bottom: 8px; }
@media (max-width: 500px) { #est-embed .e-regg { grid-template-columns: 1fr 1fr; } }
#est-embed .e-rb { background: rgba(255,255,255,.04); border: 1px solid var(--bs); border-radius: 8px; padding: 9px 10px; cursor: pointer; transition: all .28s; text-align: center; }
#est-embed .e-rb:hover { border-color: rgba(47,107,255,0.3); background: rgba(47,107,255,0.12); }
#est-embed .e-rb.on { border-color: var(--a); background: rgba(47,107,255,0.18); box-shadow: 0 0 0 1px var(--a); }
#est-embed .e-rb-n { font-family: 'Inter','Space Grotesk',system-ui,-apple-system,sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #fff; }
#est-embed .e-rb-s { font-size: 9px; color: var(--mu); margin-top: 2px; }

/* FORM */
#est-embed .e-fr2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { #est-embed .e-fr2 { grid-template-columns: 1fr; } }
#est-embed .e-fg { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
#est-embed .e-fl { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--mu); }
#est-embed .e-fi {
  background: rgba(255,255,255,.05); border: 1px solid var(--bs); border-radius: 9px;
  padding: 11px 14px; font-family: 'Inter','Space Grotesk',system-ui,-apple-system,sans-serif; font-size: 14px; color: #fff;
  outline: none; transition: all .28s; width: 100%;
}
#est-embed .e-fi::placeholder { color: var(--mu); }
#est-embed .e-fi:focus { border-color: var(--a); background: rgba(47,107,255,0.09); box-shadow: 0 0 0 3px var(--ag); }
#est-embed .e-consent { font-size: 11px; color: var(--mu); line-height: 1.65; padding: 10px 12px; background: rgba(255,255,255,.03); border: 1px solid var(--bs); border-radius: 7px; margin-bottom: 16px; }

/* BUTTONS */
#est-embed .e-btnrow { display: flex; gap: 10px; margin-top: auto; padding-top: 14px; }
#est-embed .e-btnmain {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 15px 24px;
  background: linear-gradient(90deg, #6aa6dd, #8fc1ea);
  border: none; border-radius: 10px;
  font-family: 'Inter','Space Grotesk',system-ui,-apple-system,sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: #fff; cursor: pointer;
  transition: all .4s cubic-bezier(.16,1,.3,1);
  box-shadow: 0 0 20px rgba(37,99,235,0.18);
  position: relative; overflow: hidden;
}
#est-embed .e-btnmain::before { content:''; position:absolute; inset:0; background:linear-gradient(rgba(255,255,255,.08),transparent); pointer-events:none; }
#est-embed .e-btnmain:hover { box-shadow: 0 0 44px rgba(47,107,255,0.45), 0 7px 20px rgba(0,0,0,.3); transform: translateY(-2px); }
#est-embed .e-btnmain:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }
#est-embed .e-btnback {
  display: flex; align-items: center; gap: 5px;
  background: transparent; border: 1px solid var(--bs); border-radius: 9px;
  padding: 12px 16px;
  font-family: 'Inter','Space Grotesk',system-ui,-apple-system,sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: var(--mu); cursor: pointer; transition: all .28s; flex-shrink: 0;
}
#est-embed .e-btnback:hover { border-color: var(--border); color: #fff; }

/* STEP DOTS */
#est-embed .e-stepdots { display: flex; justify-content: center; gap: 5px; padding: 14px 0 0; }
#est-embed .e-sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--bs); transition: all .4s cubic-bezier(.16,1,.3,1); }
#est-embed .e-sdot.done { background: var(--green); }
#est-embed .e-sdot.act { background: var(--a); width: 18px; border-radius: 3px; box-shadow: 0 0 8px var(--ag); }

/* LOADING */
#est-embed .e-ldpanel { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 70px 32px; gap: 24px; }
#est-embed .e-ldring { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--bs); border-top-color: var(--a); animation: eSpin .85s linear infinite; }
#est-embed .e-ldsteps { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; }
#est-embed .e-ldstp { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: rgba(47,107,255,0.12); border: 1px solid var(--bs); border-radius: 8px; font-size: 12px; color: var(--mu); transition: all .42s; }
#est-embed .e-ldstp.act { color: #fff; border-color: var(--border); background: rgba(37,99,235,0.18); }
#est-embed .e-ldstp.done { color: var(--green); border-color: rgba(47,107,255,0.2); background: rgba(47,107,255,0.07); }
#est-embed .e-lddot { width: 6px; height: 6px; border-radius: 50%; background: var(--bs); flex-shrink: 0; transition: background .4s; }
#est-embed .e-ldstp.act .e-lddot { background: var(--al); animation: eBlk 1.1s ease-in-out infinite; }
#est-embed .e-ldstp.done .e-lddot { background: var(--green); }
@keyframes eBlk { 0%,100%{opacity:1} 50%{opacity:.25} }

/* RESULT */
#est-embed .e-rpage { max-width: 860px; margin: 0 auto; padding: 28px 32px; width: 100%; }
@media (max-width: 640px) { #est-embed .e-rpage { padding: 16px; } }
#est-embed .e-rhero { text-align: center; padding: 28px 24px; background: linear-gradient(135deg, rgba(47,107,255,0.55), #f4f2ec); border: 1px solid rgba(47,107,255,0.3); border-radius: 18px; margin-bottom: 14px; box-shadow: 0 0 50px rgba(47,107,255,0.1); }
#est-embed .e-rbadge { display: inline-flex; align-items: center; gap: 5px; background: rgba(47,107,255,0.1); border: 1px solid rgba(47,107,255,0.25); border-radius: 18px; padding: 4px 12px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--green); margin-bottom: 12px; }
#est-embed .e-rlbl { font-size: 10px; color: var(--mu); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 5px; }
#est-embed .e-rrange { font-family: 'Space Grotesk','Inter',system-ui,sans-serif; font-size: clamp(30px,5vw,54px); color: #fff; line-height: 1; letter-spacing: 2px; margin-bottom: 7px; }
#est-embed .e-rrange em { color: var(--a); font-style: normal; }
#est-embed .e-rnote { font-size: 12px; color: var(--mu); line-height: 1.6; }
#est-embed .e-rgrid { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin-bottom: 14px; }
@media (max-width: 500px) { #est-embed .e-rgrid { grid-template-columns: 1fr 1fr; } }
#est-embed .e-rbox { background: rgba(47,107,255,0.28); border: 1px solid var(--border); border-radius: 10px; padding: 12px 9px; text-align: center; animation: eRbIn .5s cubic-bezier(.16,1,.3,1) both; }
#est-embed .e-rbox:nth-child(1){animation-delay:.04s} #est-embed .e-rbox:nth-child(2){animation-delay:.09s} #est-embed .e-rbox:nth-child(3){animation-delay:.14s} #est-embed .e-rbox:nth-child(4){animation-delay:.19s} #est-embed .e-rbox:nth-child(5){animation-delay:.24s} #est-embed .e-rbox:nth-child(6){animation-delay:.29s}
@keyframes eRbIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
#est-embed .e-rbv { font-family: 'Space Grotesk','Inter',system-ui,sans-serif; font-size: 19px; color: #fff; line-height: 1; margin-bottom: 3px; }
#est-embed .e-rbl { font-size: 8px; color: var(--mu); letter-spacing: 1.5px; text-transform: uppercase; }
#est-embed .e-disc { font-size: 11px; color: var(--mu); line-height: 1.75; padding: 12px 14px; background: rgba(255,255,255,.03); border: 1px solid var(--bs); border-radius: 9px; margin-bottom: 16px; }
#est-embed .e-rcta { display: flex; flex-direction: column; align-items: center; gap: 9px; }
#est-embed .e-rcta .e-btnmain { max-width: 400px; }
#est-embed .e-rctasub { font-size: 11px; color: var(--mu); }
#est-embed .e-restart { background: transparent; border: none; font-size: 12px; color: var(--mu); cursor: pointer; text-decoration: underline; transition: color .2s; margin-top: 3px; }
#est-embed .e-restart:hover { color: #fff; }

/* Leaflet dark theme override scoped to estimator */
#est-embed .leaflet-container { background: #e9e8e3 !important; }

/* map toolbar buttons: readable dark styling */

/* ===== clean, trustworthy redesign ===== */
#est-embed .e-oi-em{display:none !important;}

#est-embed .e-ssub{color:#6a6a70 !important;font-size:14px !important;font-weight:400 !important;}

#est-embed .e-oi.sel{border-color:#2f6bff !important;background:#f6f8fb !important;box-shadow:0 0 0 1px #2f6bff !important;transform:none !important;}
#est-embed .e-oi-lbl{font-family:'Inter','Space Grotesk',system-ui,-apple-system,sans-serif !important;font-weight:600 !important;text-transform:none !important;letter-spacing:0 !important;font-size:15px !important;color:#0c0c0d !important;}
#est-embed .e-oi-desc{color:#6a6a70 !important;font-size:12px !important;}
#est-embed .e-oi-tag{font-family:'Inter','Space Grotesk',system-ui,-apple-system,sans-serif !important;font-weight:600 !important;letter-spacing:0 !important;text-transform:none !important;color:#2f6bff !important;}
#est-embed .e-btnmain{font-family:'Inter','Space Grotesk',system-ui,-apple-system,sans-serif !important;font-weight:600 !important;letter-spacing:0 !important;text-transform:none !important;box-shadow:none !important;background:#2f6bff !important;border-radius:10px !important;}
#est-embed .e-btnmain::before{display:none !important;}
#est-embed .e-btnmain:hover{box-shadow:0 4px 14px rgba(47,107,255,.25) !important;transform:none !important;}
#est-embed .e-btnback{font-family:'Inter','Space Grotesk',system-ui,-apple-system,sans-serif !important;font-weight:500 !important;letter-spacing:0 !important;text-transform:none !important;}
#est-embed .e-tstep{text-transform:none !important;letter-spacing:0 !important;}
#est-embed .e-mhint{font-weight:400 !important;} #est-embed .e-mhint strong{font-weight:600 !important;}

#est-embed .e-zipinput{width:150px;padding:11px 14px;border:1px solid #e9e8e3;border-radius:8px;font-size:15px;color:#0c0c0d;outline:none;background:#fff;font-family:'Inter','Space Grotesk',system-ui,-apple-system,sans-serif;}
#est-embed .e-zipinput:focus{border-color:#2f6bff;box-shadow:0 0 0 3px rgba(47,107,255,.12);}
#est-embed .e-ziphint{font-size:12px;color:#9a9aa0;margin-top:6px;}
/* result slide: darken faint text to black (user request) */
#est-embed .e-rlbl,#est-embed .e-rbl,#est-embed .e-rnote,#est-embed .e-rctasub,#est-embed .e-disc{color:#1f2937 !important;}
#est-embed .e-rrange,#est-embed .e-rbv{color:#0c0c0d !important;}
#est-embed .e-rrange em{color:#2f6bff !important;}
#est-embed .e-restart{color:#2f6bff !important;}

/* ============================================================
   POLISH LAYER — cleaner, more premium light UI (appended so it
   wins on the cascade). Safe visual-only tweaks.
   ============================================================ */
#est-embed{--pri:#2f6bff;--pri-d:#1b56ee;--ink:#0c0c0d;--ink-2:#6a6a70;--line:#e9e8e3;--soft:#fbfaf7;}
#est-embed .e-num{font-family:'Inter','Space Grotesk',system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;}

/* Shell: softer, more premium frame */
#est-embed{border-radius:0 !important;}
.est-stage{max-width:920px;}
#est-embed>.e-app,#est-embed{background:#ffffff !important;}

/* Big numbers were calling an unloaded font (Bebas Neue) → fell back ugly.
   Give them a clean, tight numeric stack. */
#est-embed .e-rrange,#est-embed .e-rbv,#est-embed .e-mrn,#est-embed .e-sldval{
  font-family:'Inter','Space Grotesk',system-ui,-apple-system,sans-serif !important;
  font-variant-numeric:tabular-nums;font-weight:700 !important;letter-spacing:-.5px !important;}

/* Top bar: crisper */
#est-embed .e-topbar{padding:16px 26px !important;}
#est-embed .e-ldot{background:var(--pri) !important;box-shadow:0 0 0 4px rgba(47,107,255,.14) !important;}
#est-embed .e-tlogo{font-family:'Inter','Space Grotesk',system-ui,-apple-system,sans-serif !important;font-weight:700 !important;letter-spacing:.2px !important;font-size:16px !important;}
#est-embed .e-tlogo span{color:var(--pri) !important;}

/* Progress bar a touch bolder */
#est-embed .e-prog{height:4px !important;background:#f6f8fb !important;}
#est-embed .e-pfill{background:linear-gradient(90deg,var(--pri),#5a9bd8) !important;}

/* Option cards: lift on hover, cleaner selected state */
#est-embed .e-oi{padding:15px 18px !important;transition:border-color .2s,box-shadow .2s,background .2s !important;}
#est-embed .e-oi:hover{border-color:#bcd4ea !important;box-shadow:0 4px 14px rgba(15,27,45,.06) !important;}
#est-embed .e-oi.sel{box-shadow:0 0 0 1.5px var(--pri),0 6px 18px rgba(47,107,255,.14) !important;}
#est-embed .e-oi-radio{border:1.5px solid #cfdae7 !important;}

/* Primary button: gradient + confident hover */
#est-embed .e-btnmain{background:linear-gradient(180deg,#3a7cc0,var(--pri)) !important;padding:15px 24px !important;font-size:15px !important;box-shadow:0 2px 8px rgba(47,107,255,.28) !important;}
#est-embed .e-btnmain:hover{background:linear-gradient(180deg,#3f83c9,var(--pri-d)) !important;box-shadow:0 6px 20px rgba(47,107,255,.34) !important;transform:translateY(-1px) !important;}
#est-embed .e-btnmain:disabled{background:#f6f8fb !important;color:#9a9aa0 !important;box-shadow:none !important;transform:none !important;}

/* Cards: softer surface + shadow */
#est-embed .e-card{background:#ffffff !important;border:1px solid var(--line) !important;border-radius:14px !important;box-shadow:0 2px 10px rgba(15,27,45,.04) !important;backdrop-filter:none !important;}

/* Measured-result banner: clean success card */
#est-embed .e-mresult{background:#f0f7ef !important;border:1px solid #cfe6cd !important;border-radius:12px !important;padding:14px 16px !important;}
#est-embed .e-mrbadge{color:#1a8a4a !important;font-weight:600 !important;}

/* ---- RESULT SLIDE: the money shot ---- */
#est-embed .e-rhero{
  background:linear-gradient(160deg,#f4f9ff 0%,#eaf3fc 100%) !important;
  border:1px solid #d5e6f6 !important;border-radius:20px !important;
  box-shadow:0 10px 40px rgba(47,107,255,.10) !important;padding:34px 26px !important;}
#est-embed .e-rbadge{background:#e6f5ec !important;border:1px solid #bfe4c9 !important;color:#1a8a4a !important;font-weight:600 !important;}
#est-embed .e-rrange{font-size:clamp(34px,5.5vw,58px) !important;letter-spacing:-1px !important;}
#est-embed .e-rrange em{color:var(--pri) !important;}
#est-embed .e-rgrid{gap:10px !important;}
#est-embed .e-rbox{
  background:#ffffff !important;border:1px solid var(--line) !important;border-radius:12px !important;
  padding:14px 10px !important;box-shadow:0 1px 4px rgba(15,27,45,.04) !important;}
#est-embed .e-rbv{font-size:18px !important;color:var(--ink) !important;}
#est-embed .e-rbl{color:#8592a5 !important;letter-spacing:1px !important;}
#est-embed .e-disc{background:var(--soft) !important;border:1px solid var(--line) !important;border-radius:12px !important;}

/* Step dots: friendlier */
#est-embed .e-sdot.act{background:var(--pri) !important;}
#est-embed .e-sdot.done{background:#1a8a4a !important;}

/* Loading ring on brand color */
#est-embed .e-ldring{border-top-color:var(--pri) !important;}
#est-embed .e-ldstp.done{color:#1a8a4a !important;}
/* size picker + presets */
#est-embed .e-poolsize{background:linear-gradient(160deg,#f2f8ff,#e7f1fb) !important;border:1px solid #bcd7f0 !important;box-shadow:0 4px 16px rgba(47,107,255,.12) !important;}
#est-embed .e-sldval{color:#2f6bff !important;}
#est-embed .e-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
#est-embed .e-preset{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border:1px solid #bcd7f0;border-radius:10px;background:#fff;color:#0c0c0d;font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;cursor:pointer;transition:all .18s;text-align:center;}
#est-embed .e-preset span{font-size:10px;font-weight:400;color:#9a9aa0;}
#est-embed .e-preset:hover{border-color:#2f6bff;background:#f2f8ff;}
#est-embed .e-preset.on{border-color:#2f6bff;background:#2f6bff;color:#fff;box-shadow:0 0 0 1px #2f6bff;}
#est-embed .e-preset.on span{color:rgba(255,255,255,.85);}
/* ---- AI VISUALIZER (photo left, options right) ---- */
#est-embed .e-viz{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-bottom:14px;}
@media (max-width:720px){ #est-embed .e-viz{grid-template-columns:1fr;} }
#est-embed .e-vizphoto{position:sticky;top:12px;}
#est-embed .e-vizsplit{display:flex;gap:18px;align-items:flex-start;}
#est-embed .e-vizsplit>.e-vizcol{flex:1;min-width:0;}
#est-embed .e-vizsplit>.e-vizphoto{width:320px;flex:none;}
@media(max-width:720px){#est-embed .e-vizsplit{flex-direction:column;}#est-embed .e-vizsplit>.e-vizphoto{width:100%;}}
#est-embed .e-vizupload{border:2px dashed #bcd4ea;border-radius:14px;background:#f7fbff;padding:34px 18px;text-align:center;cursor:pointer;transition:all .18s;}
#est-embed .e-vizupload:hover{border-color:#2f6bff;background:#eef6ff;}
#est-embed .e-vizstage{position:relative;border-radius:14px;overflow:hidden;border:1px solid #e9e8e3;background:#0c0c0d;min-height:200px;display:flex;align-items:center;justify-content:center;}
#est-embed .e-vizimg{width:100%;display:block;}
#est-embed .e-vizstage{position:relative;}
#est-embed .e-vizloading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:rgba(247,250,253,.78);backdrop-filter:blur(2px);border-radius:12px;text-align:center;padding:16px;}
#est-embed .e-vizspin{width:34px;height:34px;border-radius:50%;border:3px solid #cfe0f2;border-top-color:#2f6bff;animation:e-vizspin .9s linear infinite;}
@keyframes e-vizspin{to{transform:rotate(360deg);}}
#est-embed .e-vizloading b{font-size:14px;color:#0c0c0d;}
#est-embed .e-vizloading span{font-size:11.5px;color:#6a6a70;max-width:230px;line-height:1.4;}
#est-embed .e-vizbadge{position:absolute;top:10px;left:10px;background:rgba(47,107,255,.92);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;}
#est-embed .e-vizbar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
#est-embed .e-vizbtn{flex:1;min-width:90px;padding:8px 10px;border:1px solid #e0ded6;border-radius:8px;background:#fff;color:#0c0c0d;font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;cursor:pointer;transition:all .15s;}
#est-embed .e-vizbtn.on{background:#2f6bff;border-color:#2f6bff;color:#fff;}
#est-embed .e-vizbtn.ghost{flex:0 0 auto;color:#6a6a70;}
#est-embed .e-vizbtn.ghost:hover{border-color:#2f6bff;color:#2f6bff;}
#est-embed .e-vizhint{font-size:11px;color:#9a9aa0;margin-top:8px;line-height:1.5;text-align:center;}
#est-embed .e-vizcv{width:100%;display:block;border-radius:14px;cursor:crosshair;background:#0c0c0d;touch-action:none;}
#est-embed .e-vizimg{width:100%;display:block;border-radius:14px;background:#f6f8fb;}
#est-embed .e-vizhelp{margin-top:8px;font-size:12px;font-weight:600;color:#2f6bff;text-align:center;background:#eef6ff;border:1px solid #d5e6f6;border-radius:8px;padding:8px 10px;}
#est-embed .e-vizprevlbl{font-size:11px;color:#9a9aa0;text-align:center;margin-top:8px;}
#est-embed .e-vizgen{width:100%;margin-top:10px;padding:13px 16px;border:none;border-radius:10px;background:linear-gradient(180deg,#3a7cc0,#2f6bff);color:#fff;font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(47,107,255,.28);transition:all .18s;}
#est-embed .e-vizgen:hover{background:linear-gradient(180deg,#3f83c9,#1b56ee);box-shadow:0 6px 20px rgba(47,107,255,.34);transform:translateY(-1px);}
/* Material / add-on swatch thumbnails */
#est-embed .e-oi-sw{width:48px;height:48px;border-radius:9px;object-fit:cover;flex-shrink:0;border:1px solid #e9e8e3;box-shadow:0 1px 3px rgba(15,27,45,.08);}
#est-embed .e-oi-emchip{width:48px;height:48px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(180deg,#f6faff,#e9f1fb);border:1px solid #dbe6f2;box-shadow:0 1px 3px rgba(15,27,45,.06),inset 0 1px 0 #fff;}
#est-embed .e-oi{gap:12px !important;}
#est-embed .e-vizgen:disabled{background:#f0efe9;color:#9a9aa0;cursor:not-allowed;box-shadow:none;transform:none;}
/* color chips */
#est-embed .e-colorrow{display:flex;flex-wrap:wrap;gap:8px;}
#est-embed .e-colorchip{display:flex;align-items:center;gap:7px;padding:7px 12px 7px 8px;border:1px solid #e9e8e3;border-radius:20px;background:#fff;color:#0c0c0d;font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;cursor:pointer;transition:all .15s;}
#est-embed .e-colordot{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.12);flex-shrink:0;}
#est-embed .e-colorchip:hover{border-color:#2f6bff;}
#est-embed .e-colorchip.on{border-color:#2f6bff;background:#faf8f4;box-shadow:0 0 0 1px #2f6bff;}
#est-embed .e-colornone{background:#f0f2f5 !important;color:#9a9aa0;display:flex;align-items:center;justify-content:center;font-size:11px;}
/* measuring help */
#est-embed .e-helpbtn{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;padding:9px 14px;border:1px solid #bcd7f0;border-radius:9px;background:#f2f8ff;color:#2f6bff;font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;cursor:pointer;transition:all .15s;}
#est-embed .e-helpbtn:hover{background:#e6f0fb;border-color:#2f6bff;}
#est-embed .e-modal{position:fixed;inset:0;background:rgba(15,27,45,.5);display:flex;align-items:center;justify-content:center;z-index:10000;padding:16px;}
#est-embed .e-modalbox{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
#est-embed .e-modalhd{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #f4f2ec;font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0c0c0d;position:sticky;top:0;background:#fff;}
#est-embed .e-modalx{border:none;background:#f2f6fb;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;color:#6a6a70;}
#est-embed .e-modalbody{padding:18px 20px;color:#6a6a70;font-size:14px;line-height:1.6;}
#est-embed .e-modalbody ol{padding-left:20px;margin:12px 0;} #est-embed .e-modalbody li{margin-bottom:9px;}
#est-embed .e-modalnote{background:#f2f8ff;border:1px solid #d5e6f6;border-radius:10px;padding:12px 14px;margin:12px 0;font-size:13px;color:#1b56ee;}
#est-embed .e-vizsens{margin-top:8px;font-size:12px;color:#6a6a70;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;}
#est-embed .e-vizbtn.sm{flex:0 0 auto;min-width:0;padding:5px 10px;font-size:11px;}

/* ---- YOUR INFO slide: form fields were near-transparent white on a
   white card, so they vanished. Give them real surfaces. ---- */
#est-embed .e-fi{
  background:#ffffff !important;border:1px solid #e9e8e3 !important;border-radius:9px !important;
  color:var(--ink) !important;}
#est-embed .e-fi::placeholder{color:#9a9aa0 !important;}
#est-embed .e-fi:focus{border-color:var(--pri) !important;background:#ffffff !important;box-shadow:0 0 0 3px rgba(47,107,255,.12) !important;}
#est-embed .e-fl{color:#6a6a70 !important;font-weight:600 !important;letter-spacing:1.5px !important;}
#est-embed .e-consent{background:var(--soft) !important;border:1px solid var(--line) !important;color:#6a6a70 !important;border-radius:9px !important;}
#est-embed .e-consent b{color:var(--ink) !important;}
</style><style>
/* No AI visualiser on this trade: a repipe happens inside the walls, so there
   is nothing to render a picture of. The column is hidden rather than left
   sitting there inviting a photo nothing will be done with. */
#est-embed .e-vizphoto,#est-embed .e-vizsplit>.e-vizphoto{display:none !important;}
#est-embed .e-vizsplit{display:block !important;}
</style>

<script>
/* ═══════════════════════════════════════════════════
   ESTIMATOR CONFIG
═══════════════════════════════════════════════════ */
const E_CONFIG = {
  companyName: "Your Company",
  accentColor: "#2f6bff",

    case 'butcher': grad('#c68d54','#a86c34'); for(var i=0;i<120;i+=6){ c.strokeStyle='rgba(120,80,40,'+(0.15+Math.random()*0.18)+')'; c.lineWidth=1+Math.random(); c.beginPath();c.moveTo(0,i);c.bezierCurveTo(40,i-2,80,i+2,120,i);c.stroke(); } break;

    case 'quartz': grad('#f7f6f3','#eeece8'); speck(90,['#e7e6e2','#dedcd7'],0.7,0.5); vein('rgba(200,200,200,0.4)',1,1); break;

  eCur=n;
  var _dn=Math.min(n,9); var pct=Math.round((_dn/9)*100);
  document.getElementById('e-pfill').style.width=pct+'%';
  var names=['','Bathrooms','The Job','Add-Ons','Home Age','Urgency','Right Now','Stories','Pipe Access','Your Info','Calculating',''];
  document.getElementById('e-tstep').innerHTML=n<=E_TOTAL?'Step <b>'+_dn+'</b> of 9 — '+(names[n]||''):'<b>✓ Estimate Complete</b>';
  // Only scroll if the top of the estimator is above the viewport

/* SUBMIT + RESULT */
function eCalcPrice(){
  var p=E_CONFIG.pricing[eS.material]||E_CONFIG.pricing['water-heater'];
  var qm=E_CONFIG.qualityMult[eS.quality]||1.00;   /* home age   */
  var tm=E_CONFIG.terrainMult[eS.terrain]||1.00;   /* stories    */
  var am=E_CONFIG.accessMult[eS.access]||1.00;     /* where pipe runs */
  var prm=E_CONFIG.projectMult[eS.project]||1.00;  /* urgency    */
  var rm=parseFloat(E_CONFIG.regionMult[eS.region]||1.00);
  var baths=Math.max(1, eS.sqft||1);               /* the slider counts bathrooms */

  /* Fixed base plus a per-bathroom amount. A water heater costs the same in a
     one-bath cottage and a four-bath house, so its per-bathroom figure is
     zero and only the base applies; a repipe is almost entirely per-bathroom.
     One shape covers both, which a flat rate per anything cannot. */
  var lowRaw  = (p.baseLow  + baths*p.perLow ) * qm*tm*am*prm*rm;
  var highRaw = (p.baseHigh + baths*p.perHigh) * qm*tm*am*prm*rm;
  var add=eAddonTotals();

  /* Rounded to $50 so it reads as an estimate rather than a quote. Add-ons
     are flat trade prices and are NOT multiplied — a permit fee does not get
     more expensive because the house is old. */
  var low =Math.round(lowRaw /50)*50 + add.low;
  var high=Math.round(highRaw/50)*50 + add.high;
  return {low:low, high:high, mid:Math.round((low+high)/2), area:baths,
          lowPer:Math.round(lowRaw/baths), highPer:Math.round(highRaw/baths), addons:add};
}
function eDoSubmit() {
  var _est = eCalcPrice();
  if(E_CONFIG.webhookUrl){ fetch(E_CONFIG.webhookUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({firstName:document.getElementById('e-fn').value,lastName:document.getElementById('e-ln').value,phone:document.getElementById('e-ph').value,email:document.getElementById('e-em').value,notes:document.getElementById('e-nt').value,address:eS.addr,counterSqft:eS.sqft,jobType:eS.material,edge:eS.quality,removal:eS.terrain,complexity:eS.access,project:eS.project,addons:Object.keys(eS.addons||{}).join(', '),region:eS.region,urgency:eS.urgency,estimateLow:_est.low,estimateHigh:_est.high,estimateValue:_est.mid,source:E_CONFIG.companyName+' Plumbing Estimator',timestamp:new Date().toISOString()})}).catch(function(){}); }
  eGo(10);
  var ids=['e-ld1','e-ld2','e-ld3','e-ld4','e-ld5'], li=0;
  function eNextStep(){ if(li>=ids.length){ setTimeout(eShowResult,500); return; } document.getElementById(ids[li]).classList.remove('act'); document.getElementById(ids[li]).classList.add('done'); li++; if(li<ids.length) document.getElementById(ids[li]).classList.add('act'); setTimeout(eNextStep,680); }
  setTimeout(eNextStep,680);
}
function eTitle(s){ s=(s||'').replace(/-/g,' '); return s.charAt(0).toUpperCase()+s.slice(1); }
function eShowResult() {
  var p=E_CONFIG.pricing[eS.material]||E_CONFIG.pricing['vinyl-lvp'];
  var est=eCalcPrice();
  document.getElementById('e-rrange').innerHTML='$'+est.low.toLocaleString()+' — <em>$'+est.high.toLocaleString()+'</em>';
  document.getElementById('e-rnote').textContent=est.area.toLocaleString()+' sq ft · '+p.label+' · '+eTitle(eS.quality)+' · '+eTitle(eS.terrain)+' removal · '+eTitle(eS.project)+(est.addons&&est.addons.count?' · '+est.addons.count+' add-on'+(est.addons.count>1?'s':''):'')+' · '+eS.regionLabel+(eS.usedMap?' · Instant estimate':' · Instant estimate');
  document.getElementById('e-rv1').textContent=est.area+(est.area===1?' bathroom':' bathrooms');
  document.getElementById('e-rv2').textContent=p.label;
  document.getElementById('e-rv3').textContent=eTitle(eS.quality)||'—';
  document.getElementById('e-rv4').textContent=eTitle(eS.terrain)||'—';
  document.getElementById('e-rv5').textContent=eS.regionLabel||'National Average';
  /* the access answer swings the labour more than anything else here, so it
     earns the last box rather than a per-unit rate that means little when
     most of these jobs are priced as a whole */
  document.getElementById('e-rv6').textContent=eTitle(eS.access)||'\u2014';
  document.getElementById('e-sp10').classList.remove('active');
  document.getElementById('e-spR').classList.add('active');
  document.getElementById('e-pfill').style.width='100%';
  document.getElementById('e-tstep').innerHTML='<b>✓ Estimate Complete</b>';
  var embed=document.getElementById('est-embed-shell');
  if(embed){ var rect=embed.getBoundingClientRect(); if(rect.top<0) embed.scrollIntoView({behavior:'smooth',block:'start'}); }
}
