<style>
:root{--bg:#edf2f6;--card:#fff;--line:#dce3ec;--line2:#cfd8e3;--ink:#001530;--mut:#788493;--dim:#9aa3b1;--blue:#006fff;--blue-d:#003db8;--blue-l:#e6f0ff;--pill:#0b1021;--ok:#1faa5a;--bad:#e0574e;
  --sans:'General Sans','Geist',system-ui,sans-serif;--ease:cubic-bezier(.39,.575,.565,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.top{display:flex;align-items:center;gap:10px;height:68px;padding:0 24px;max-width:1100px;margin:0 auto}

.top a.logo b{color:var(--blue);font-weight:600}
.top .have{margin-left:auto;font-size:14px;color:var(--mut)}
.wrap{max-width:760px;margin:0 auto;padding:8px 20px 60px}
.prog{display:flex;gap:6px;margin:6px 0 22px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--line);transition:background .4s var(--ease)}
.prog i.on{background:var(--blue)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;animation:in .45s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.sub{color:var(--mut);margin:6px 0 24px;max-width:56ch}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plan{border:1.5px solid var(--line);border-radius:16px;padding:18px;text-align:left;background:#fff;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s var(--ease);display:flex;flex-direction:column;gap:6px}
.plan:hover{border-color:var(--line2);transform:translateY(-2px)}
.plan.on{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,111,255,.12)}
.plan .tag{font-size:12px;color:var(--mut);font-weight:500}
.plan .nm{font-size:18px;font-weight:600;letter-spacing:-.02em}
.plan .pr{font-size:30px;font-weight:600;letter-spacing:-.03em;margin:4px 0}
.plan .pr small{font-size:14px;color:var(--mut);font-weight:500;letter-spacing:0}
.plan ul{list-style:none;font-size:13.5px;color:#34435a;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.plan li{position:relative;padding-left:16px;line-height:1.4}.plan li:before{content:"";position:absolute;left:0;top:.5em;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.plan.pop{background:linear-gradient(180deg,#f3f8ff,#fff)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.grid .full{grid-column:1/-1}
.f label{display:block;font-size:13.5px;font-weight:500;margin-bottom:6px}
.f .h{font-size:12.5px;color:var(--mut);margin-top:5px}
.f input,.f select,.f textarea{width:100%;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:11px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
.f textarea{min-height:92px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,111,255,.12)}
.f input::placeholder,.f textarea::placeholder{color:var(--dim)}
.f.err input,.f.err select,.f.err textarea{border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;transition:.15s}
.chips button:hover{border-color:var(--blue);color:var(--blue)}
.chips button.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue-d)}
.hrs{display:grid;gap:6px}
.hr{display:grid;grid-template-columns:120px 90px 1fr 1fr;gap:10px;align-items:center;font-size:14px}
.hr input[type=time]{padding:8px 10px}
.hr label.sw{display:flex;align-items:center;gap:6px;font-weight:500;margin:0}
.hr.off input[type=time]{opacity:.35}
.nav{display:flex;align-items:center;gap:10px;margin-top:28px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:500;cursor:pointer;transition:background .2s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--blue);color:#fff;margin-left:auto}
.btn.pri:hover{background:var(--blue-d)}
.btn.ghost{background:none;color:var(--mut);padding-left:4px}
.btn:disabled{opacity:.55;cursor:default}
.msg{color:var(--bad);font-size:14px;margin-top:14px;min-height:1.2em}
.rev{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:14px}
.rev dt{color:var(--mut)}
.rev dd{white-space:pre-wrap}
.note{background:var(--blue-l);color:var(--blue-d);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:18px}
.steps{list-style:none;display:flex;flex-direction:column;gap:10px;margin:18px 0}
.steps li{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--mut)}
.steps li i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;position:relative}
.steps li.done{color:var(--ink)}
.steps li.done i{background:var(--ok);border-color:var(--ok)}
.steps li.done i:after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.steps li.run i{border-color:var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
@media(max-width:720px){.plans,.grid{grid-template-columns:1fr}.panel{padding:22px}.hr{grid-template-columns:1fr 80px;}.hr input[type=time]{grid-column:span 1}h1{font-size:25px}.rev{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.addons{display:grid;gap:10px}.addon{display:flex;gap:12px;align-items:flex-start;border:1px solid #dbe3ec;border-radius:14px;padding:14px 16px;cursor:pointer;background:#fff}
.addon input{margin-top:3px;width:18px;height:18px;accent-color:#006fff}.addon b{color:#001530}.addon em{font-style:normal;color:#006fff;font-weight:500;margin-left:6px}.addon small{display:block;color:#5b6b7f;margin-top:3px;font-size:13px}
.addon.inc{background:#f3f8ff;border-color:#b9d6ff;cursor:default}.total{margin:16px 0 0;color:#5b6b7f}.total b{color:#001530}
</style>

async function submit(){
  if(!S.password){STEP=1;render();$('msg').textContent='Enter your password again to finish.';return;}
  var b=$('nx');b.disabled=true;b.textContent='Creating your account...';$('msg').textContent='';
  try{
    var r=await fetch(SB_URL+'/functions/v1/account-signup',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_ANON,Authorization:'Bearer '+SB_ANON},
      body:JSON.stringify({plan:S.plan,addons:{ai:!!S.addons.ai&&S.plan!=='enterprise',website:!!S.addons.website},name:S.name,email:S.email,phone:S.phone,password:S.password,business:S.business,trade:S.trade,profile:S.profile,website:S.hp||''})});
    var j=await r.json();
    if(j.exists){$('msg').innerHTML='You already have an account with that email. <a href="index.html?portal=1">Log in</a>.';b.disabled=false;b.textContent='Start 14-day free trial';return;}
    if(!j.ok)throw new Error(j.error||'Something went wrong.');
    if(SB){await SB.auth.signInWithPassword({email:S.email,password:S.password}).catch(function(){});}
    sessionStorage.removeItem('bp_signup');
    if(j.checkout_url){b.textContent='Opening secure checkout...';location.href=j.checkout_url;return;}
    location.href='signup.html?done=1';
  }catch(e){$('msg').textContent=e.message||'Something went wrong.';b.disabled=false;b.textContent='Start 14-day free trial';}
}
/* after Stripe: show the build finishing, then send them into their portal */
async function done(){
  $('prog').innerHTML='';
  $('view').innerHTML='<div class="panel"><h1>You are in. We are setting everything up.</h1><p class="sub">This takes about a minute. You can open BuilderPro now; anything still running finishes in the background.</p><ul class="steps" id="stp"></ul><div class="nav"><a class="btn pri" href="index.html?portal=1" style="text-decoration:none">Open my BuilderPro</a></div></div>';
  var tick=async function(){
    var a=null; try{ if(SB){ var r=await SB.from('accounts').select('status,ghl_location_id,onboard_state,setup_log,checkout_url').maybeSingle(); a=r.data; } }catch(e){}
    var log=(a&&a.setup_log||[]).join(' ');
    var items=[['Your BuilderPro login and settings',!!a],['Your GoHighLevel workspace',!!(a&&a.ghl_location_id)],['Business details and booking calendar',/details filled/i.test(log)],['Your AI receptionist',/receptionist/i.test(log)],['Final check by our Builder team',a&&a.onboard_state==='onboarded']];
    var first=true; $('stp').innerHTML=items.map(function(x){var c=x[1]?'done':(first?(first=false,'run'):'');return '<li class="'+c+'"><i></i>'+x[0]+'</li>'}).join('');
    if(a&&a.status==='checkout'&&a.checkout_url&&!$('payag')){ $('stp').insertAdjacentHTML('afterend','<div class="note" id="payag">Your card is not on file yet. <a href="'+esc(a.checkout_url)+'">Finish checkout</a> to keep your trial.</div>'); }
    if(!(a&&a.onboard_state==='onboarded'))setTimeout(tick,4000);
  }; tick();
}
async function payAgain(){
  $('prog').innerHTML='';
  $('view').innerHTML='<div class="panel"><h1>Checkout was not finished</h1><p class="sub">Your account is saved and your setup is already running. Add a card to start your 14-day free trial. You are not charged today.</p><div class="msg" id="msg"></div><div class="nav"><button class="btn pri" id="nx" onclick="resume()">Add card and start trial</button></div></div>';
}
async function resume(){
  var b=$('nx');b.disabled=true;b.textContent='Opening checkout...';
  try{ var ses=SB&&(await SB.auth.getSession()).data.session; if(!ses){location.href='index.html?portal=1';return;}
    var r=await fetch(SB_URL+'/functions/v1/account-signup',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_ANON,Authorization:'Bearer '+ses.access_token},body:JSON.stringify({op:'resume'})});
    var j=await r.json(); if(!j.ok||!j.checkout_url)throw new Error(j.error||'Could not open checkout.'); location.href=j.checkout_url;
  }catch(e){$('msg').textContent=e.message;b.disabled=false;b.textContent='Add card and start trial';}
}
if(qs.get('done'))done(); else if(qs.get('step')==='pay')payAgain(); else render();
</script>
