<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Book an inspection</title>
<!-- The public booking page was retired: homeowners book by calling, texting or
     chatting with Lisa. Any link still out there lands here and gets the
     business's phone number (from book-public's anonymous "info" answer). -->
<style>
:root{--ink:#0f1a2b;--mu:#5a6b82;--bg:#eef1f6;--card:#fff;--line:#dfe5ee;--blue:#2b63e6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e9eef6;--mu:#9fabbd;--bg:#0b0f16;--card:#121826;--line:#233043;--blue:#5a8bff}}
:root[data-theme="dark"]{--ink:#e9eef6;--mu:#9fabbd;--bg:#0b0f16;--card:#121826;--line:#233043;--blue:#5a8bff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;max-width:440px;width:100%;text-align:center}
h1{font-size:21px;margin:0 0 8px}
p{color:var(--mu);margin:0 0 18px}
a.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:10px}
</style>
</head>
<body>
<div class="card">
  <h1 id="t">Book your inspection by phone</h1>
  <p id="m">Online booking isn't available here. Call or text the business you were booking with and they'll set up a time.</p>
  <div id="c"></div>
</div>
<script>
(function(){
  var u=(new URLSearchParams(location.search).get('u')||'').replace(/[^0-9a-zA-Z-]/g,'').slice(0,64);
  if(!u) return;
  var URL='https://ttzwzouhiwdwamuimhpo.supabase.co/functions/v1/book-public';
  var A='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0end6b3VoaXdkd2FtdWltaHBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMTc2NjgsImV4cCI6MjA5ODY5MzY2OH0.oVqdHZlZLWJd_8nkgPRA9VgAqY4ytg51N1mT3Hqekso';
  fetch(URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:A,Authorization:'Bearer '+A},body:JSON.stringify({op:'info',u:u})})
    .then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok) return;
      var biz=String(d.business||'').slice(0,80), ph=String(d.phone||'').replace(/[^0-9+()\-. ]/g,'').slice(0,30);
      if(biz) document.getElementById('t').textContent='Book with '+biz;
      if(ph){
        document.getElementById('m').textContent='Call or text us and we’ll set up a time for your free inspection.';
        var a=document.createElement('a'); a.className='btn'; a.href='tel:'+ph.replace(/[^0-9+]/g,''); a.textContent='Call '+ph;
        document.getElementById('c').appendChild(a);
      }
    }).catch(function(){});
})();
</script>
</body>
</html>
