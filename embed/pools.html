function eCalcSqFt(pts) {
  if(!pts||pts.length<3) return 0;

  return Math.round(Math.abs(area*R*R/2)*10.7639);
}

function eDistFt(a,b){
  var R=6371000, dLat=(b.lat-a.lat)*Math.PI/180, dLon=(b.lng-a.lng)*Math.PI/180;
  var la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.sqrt(h))*3.28084;
}

var eSwCache={};
function eSwatch(key){
  if(eSwCache[key]) return eSwCache[key];
  var t=document.createElement('canvas'); t.width=t.height=120; var c=t.getContext('2d');
  function grad(a,b){ var g=c.createLinearGradient(0,0,120,120); g.addColorStop(0,a); g.addColorStop(1,b); c.fillStyle=g; c.fillRect(0,0,120,120); }

  switch(key){
    case 'vinyl': grad('#3aa9d6','#1f6fa8'); ripple('#bfe6f5',0.45); break;
    case 'fiberglass': grad('#46b6c4','#2a8fa8'); ripple('#d3f2f6',0.5); break;
    case 'gunite': grad('#2a7fc0','#1c5a8a'); ripple('#a9d2ee',0.4); break;
    default: grad('#3aa9d6','#1f6fa8'); ripple('#bfe6f5',0.45);
  }
  eSwCache[key]=t.toDataURL('image/jpeg',0.85); return eSwCache[key];
}

function eCalcPrice(){
  var p=E_CONFIG.pricing[eS.material]||E_CONFIG.pricing['gunite'];
  var tm=E_CONFIG.terrainMult[eS.terrain]||1.00, am=E_CONFIG.accessMult[eS.access]||1.00;
  var prm=E_CONFIG.projectMult[eS.project]||1.00, rm=parseFloat(E_CONFIG.regionMult[eS.region]||1.00);
  var area=eS.sqft;
  var deck=E_CONFIG.deckAdd[eS.decking]||E_CONFIG.deckAdd['none'];

  var low=Math.round((constLow + deck.low*rm + add.low)/100)*100;
  var high=Math.round((constHigh + deck.high*rm + add.high)/100)*100;

  }

  }
})();
