function eInitMap(lat, lon) {
  document.getElementById('e-mapwrap').style.display='block';
  eClearDrawing();

    eLmap=L.map('e-mapel',{ center:[lat,lon], zoom:20, maxZoom:23, zoomControl:true, attributionControl:false, doubleClickZoom:false });
    eTileStd=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:23,maxNativeZoom:19});
    eTileHD=L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{maxZoom:23,maxNativeZoom:21,subdomains:['mt0','mt1','mt2','mt3']});
    (eImageryHD?eTileHD:eTileStd).addTo(eLmap);
    eLmap.on('click', eOnMapClick);
    eLmap.on('dblclick', eOnMapDblClick);
  } else {
    eLmap.setView([lat,lon],20);

}
function eSetTool(t){
  eTool=t; eDrawModeActive=(t==='draw');
  var db=document.getElementById('e-btndraw'), pb=document.getElementById('e-btnpan'), mb=document.getElementById('e-btnmeasure');
  if(db) db.classList.toggle('on',t==='draw');
  if(pb) pb.classList.toggle('on',t==='pan');
  if(mb) mb.classList.toggle('on',t==='measure');
  if(eLmap){ eLmap.getContainer().style.cursor=(t==='pan')?'':'crosshair'; if(t==='pan') eLmap.dragging.enable(); else eLmap.dragging.disable(); }
}
function eSetDrawMode(active){ eSetTool(active?'draw':'pan'); }
function eOnMapClick(e) {
  if(eTool==='measure'){ eMeasureClick(e); return; }
  if(eTool!=='draw') return;
  var pt=e.latlng; eClickPts.push(pt);
  var m=L.circleMarker(pt,{radius:5,color:'#ffffff',fillColor:'#9cc8ee',fillOpacity:1,weight:2,interactive:false}).addTo(eLmap);
  eClickMarkers.push(m);
  eRedrawShape();
  var n=eClickPts.length;
  document.getElementById('e-mstat').textContent=n<3?n+' point'+(n>1?'s':'')+' placed — need 3 minimum (double-click to finish)':n+' points — double-click or click Clear when done';
}
function eOnMapDblClick(e){ if(eTool==='measure'){ if(eMeasurePts.length>=2) eFinishMeasure(); return; } if(eTool==='draw'&&eClickPts.length>=3) eFinishPolygon(); }
function eRedrawShape() {
  if(eClickLine){ eLmap.removeLayer(eClickLine); eClickLine=null; }
  if(eClickPoly){ eLmap.removeLayer(eClickPoly); eClickPoly=null; }
  if(eClickPts.length>=2) eClickLine=L.polyline(eClickPts,{color:'#9cc8ee',weight:2,opacity:0.8,interactive:false}).addTo(eLmap);
  if(eClickPts.length>=3){
    eClickPoly=L.polygon(eClickPts,{color:'#9cc8ee',weight:2,fillColor:'#2f6bff',fillOpacity:0.22,interactive:false}).addTo(eLmap);
  }
  eUpdateAreaDisplay();
}
function eFinishPolygon() {
  if(eClickPts.length<3) return;
  var sqft=eCalcSqFt(eClickPts);
  var poly=L.polygon(eClickPts,{color:'#7ad19a',weight:2,fillColor:'#2f6bff',fillOpacity:0.28,interactive:false}).addTo(eLmap);
  eFacets.push({sqft:sqft, poly:poly});
  eFacetTotal+=sqft;
  eClickMarkers.forEach(function(m){ if(eLmap) eLmap.removeLayer(m); }); eClickMarkers=[];
  if(eClickLine){ eLmap.removeLayer(eClickLine); eClickLine=null; }
  if(eClickPoly){ eLmap.removeLayer(eClickPoly); eClickPoly=null; }
  eClickPts=[];
  eUpdateAreaDisplay();
  document.getElementById('e-mstat').textContent=eFacets.length+' section'+(eFacets.length>1?'s':'')+' traced · total '+eCurrentPlanTotal().toLocaleString()+' sq ft. Trace another, or Clear.';
  eSetDrawMode(true);
}
function eCalcSqFt(pts) {
  if(!pts||pts.length<3) return 0;
  var R=6378137, area=0, n=pts.length;
  for(var i=0;i<n;i++){ var j=(i+1)%n, lat1=pts[i].lat*Math.PI/180, lat2=pts[j].lat*Math.PI/180, dLon=(pts[j].lng-pts[i].lng)*Math.PI/180; area+=dLon*(2+Math.sin(lat1)+Math.sin(lat2)); }
  return Math.round(Math.abs(area*R*R/2)*10.7639);
}
function eToggleImagery(){
  eImageryHD=!eImageryHD;

  else { if(eTileHD) eLmap.removeLayer(eTileHD); eTileStd.addTo(eLmap); }

function eSlopeFactor(pp){ var r=parseFloat((pp||'0/12').split('/')[0])||0; return Math.sqrt(r*r+144)/12; }
function eSlopeToCat(pp){ var r=parseFloat((pp||'4/12').split('/')[0])||0; if(r<1)return 'flat'; if(r<4)return 'low'; if(r<7)return 'medium'; if(r<10)return 'steep'; return 'very-steep'; }
function eDegToPitch(deg){ var x=Math.round(12*Math.tan((deg||0)*Math.PI/180)); var opts=[0,3,4,6,8,10,12]; var best=opts[0],bd=1e9; for(var i=0;i<opts.length;i++){ var dd=Math.abs(opts[i]-x); if(dd<bd){bd=dd;best=opts[i];} } return best+'/12'; }

function eCurrentPlanTotal(){ var t=eFacetTotal; if(eClickPts.length>=3) t+=eCalcSqFt(eClickPts); return Math.round(t); }
function eUpdateAreaDisplay(){

function eDistFt(a,b){
  var R=6371000, dLat=(b.lat-a.lat)*Math.PI/180, dLon=(b.lng-a.lng)*Math.PI/180;
  var la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.sqrt(h))*3.28084;
}

  return L.marker(mid,{interactive:false,icon:L.divIcon({className:'',html:'<div style="background:#dc2626;color:#fff;font:700 11px Inter,system-ui,sans-serif;padding:2px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.35)">'+txt+'</div>',iconSize:[0,0]})}).addTo(eLmap);

function eMeasureClick(e){
  eMeasurePts.push(e.latlng);

function eMeasureRedraw(){
  if(eMeasureLine){ eLmap.removeLayer(eMeasureLine); eMeasureLine=null; }
  eMeasureLabels.forEach(function(l){ eLmap.removeLayer(l); }); eMeasureLabels=[];
  if(eMeasurePts.length>=2){
    eMeasureLine=L.polyline(eMeasurePts,{color:'#dc2626',weight:3,opacity:.9,interactive:false}).addTo(eLmap);
    var total=0;
    for(var i=1;i<eMeasurePts.length;i++){
      var a=eMeasurePts[i-1], b=eMeasurePts[i], d=eDistFt(a,b); total+=d;
      eMeasureLabels.push(eMeasureLabelMarker(L.latLng((a.lat+b.lat)/2,(a.lng+b.lng)/2), Math.round(d)+' ft'));
    }
    document.getElementById('e-mstat').textContent='Measuring \u00b7 total '+Math.round(total)+' ft (double-click to finish)';
  } else {
    document.getElementById('e-mstat').textContent='Click two points to measure a length (double-click to finish)';
  }

function eFinishMeasure(){
  if(eMeasurePts.length<2) return;
  var total=0; for(var i=1;i<eMeasurePts.length;i++) total+=eDistFt(eMeasurePts[i-1],eMeasurePts[i]);
  eMeasureLines.push({line:eMeasureLine, labels:eMeasureLabels.slice(), markers:eMeasureMarkers.slice()});
  eMeasureLine=null; eMeasureLabels=[]; eMeasureMarkers=[]; eMeasurePts=[];
  document.getElementById('e-mstat').textContent='Measured '+Math.round(total)+' ft \u00b7 measure another, or switch tools.';
}
function eClearDrawing() {

  if(eClickPoly){ eLmap.removeLayer(eClickPoly); eClickPoly=null; }
  eFacets.forEach(function(f){ if(eLmap&&f.poly) eLmap.removeLayer(f.poly); }); eFacets=[]; eFacetTotal=0;
  eMeasureLines.forEach(function(g){ if(g.line) eLmap.removeLayer(g.line); g.labels.forEach(function(l){ eLmap.removeLayer(l); }); g.markers.forEach(function(m){ eLmap.removeLayer(m); }); }); eMeasureLines=[];
  if(eMeasureLine){ eLmap.removeLayer(eMeasureLine); eMeasureLine=null; }
  eMeasureLabels.forEach(function(l){ eLmap.removeLayer(l); }); eMeasureLabels=[];
  eMeasureMarkers.forEach(function(m){ eLmap.removeLayer(m); }); eMeasureMarkers=[]; eMeasurePts=[];

function eSwatch(key){

  function coil(base,line){ grad(base[0],base[1]); c.strokeStyle=line; c.lineWidth=2; for(var x=-20;x<140;x+=14){ c.beginPath(); for(var y=-10;y<130;y+=4){ c.lineTo(x+Math.sin(y/9)*7, y); } c.stroke(); } }
  function louver(base,line){ grad(base[0],base[1]); c.strokeStyle=line; c.lineWidth=6; c.lineCap='round'; for(var y=14;y<120;y+=16){ c.beginPath(); c.moveTo(12,y); c.lineTo(108,y-6); c.stroke(); } }
  function duct(base,line){ grad(base[0],base[1]); c.strokeStyle=line; c.lineWidth=3; for(var i=8;i<120;i+=13){ c.beginPath();c.moveTo(i,0);c.lineTo(i,120);c.stroke(); } c.strokeStyle='rgba(255,255,255,.25)'; c.lineWidth=1; for(var i2=8;i2<120;i2+=13){ c.beginPath();c.moveTo(i2-2,0);c.lineTo(i2-2,120);c.stroke(); } }
  switch(key){
    case 'ac-only':    brush('#c3ccd4','rgba(255,255,255,.7)','#8f9aa6'); break;              // brushed-metal condenser
    case 'heat-pump':  louver(['#9fb7cf','#6f8aa6'],'rgba(20,40,60,.30)'); break;             // louvered outdoor unit
    case 'furnace-ac': coil(['#d7b48c','#b07d4c'],'rgba(120,60,20,.35)'); break;              // warm gas-heat coil tone
    case 'mini-split': brush('#eef2f6','rgba(255,255,255,.85)','#cdd6df'); break;             // white wall head

}

#est-embed #e-zippanel .e-shdr{margin:-16px -32px 14px !important;width:auto !important;max-width:none !important;}
@media(max-width:640px){#est-embed #e-zippanel .e-shdr{margin:-16px -16px 12px !important;}}
</style>
</body><style>
#est-embed button,#est-embed [class*=btn]{transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s,filter .2s;}
#est-embed button:hover,#est-embed [class*=btn]:hover{transform:translateY(-2px);filter:brightness(1.06);}
#est-embed button:active{transform:scale(.95);}
.bp-pop{animation:bpPop .4s cubic-bezier(.22,1,.36,1);}
@keyframes bpPop{0%{transform:scale(1)}35%{transform:scale(.93)}70%{transform:scale(1.03)}100%{transform:scale(1)}}
</style>
<script>
document.addEventListener('click',function(e){
 var b=e.target&&e.target.closest?e.target.closest('button,a,[role=button],[class*=btn],[class*=opt],[class*=chip],[class*=card],label,select'):null;
 if(!b)return;
 b.classList.remove('bp-pop');void b.offsetWidth;b.classList.add('bp-pop');
},true);
</script></html>
