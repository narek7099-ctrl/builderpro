html,body{margin:0;padding:0;background:#edf2f6;}

#est-embed.ck *{box-sizing:border-box;}
.rt-card{background:var(--card);border-radius:16px;padding:20px 18px;margin:0 0 8px;animation:rtIn .32s cubic-bezier(.22,1,.28,1) both;}
@keyframes rtIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.rt-card{animation:none}}
.rt-biz{display:flex;align-items:center;gap:12px;}
.rt-biz img{width:48px;height:48px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--line);}
.rt-biz .ph{width:48px;height:48px;border-radius:12px;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:0 0 auto;}
.rt-biz b{display:block;font-size:17px;letter-spacing:-.01em;}
.rt-biz span{display:block;font-size:13px;color:var(--mu);margin-top:2px;}
.rt-kicker{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--a);margin:0 0 8px;}
.rt-h{font-size:26px;line-height:1.15;font-weight:600;letter-spacing:-.02em;margin:0 0 6px;}
.rt-sub{font-size:15px;color:var(--mu);margin:0;line-height:1.45;}
.rt-who{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.rt-av{width:56px;height:56px;border-radius:50%;flex:0 0 auto;position:relative;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--txt);font-size:18px;}
.rt-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.rt-who b{display:block;font-size:17px;}
.rt-who span{display:block;font-size:13px;color:var(--mu);}
.rt-stars{display:flex;gap:4px;}
.rt-stars button{flex:1 1 0;max-width:60px;height:52px;border:0;background:transparent;padding:0;cursor:pointer;color:var(--soft);border-radius:12px;transition:transform .15s ease,color .15s ease;-webkit-tap-highlight-color:transparent;}
.rt-stars button svg{width:40px;height:40px;display:block;margin:0 auto;}
.rt-stars button.on{color:var(--star);}
.rt-stars button:active{transform:scale(.9);}
.rt-stars button:focus-visible{outline:3px solid var(--a);outline-offset:2px;}
.rt-word{font-size:13px;font-weight:600;color:var(--mu);min-height:18px;margin:4px 0 0;}
.rt-c{width:100%;min-height:52px;margin-top:10px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font:inherit;font-size:16px;color:var(--txt);background:var(--card);resize:vertical;}
.rt-c:focus{outline:none;border-color:var(--a);}
.rt-main{display:block;width:100%;min-height:56px;margin-top:8px;border-radius:999px;border:0;background:var(--txt);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer;}
.rt-main:disabled{opacity:.45;cursor:default;}
.rt-ghost{display:block;width:100%;min-height:52px;margin-top:10px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--txt);font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-align:center;line-height:49px;text-decoration:none;}
.rt-err{color:var(--bad);font-size:14px;min-height:20px;margin:8px 2px 0;text-align:center;}
.rt-done{text-align:center;padding:34px 20px;}
.rt-done .ok{width:64px;height:64px;border-radius:50%;background:color-mix(in srgb,var(--good) 14%,var(--card));color:var(--good);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.rt-done .ok svg{width:34px;height:34px;}
.rt-skel{height:120px;border-radius:16px;background:linear-gradient(90deg,var(--card),#f4f7fa,var(--card));background-size:200% 100%;animation:rtSk 1.2s linear infinite;margin-bottom:8px;}
@keyframes rtSk{to{background-position:-200% 0}}
.rt-foot{text-align:center;font-size:12px;color:var(--mu);margin-top:14px;}
</style>
