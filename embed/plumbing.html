    case 'butcher': grad('#c68d54','#a86c34'); for(var i=0;i<120;i+=6){ c.strokeStyle='rgba(120,80,40,'+(0.15+Math.random()*0.18)+')'; c.lineWidth=1+Math.random(); c.beginPath();c.moveTo(0,i);c.bezierCurveTo(40,i-2,80,i+2,120,i);c.stroke(); } break;

    case 'quartz': grad('#f7f6f3','#eeece8'); speck(90,['#e7e6e2','#dedcd7'],0.7,0.5); vein('rgba(200,200,200,0.4)',1,1); break;

/* SUBMIT + RESULT */
function eCalcPrice(){
  var p=E_CONFIG.pricing[eS.material]||E_CONFIG.pricing['water-heater'];
  var qm=E_CONFIG.qualityMult[eS.quality]||1.00;   /* home age   */
  var tm=E_CONFIG.terrainMult[eS.terrain]||1.00;   /* stories    */
  var am=E_CONFIG.accessMult[eS.access]||1.00;     /* where pipe runs */
  var prm=E_CONFIG.projectMult[eS.project]||1.00;  /* urgency    */
  var rm=parseFloat(E_CONFIG.regionMult[eS.region]||1.00);
  var baths=Math.max(1, eS.sqft||1);               /* the slider counts bathrooms */

  /* Fixed base plus a per-bathroom amount. A water heater costs the same in a
     one-bath cottage and a four-bath house, so its per-bathroom figure is
     zero and only the base applies; a repipe is almost entirely per-bathroom.
     One shape covers both, which a flat rate per anything cannot. */
  var lowRaw  = (p.baseLow  + baths*p.perLow ) * qm*tm*am*prm*rm;
  var highRaw = (p.baseHigh + baths*p.perHigh) * qm*tm*am*prm*rm;
  var add=eAddonTotals();

  /* Rounded to $50 so it reads as an estimate rather than a quote. Add-ons
     are flat trade prices and are NOT multiplied — a permit fee does not get
     more expensive because the house is old. */
  var low =Math.round(lowRaw /50)*50 + add.low;
  var high=Math.round(highRaw/50)*50 + add.high;
  return {low:low, high:high, mid:Math.round((low+high)/2), area:baths,
          lowPer:Math.round(lowRaw/baths), highPer:Math.round(highRaw/baths), addons:add};
}

  eGo(10);
  var ids=['e-ld1','e-ld2','e-ld3','e-ld4','e-ld5'], li=0;
  function eNextStep(){ if(li>=ids.length){ setTimeout(eShowResult,500); return; } document.getElementById(ids[li]).classList.remove('act'); document.getElementById(ids[li]).classList.add('done'); li++; if(li<ids.length) document.getElementById(ids[li]).classList.add('act'); setTimeout(eNextStep,680); }
  setTimeout(eNextStep,680);
}
function eTitle(s){ s=(s||'').replace(/-/g,' '); return s.charAt(0).toUpperCase()+s.slice(1); }
function eShowResult() {
  var p=E_CONFIG.pricing[eS.material]||E_CONFIG.pricing['vinyl-lvp'];
  var est=eCalcPrice();
  document.getElementById('e-rrange').innerHTML='$'+est.low.toLocaleString()+' — <em>$'+est.high.toLocaleString()+'</em>';
  document.getElementById('e-rnote').textContent=est.area.toLocaleString()+' sq ft · '+p.label+' · '+eTitle(eS.quality)+' · '+eTitle(eS.terrain)+' removal · '+eTitle(eS.project)+(est.addons&&est.addons.count?' · '+est.addons.count+' add-on'+(est.addons.count>1?'s':''):'')+' · '+eS.regionLabel+(eS.usedMap?' · Instant estimate':' · Instant estimate');
  document.getElementById('e-rv1').textContent=est.area+(est.area===1?' bathroom':' bathrooms');

  /* the access answer swings the labour more than anything else here, so it
     earns the last box rather than a per-unit rate that means little when

  document.getElementById('e-rv6').textContent=eTitle(eS.access)||'\u2014';
  document.getElementById('e-sp10').classList.remove('active');
  document.getElementById('e-spR').classList.add('active');
  document.getElementById('e-pfill').style.width='100%';
  document.getElementById('e-tstep').innerHTML='<b>✓ Estimate Complete</b>';
  var embed=document.getElementById('est-embed-shell');

<script id="hs-script">
/* HOUSE SCAN — the map-to-house shot for every calculator except roofing.
   Source for embed-src/house-scan.html, which tools/build-house-scan.py
   assembles from this file plus the map and house code shared with the roof
   scan (embed-src/roof-scan.html), so that code lives in one place.

   The shot: their street from above, their home's outline lights up, the
   camera tilts and the house rises out of the map — then each trade ends its
   own way, all in the same white-block look:

     hvac         a condenser appears beside the house, fan spinning; the camera
                  closes in and turns around it
     countertops  the roof lifts off and the camera drops into a kitchen
     trim         the roof lifts off; baseboard, casing and crown trace a room
     painting     every wall is traced and washed (a room, for interior jobs)
     pools        a pool is outlined, dug and filled in the back yard
     landscaping  the back yard is laid out: lawn, planting, stepping stones
     plumbing     the house turns to glass; supply lines run in to the fixtures
     electrical   the house turns to glass; circuits run out from the panel
     general      the whole house, every edge traced

   Everything is white — how things will LOOK is the image generator's job —
   and nothing waits on the homeowner's choices: the pool and the yard are
   picked at random (the same for the same address), and the real questions
   come after the scan, on the calculator's own steps.

   The measurement is the roof scan's: rapid-handler's building read, so the
   house is theirs. What it hands to each calculator is the step-1 number that
   trade asks for, where the house can supply it (home size for HVAC, painting
   and electrical; pool and yard size from the questions); otherwise the size
   slider opens for them as before. */
(function(){
  var TRADE = window.HS_TRADE || 'general';
  var HS_END = 15.0, HS_WAIT_MAX = 28;
  var st = null;
  (function(){ try{ if(document.getElementById('rs-geist')) return; var l=document.createElement('link'); l.id='rs-geist'; l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap'; (document.head||document.documentElement).appendChild(l); }catch(e){} })();
  function $(id){ return document.getElementById(id); }
  function reduced(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }

  /* ── the house model, in feet ──────────────────────────────────────────────
     Footprint from the measured area and slope: plan = true area × cos(slope).
     Proportioned 1.55 : 1, which is close to the median US single-family
     footprint. Satellite gives the area and the pitch, not the plan shape, so
     the shape is the typical one and the size and steepness are theirs. */
  function modelFor(trueSqft, pitchDeg){
    var p=Math.max(0, Math.min(55, pitchDeg||22));
    var plan=Math.max(600, (trueSqft||2000)*Math.cos(p*Math.PI/180));
    var D=Math.sqrt(plan/1.55), W=D*1.55;
    return { W:W, D:D, H:10, pitch:p, o:1.6 };
  }


  /* ── their actual roof, from the planes satellite found ────────────────────
     Solar returns every roof plane with its slope, the compass direction it
     faces, its height and a north-up bounding box. Houses are rarely built
     square to north, so first find the house's own grid (planes face along
     it, 90° apart), turn everything onto that grid, and each plane becomes a
     rectangle sloping one of four ways. Its size comes from its measured
     ground area, so a garage wing is garage-sized and sits where the garage
     is. Under each plane, walls to the ground — a white block, not a render,
     but the outline and the roof are theirs. */
  function planesModel(roof, origin){
    var ps=(roof&&roof.planes)||[]; if(ps.length<2) return null;
    var lat0=0,lng0=0; ps.forEach(function(p){ lat0+=p.lat; lng0+=p.lng; }); lat0/=ps.length; lng0/=ps.length;
    var FT=3.28084, kx=111320*Math.cos(lat0*Math.PI/180)*FT, kz=110574*FT;
    function loc(la,ln){ return [ (ln-lng0)*kx, -(la-lat0)*kz ]; }        /* x east, z south */
    /* the house's grid: circular mean of the facing directions, folded to 90° */
    var sx=0, sy=0; ps.forEach(function(p){ var a=p.azimuth*Math.PI/180*4, w=p.groundSqft; sx+=Math.cos(a)*w; sy+=Math.sin(a)*w; });
    var th=Math.atan2(sy,sx)/4, ct=Math.cos(-th), st2=Math.sin(-th);
    function rot(v){ return [v[0]*ct - v[1]*st2, v[0]*st2 + v[1]*ct]; }
    var facets=ps.map(function(p){
      var c=rot(loc(p.lat,p.lng));
      /* Solar's box is north-up around a plane that is turned th off north.
         For a w×d rectangle turned th, the box is  Bx = w|cos|+d|sin|,
         Bz = w|sin|+d|cos|  — solve that for w and d. Shrinking the loose box
         evenly instead would square every plane off: a 52 ft eave came out 32.
         Near 45° the two equations say the same thing, so there it falls
         back to the even shrink. Either way the result is trimmed to the
         plane's measured ground area. */
      var a=loc(p.sw[0],p.sw[1]), b=loc(p.ne[0],p.ne[1]);
      var Bx=Math.abs(b[0]-a[0]), Bz=Math.abs(b[1]-a[1]);
      var cc=Math.abs(Math.cos(th)), ss=Math.abs(Math.sin(th)), den=cc*cc-ss*ss, ex, ez;
      if(Math.abs(den)>0.25){ ex=(Bx*cc-Bz*ss)/den; ez=(Bz*cc-Bx*ss)/den; }
      if(!(ex>2&&ez>2)){ ex=Bx; ez=Bz; }
      var g=Math.max(20,p.groundSqft), k=Math.sqrt(g/(ex*ez));
      ex=Math.max(4,ex*k); ez=Math.max(4,ez*k);
      /* which of the four grid directions this plane slopes down toward */
      var q=Math.round(((p.azimuth*Math.PI/180 - th)/(Math.PI/2)))%4; if(q<0) q+=4;
      var dir=[[0,-1],[1,0],[0,1],[-1,0]][q];                          /* north, east, south, west */
      return {cx:c[0], cz:c[1], ex:ex, ez:ez, dir:dir, pitch:p.pitch, h:p.h*FT};
    });
    /* centre it, and put the ground one storey under the lowest eave */
    var minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9,lowEave=1e9,top=-1e9;
    facets.forEach(function(f){
      minX=Math.min(minX,f.cx-f.ex/2); maxX=Math.max(maxX,f.cx+f.ex/2);
      minZ=Math.min(minZ,f.cz-f.ez/2); maxZ=Math.max(maxZ,f.cz+f.ez/2);
      var half=(f.dir[0]?f.ex:f.ez)/2, rise=half*Math.tan(Math.min(60,f.pitch)*Math.PI/180);
      f.rise=rise; lowEave=Math.min(lowEave,f.h-rise); top=Math.max(top,f.h+rise);
    });
    var ox=(minX+maxX)/2, oz=(minZ+maxZ)/2, base=lowEave-10;
    var faces=[], roofEdges=[], eaves=[], foot=[];
    facets.forEach(function(f, gi){
      var x0=f.cx-ox-f.ex/2, x1=f.cx-ox+f.ex/2, z0=f.cz-oz-f.ez/2, z1=f.cz-oz+f.ez/2;
      var hc=f.h-base, flat=f.pitch<5;
      /* height of the roof at a corner: lower on the downslope side */
      function hy(x,z){ if(flat) return hc; var t=f.dir[0]? (x-(x0+x1)/2)/((x1-x0)/2)*f.dir[0] : (z-(z0+z1)/2)/((z1-z0)/2)*f.dir[1]; return hc - t*f.rise; }
      var c=[[x0,z0],[x1,z0],[x1,z1],[x0,z1]];
      var top4=c.map(function(p){ return [p[0],hy(p[0],p[1]),p[1]]; });
      var bot4=c.map(function(p){ return [p[0],0,p[1]]; });
      foot.push(bot4);
      for(var i=0;i<4;i++){ var j=(i+1)%4; faces.push({v:[bot4[i],bot4[j],top4[j],top4[i]], kind:'wall', grp:gi}); }
      faces.push({v:top4, kind:'roof', grp:gi});
      for(var i2=0;i2<4;i2++){ roofEdges.push([top4[i2],top4[(i2+1)%4]]); }
      /* the eave is the low edge of the plane */
      var lo=[0,1,2,3].filter(function(i){ return Math.abs(top4[i][1]-(hc-f.rise))<0.01; });
      if(lo.length===2) eaves.push([top4[lo[0]],top4[lo[1]]]);
    });
    /* Built on the house's own grid; now set back into the world the map is
       drawn in — north-up feet around the address — so the house rises out
       of the map exactly where it stands on it. Every corner is shared by
       several faces and edges, so each is moved once. */
    var o=origin||{lat:lat0,lng:lng0};
    var offx=(lng0-o.lng)*kx, offz=-(lat0-o.lat)*kz, cth=Math.cos(th), sth=Math.sin(th), seen=[];
    function toWorld(v){ if(v._w) return; v._w=1; seen.push(v); var x=v[0]+ox, z=v[2]+oz; v[0]=x*cth - z*sth + offx; v[2]=x*sth + z*cth + offz; }
    faces.forEach(function(f){ f.v.forEach(toWorld); });
    roofEdges.forEach(function(e){ toWorld(e[0]); toWorld(e[1]); });
    eaves.forEach(function(e){ toWorld(e[0]); toWorld(e[1]); });
    seen.forEach(function(v){ delete v._w; });
    var W=maxX-minX, D=maxZ-minZ;
    return { m:{ W:W, D:D, H:(top-base)*0.7, pitch:0, o:0 },
             geo:{ faces:faces, roofEdges:roofEdges, ridge:null, eaves:eaves.length?eaves:roofEdges.slice(0,4), planes:facets.length, foot:foot, axes:{th:th} } };   /* axes: the house's own grid, for the other trades' scenes */
  }

  function buildGeometry(m){
    var W=m.W/2, D=m.D/2, H=m.H, o=m.o;
    var faces=[], roofEdges=[];
    /* walls */
    var g=[[-W,0,-D],[W,0,-D],[W,0,D],[-W,0,D]], t=[[-W,H,-D],[W,H,-D],[W,H,D],[-W,H,D]];
    for(var i=0;i<4;i++){ var j=(i+1)%4; faces.push({v:[g[i],g[j],t[j],t[i]], kind:'wall'}); }
    var foot=[g];
    var tan=Math.tan(m.pitch*Math.PI/180);
    var ex=W+o, ez=D+o, eh=H-o*tan*0.6;       /* eaves overhang the walls a little */
    var e=[[-ex,eh,-ez],[ex,eh,-ez],[ex,eh,ez],[-ex,eh,ez]];
    if(m.pitch<5){
      var top=H+1.2;
      faces.push({v:[[-ex,top,-ez],[ex,top,-ez],[ex,top,ez],[-ex,top,ez]], kind:'roof'});
      roofEdges=[[[-ex,top,-ez],[ex,top,-ez]],[[ex,top,-ez],[ex,top,ez]],[[ex,top,ez],[-ex,top,ez]],[[-ex,top,ez],[-ex,top,-ez]]];
      return {faces:faces, roofEdges:roofEdges, ridge:null, eave:roofEdges[0], eaves:roofEdges.slice(0,4), foot:foot};
    }
    /* hip roof: ridge runs along the long side */
    var rh=eh+ez*tan, rx=Math.max(0.5, ex-ez);
    var r1=[-rx,rh,0], r2=[rx,rh,0];
    faces.push({v:[e[0],e[1],r2,r1], kind:'roof'});     /* front slope  */
    faces.push({v:[e[2],e[3],r1,r2], kind:'roof'});     /* back slope   */
    faces.push({v:[e[1],e[2],r2], kind:'roof'});        /* right hip    */
    faces.push({v:[e[3],e[0],r1], kind:'roof'});        /* left hip     */
    /* drawn in the order a roofer would read them: eaves, then hips, then the ridge */
    roofEdges=[[e[0],e[1]],[e[1],e[2]],[e[2],e[3]],[e[3],e[0]],[e[0],r1],[e[1],r2],[e[2],r2],[e[3],r1],[r1,r2]];
    return {faces:faces, roofEdges:roofEdges, ridge:[r1,r2], eave:[e[0],e[1]], eaves:roofEdges.slice(0,4), foot:foot};
  }

  /* ── projection ── */
  /* The house turns about a vertical axis through its own centre, and the
     framing is worked out once from the model rather than every frame: the
     scale fits the house's widest turning circle, so no angle of the turn
     is ever larger than another, and the centre never moves. Measuring each
     frame's outline and re-centring on it (as before) chased a shape that
     changes as it turns, which read as the house shaking. Orthographic, for
     the same reason — perspective makes the near corner swell and shrink. */
  function frameFor(geo){
    var mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9];
    geo.faces.forEach(function(f){ f.v.forEach(function(v){ for(var i=0;i<3;i++){ if(v[i]<mn[i])mn[i]=v[i]; if(v[i]>mx[i])mx[i]=v[i]; } }); });
    var c=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2], R=0;
    geo.faces.forEach(function(f){ f.v.forEach(function(v){ var d=Math.hypot(v[0]-c[0], v[2]-c[2]); if(d>R)R=d; }); });
    return {c:c, R:Math.max(1,R), H:Math.max(1,mx[1]-mn[1])};
  }
  /* cam: c (centre, world feet), R and H (what must fit), tilt (0.46 is
     the three-quarter view; PI/2 is straight down), yaw, zoom (1 = the
     house fills the frame; larger shows more of the street). */
  function makeProj(cv, cam){
    var w=cv.width, h=cv.height, ct=Math.cos(cam.tilt), stl=Math.sin(cam.tilt);
    var needW=2*cam.R, needH=2*cam.R*stl + cam.H*ct;
    var scale=Math.min(w*0.78/needW, h*0.74/needH)/cam.zoom;
    var cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw), g=cam.grow===undefined?1:cam.grow;
    var f=function(p){
      var px=p[0]-cam.c[0], py=p[1]*g-cam.c[1], pz=p[2]-cam.c[2];   /* walls rise from the ground */
      var x=px*cy - pz*sy, z=px*sy + pz*cy;
      var y2=py*ct + z*stl, z2=z*ct - py*stl;
      return {x:w/2 + x*scale, y:h/2 - y2*scale, z:z2};
    };
    f.scale=scale;
    return f;
  }



  /* ── the street around the house ─────────────────────────────────────────────
     The same white map the Lead Radar uses: OpenFreeMap's OpenMapTiles data
     (free, no key, no watermark, fine for commercial use). Rather than a map
     library, the scan fetches the one or few vector tiles around the address
     and draws the roads and buildings itself, in the same scene and with the
     same camera as the house — so the map can tilt and the house can rise
     out of it in one continuous shot, with no hand-off between two renderers.
     No key, no per-visitor cost, and nothing to download beyond the tiles.
     If the tiles cannot be had, the scan runs exactly as before, on white. */
  var RS_TILEJSON='https://tiles.openfreemap.org/planet';
  var RS_MAP_R=900;                 /* feet of street to draw around the house */
  var rsTileTpl=null;

  /* A minimal Mapbox Vector Tile reader: protobuf wire format, the layers,
     their features' tags and geometry commands. ~60 lines rather than a
     library on every contractor's site. */
  function rsMvt(buf){
    var b=new Uint8Array(buf), p=0;
    function vint(){ var r=0, s=0, c; do{ c=b[p++]; r+=(c&0x7f)*Math.pow(2,s); s+=7; }while(c>=0x80); return r; }
    function skip(t){ if(t===0) vint(); else if(t===1) p+=8; else if(t===2){ var l=vint(); p+=l; } else if(t===5) p+=4; }
    function str(end){ var out=''; try{ out=new TextDecoder().decode(b.subarray(p,end)); }catch(e){} p=end; return out; }
    function packed(end){ var a=[]; while(p<end) a.push(vint()); return a; }
    var layers={};
    while(p<b.length){
      var key=vint(), f=key>>3, t=key&7;
      if(f!==3||t!==2){ skip(t); continue; }
      var lend=vint()+p, L={name:'',extent:4096,keys:[],vals:[],feats:[]};
      while(p<lend){
        var k2=vint(), f2=k2>>3, t2=k2&7;
        if(f2===1&&t2===2){ var e1=vint()+p; L.name=str(e1); }
        else if(f2===5&&t2===0){ L.extent=vint(); }
        else if(f2===3&&t2===2){ var e3=vint()+p; L.keys.push(str(e3)); }
        else if(f2===4&&t2===2){
          var e4=vint()+p, v=null;
          while(p<e4){ var k4=vint(), f4=k4>>3, t4=k4&7;
            if(f4===1&&t4===2){ var e5=vint()+p; v=str(e5); }
            else if(f4===4||f4===5){ v=vint(); }
            else if(f4===7){ v=!!vint(); }
            else skip(t4); }
          L.vals.push(v);
        }
        else if(f2===2&&t2===2){
          var e2=vint()+p, F={type:0,tags:[],geom:[]};
          while(p<e2){ var k3=vint(), f3=k3>>3, t3=k3&7;
            if(f3===2&&t3===2){ var et=vint()+p; F.tags=packed(et); }
            else if(f3===3&&t3===0){ F.type=vint(); }
            else if(f3===4&&t3===2){ var eg=vint()+p; F.geom=packed(eg); }
            else skip(t3); }
          L.feats.push(F);
        }
        else skip(t2);
      }
      p=lend; layers[L.name]=L;
    }
    return layers;
  }
  /* geometry commands -> rings / lines, in tile pixels */
  function rsGeom(g){
    var out=[], cur=null, x=0, y=0, i=0;
    function zz(n){ return (n>>>1) ^ -(n&1); }
    while(i<g.length){
      var ci=g[i++], cmd=ci&7, cnt=ci>>3;
      if(cmd===7){ if(cur&&cur.length) cur.push(cur[0]); continue; }
      for(var k=0;k<cnt;k++){
        x+=zz(g[i++]); y+=zz(g[i++]);
        if(cmd===1){ cur=[[x,y]]; out.push(cur); } else if(cur) cur.push([x,y]);
      }
    }
    return out;
  }
  function rsProps(L,F){ var o={}; for(var i=0;i+1<F.tags.length;i+=2) o[L.keys[F.tags[i]]]=L.vals[F.tags[i+1]]; return o; }

  var RS_ROAD={motorway:60,trunk:56,primary:48,secondary:42,tertiary:36,minor:28,service:16};

  function rsMapFromTiles(tiles, origin){
    var FT=3.28084, kx=111320*Math.cos(origin.lat*Math.PI/180)*FT, kz=110574*FT;
    var roads=[], blds=[], water=[], park=[], lim=RS_MAP_R*1.35;
    function near(ring){ for(var i=0;i<ring.length;i++){ if(Math.abs(ring[i][0])<lim&&Math.abs(ring[i][1])<lim) return true; } return false; }
    tiles.forEach(function(T){
      var n=Math.pow(2,T.z);
      function w(px,py,ext){
        var X=T.x+px/ext, Y=T.y+py/ext;
        var lng=X/n*360-180, lat=Math.atan(Math.sinh(Math.PI*(1-2*Y/n)))*180/Math.PI;
        return [(lng-origin.lng)*kx, -(lat-origin.lat)*kz];
      }
      var ls=T.layers;
      function each(name, fn){ var L=ls[name]; if(!L) return; L.feats.forEach(function(F){ fn(L,F,rsGeom(F.geom).map(function(r){ return r.map(function(q){ return w(q[0],q[1],L.extent); }); })); }); }
      each('transportation', function(L,F,rings){ if(F.type!==2) return; var c=rsProps(L,F)['class']; var wd=RS_ROAD[c]; if(!wd) return;
        rings.forEach(function(r){ if(near(r)) roads.push({w:wd, pts:r}); }); });
      each('building', function(L,F,rings){ if(F.type!==3) return; rings.forEach(function(r){ if(r.length>2&&near(r)) blds.push(r); }); });
      each('water', function(L,F,rings){ if(F.type!==3) return; rings.forEach(function(r){ if(near(r)) water.push(r); }); });
      each('park', function(L,F,rings){ if(F.type!==3) return; rings.forEach(function(r){ if(near(r)) park.push(r); }); });
    });
    /* widest roads last, so they sit on top where they cross */
    roads.sort(function(a,b){ return a.w-b.w; });
    return {roads:roads, blds:blds, water:water, park:park};
  }

  function rsFetch(url, ms, kind){
    return new Promise(function(res,rej){
      var done=false, t=setTimeout(function(){ if(!done){ done=true; rej(new Error('timeout')); } }, ms);
      fetch(url).then(function(r){ if(!r.ok) throw new Error(r.status); return kind==='json'?r.json():r.arrayBuffer(); })
        .then(function(v){ if(!done){ done=true; clearTimeout(t); res(v); } })
        .catch(function(e){ if(!done){ done=true; clearTimeout(t); rej(e); } });
    });
  }

  function rsMapLoad(lat, lng){
    if(!st) return;
    var me=st, origin={lat:+lat, lng:+lng};
    me.origin=origin;
    if(typeof window.RS_DEMO_MAP==='function'){ setTimeout(function(){ if(st===me) me.map=window.RS_DEMO_MAP(origin); }, 250); return; }
    var tpl=rsTileTpl ? Promise.resolve(rsTileTpl)
      : rsFetch(RS_TILEJSON, 5000, 'json').then(function(j){ rsTileTpl={t:j.tiles[0], z:Math.min(14, j.maxzoom||14)}; return rsTileTpl; });
    tpl.then(function(tt){
      var z=tt.z, n=Math.pow(2,z);
      var xf=(origin.lng+180)/360*n, lr=origin.lat*Math.PI/180;
      var yf=(1-Math.log(Math.tan(lr)+1/Math.cos(lr))/Math.PI)/2*n;
      var tileFt=40075016*Math.cos(lr)/n*3.28084, m=RS_MAP_R*1.3/tileFt;
      var want=[];
      for(var dx=-1;dx<=1;dx++) for(var dy=-1;dy<=1;dy++){
        var tx=Math.floor(xf)+dx, ty=Math.floor(yf)+dy;
        if(tx+1<xf-m||tx>xf+m||ty+1<yf-m||ty>yf+m) continue;
        want.push({x:tx,y:ty,z:z});
      }
      return Promise.all(want.map(function(T){
        var url=tt.t.replace('{z}',T.z).replace('{x}',T.x).replace('{y}',T.y);
        return rsFetch(url, 6000, 'buf').then(function(buf){ T.layers=rsMvt(buf); return T; }).catch(function(){ return null; });
      }));
    }).then(function(tiles){
      tiles=(tiles||[]).filter(Boolean); if(!tiles.length||st!==me) return;
      me.map=rsMapFromTiles(tiles, origin);
    }).catch(function(){ /* no map: the house runs on white, as before */ });
  }

  var STEP_T = [0.0, 2.6, 5.6, 8.8, 11.8];

  /* a pool: a deck around it, the coping traced, the water with a slow

  /* a finished back yard: lawn, a paver patio under a pergola, a fire pit,
     raised planting beds with shrubs, two trees and a stepping-stone path */
  function yardScene(T,H,now){
    var q=randomYard(), k0=ease(span(T,8.8,9.4)), k1=ease(span(T,9.3,10.1)), k2=ease(span(T,9.9,10.9)), k3=ease(span(T,10.5,11.5)), k4=ease(span(T,11.0,11.8));

  /* plumbing, as the thing itself: a water heater with its flue, the cold
     main coming up and in, hot and cold runs to a manifold of shut-offs,
     water moving through the lines */
  function pipeScene(T,H,now){
    var k1=ease(span(T,8.8,9.6)), k2=span(T,9.4,11.0), k3=ease(span(T,10.6,11.4));

      faces=faces.concat(cyl(H,-3,0,1.25,0,5.2*k1,14,'heater',[250,251,253],function(ctx,P,dpr){
        ctx.strokeStyle='rgba(0,21,48,.3)'; ctx.lineWidth=1*dpr; var pts=[]; for(var i=0;i<14;i++){ var t=i/14*Math.PI*2; pts.push(H.w(-3+Math.cos(t)*0.45,5.2*k1+0.01,Math.sin(t)*0.45)); } loop(ctx,P,pts,'#eef1f5'); }));

  /* a kitchen: an L of base cabinets with doors and drawers, a counter slab,

    var faces=[], F=function(){ faces=faces.concat(box.apply(null,arguments)); };
    function doors(axis,fixed,from,to,y0,y1,drawer){ return function(ctx,P,dpr){ if(det<=0) return; ctx.save(); ctx.globalAlpha*=det; ctx.strokeStyle=LINE; ctx.lineWidth=1*dpr;

    if(kf>0.01) F(H,-7,9.5,0,0.12,-5.6,5.2,'floor',{fill:[242,245,249]});

  /* a room, seen as a dollhouse: the walls turned toward the camera step
     aside so the inside stays in view as it turns. Trim traces baseboard,
     door and window casing and crown; painting traces and washes the walls. */
  function room(T,H,now,mode){

        if(w==='n'){ var dp=span(T,11.2,12.0); chain(ctx,P,[[pt(1,0.15),pt(1,7)],[pt(1,7),pt(4,7)],[pt(4,7),pt(4,0.15)]],dp,BLUE,2.2*dpr);
          if(dp>0){ ctx.globalAlpha*=dp*0.6; chain(ctx,P,[[pt(0.7,0.15),pt(0.7,7.3)],[pt(0.7,7.3),pt(4.3,7.3)],[pt(4.3,7.3),pt(4.3,0.15)]],1,LINE2,1*dpr); ctx.globalAlpha/=Math.max(dp*0.6,1e-6); } }

      } else {

  /* ── one frame ───────────────────────────────────────────────────────────── */

    st.cam.R+=(tR-st.cam.R)*k; st.cam.H+=(tH-st.cam.H)*k; st.cam.tilt+=(tTilt-st.cam.tilt)*k;

    if(mcv.width!==Math.round(mr.width)||mcv.height!==Math.round(mr.height)){ mcv.width=Math.round(mr.width); mcv.height=Math.round(mr.height); }

  /* ── the clock ─────────────────────────────────────────────────────────────── */

    }

    if(idx!==st.idx){ st.idx=idx; $('rs-now').textContent=label(idx); }

  /* ── the stage ─────────────────────────────────────────────────────────────── */
  function panel(){ return $('hs-addrpanel') || $('e-addrpanel'); }
  function ensureStage(){
    var stage=$('rs-stage'); if(stage) return stage;
    var pn=panel(); if(!pn) return null;
    var anchor=$('e-mapwrap') || $('hs-anchor'); if(!anchor) return null;
    stage=document.createElement('div'); stage.className='rs-stage'; stage.id='rs-stage';
    stage.setAttribute('role','status'); stage.setAttribute('aria-live','polite');
    stage.innerHTML=
      '<div class="hs-q" id="hs-q"></div>'
     +'<div class="rs-canvas-wrap" id="hs-canvas"><canvas id="rs-mapcv" aria-hidden="true"></canvas><canvas id="rs-cv" aria-hidden="true"></canvas>'
     +'<div class="rs-addr"><i></i><span id="rs-addr"></span></div></div>'
     +'<div class="rs-panel" id="hs-livepanel">'
     +  '<div id="rs-live"><div class="rs-row"><b id="rs-now">Locating your home</b><span id="rs-pct">0%</span></div>'
     +  '<div class="rs-bar"><i id="rs-bar"></i></div></div>'
     +  '<div class="rs-result" id="rs-result"></div>'
     +'</div>';

  }

  /* nothing is asked before the shot any more; askFirst just starts it */
  function askFirst(go){ go(); }

  /* ── start: when an address is chosen ─────────────────────────────────────── */
  function begin(addr){
    var stage=ensureStage(); if(!stage) return;
    var pn=panel(); pn.classList.add('hs-mode'); pn.classList.remove('hs-done','hs-fallback');
    stop();
    $('rs-addr').textContent=String(addr||'').split(',').slice(0,3).join(',');
    $('rs-live').style.display=''; $('rs-result').className='rs-result'; $('rs-result').innerHTML='';
    $('rs-bar').style.width='0'; $('rs-pct').textContent='0%'; $('rs-now').textContent=label(0);
    stage.classList.add('on');
    var cv=$('rs-cv'), mcv=$('rs-mapcv');
    /* the scan state exists from the moment the address is picked, so the

       where the size is asked on its own step, leave it as that step set it */
    if(!$('hs-addrpanel')){ try{ eS.sqft=0; eCheckBtn1(); }catch(e){} }
    var me=st;
    askFirst(function(ans){
      if(st!==me) return;
      me.q=ans||{}; me.waiting=false; me.t0=performance.now(); me.paused=0; me.clock=0; me.clockAt=undefined; me.lastMs=undefined; me.spin=0;

  }

  function hsData(d){
    var me=st; if(!me) return;
    if(d && d.totalAreaSqft>0){
      var pitch=+d.avgPitchDegrees||0, trueSqft=Math.round(d.totalAreaSqft), plan=Math.round(trueSqft*Math.cos(pitch*Math.PI/180));
      me.data={ trueSqft:trueSqft, planSqft:plan, pitch:pitch, planes:(d.roof&&d.roof.planes&&d.roof.planes.length)||0 };
      me.target=modelFor(trueSqft, pitch);
      me.bc=(me.origin&&d.centerLat&&d.centerLng) ? worldOf(me.origin,d.centerLat,d.centerLng) : [0,0];
      try{ me.planes=planesModel(d.roof, me.origin); }catch(e){ me.planes=null; }

  /* ── the finish: what the scan found, and the hand-off to the calculator ──── */
  var RESULT = {
    hvac:        function(d){ return [[fmt(d.planSqft),'Home footprint, sq ft'],[fmt(d.planSqft),'Living area to size for']]; },
    painting:    function(d){ return [[fmt(d.planSqft),'Home footprint, sq ft'],[fmt(Math.round(Math.sqrt(d.planSqft)*4*9)),'Exterior wall, approx. sq ft']]; },
    electrical:  function(d){ return [[fmt(d.planSqft),'Home footprint, sq ft'],[fmt(d.planSqft),'Home size to price']]; },
    general:     function(d){ return [[fmt(d.planSqft),'Home footprint, sq ft'],[fmt(d.trueSqft),'Roof area, sq ft']]; },
    pools:       function(d){ var y=st&&st.yard; return y ? [[fmt(d.planSqft),'Home footprint, sq ft'],[fmt(y.back),'Back yard, approx. sq ft'],[fmt(y.pool),'Pool that fits, sq ft']] : [[fmt(d.planSqft),'Home footprint, sq ft']]; },
    landscaping: function(d){ var y=st&&st.yard; return y ? [[fmt(d.planSqft),'Home footprint, sq ft'],[fmt(y.yard),'Yard, approx. sq ft']] : [[fmt(d.planSqft),'Home footprint, sq ft']]; },
    _:           function(d){ return [[fmt(d.planSqft),'Home footprint, sq ft']]; }
  };
  var PREFILL = {
    hvac:function(d){ return d.planSqft; }, painting:function(d){ return d.planSqft; }, electrical:function(d){ return d.planSqft; },
    pools:function(){ return st&&st.yard ? st.yard.pool : null; }, landscaping:function(){ return st&&st.yard ? st.yard.yard : null; }
  };
  function fmt(n){ return (typeof n==='number') ? Math.round(n).toLocaleString() : String(n); }

  function finish(data){
    if(!st) return;
    clearTimeout(st.timer);
    var res=$('rs-result'), q=st.q||{};
    $('rs-live').style.display='none';
    if(!data){
      res.innerHTML='<div class="rs-fail">We couldn’t find this home from satellite</div>'
        +'<p class="rs-note">Common with new builds and heavy tree cover. You can still enter the size below.</p>';
      res.className='rs-result on';

    }
    $('rs-bar').style.width='100%';
    var cards=(RESULT[TRADE]||RESULT._)(data,q);
    res.innerHTML='<div class="rs-grid hs-grid'+cards.length+'">'+cards.map(function(c){ return '<div><b>'+c[0]+'</b><span>'+c[1]+'</span></div>'; }).join('')+'</div>'
      +'<p class="rs-note">'+(PREFILL[TRADE]?'Measured from satellite. Adjust the size below if it’s off.':'Measured from satellite. Now tell us about the job.')+'</p>';

  function handoff(data, q){
    var pn=panel(); pn.classList.remove('hs-mode'); pn.classList.add('hs-done');
    var v = (data&&PREFILL[TRADE]) ? PREFILL[TRADE](data,q) : null;
    var sw=$('e-sldwrap'), sld=$('e-sld');
    if(sw&&!$('hs-addrpanel')){ sw.style.display='block'; try{ window.eManualOpen=true; eManualOpen=true; }catch(e){} }
    if(sld&&typeof eUpdateSlider==='function'){
      var val = v ? Math.max(+sld.min, Math.min(+sld.max, Math.round(v/10)*10)) : +sld.value;
