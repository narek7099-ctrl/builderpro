function eDistFt(a,b){

function eSwatch(key){

  function grad(a,b){ var g=c.createLinearGradient(0,0,120,120); g.addColorStop(0,a); g.addColorStop(1,b); c.fillStyle=g; c.fillRect(0,0,120,120); }

  switch(key){
    case 'walls':       grad('#e9e3d6','#ded6c4'); roller(); break;
    case 'walls-ceil':  grad('#eef0f2','#e2e6ea'); roller(); break;
    case 'walls-trim':  grad('#dfe6d9','#cdd8c4'); roller(); trim('#f4f3ee'); break;
    case 'full':        grad('#e6ddef','#d7cbe6'); roller(); trim('#f4f3ee'); break;

function ePaintWallArea(){
  var area=eS.sqft||0;
  if(eS.mode==='exterior'){
    var h=E_CONFIG.storyHeight[eS.quality||'1']||9;
    var perim=4*Math.sqrt(area)*1.1;             // approx building perimeter from footprint
    return Math.round(perim*h*0.85);             // × wall height × openings allowance
  }
  var cf=E_CONFIG.ceilFactor[eS.quality||'8']||3.2;
  return Math.round(area*cf);                     // interior: floor area × ceiling factor
}
function eCalcPrice(){
  var sc=ePaintScope(); var p=sc[eS.material]||sc[Object.keys(sc)[0]];
  var prep=E_CONFIG.projectMult[eS.project]||1.00;   // coats / prep level
  var cond=E_CONFIG.terrainMult[eS.terrain]||1.00;   // surface condition
  var color=E_CONFIG.accessMult[eS.access]||1.00;    // color-change difficulty
  var rm=parseFloat(E_CONFIG.regionMult[eS.region]||1.00);
  var wall=ePaintWallArea();
  var lowPer=p.low*prep*cond*color*rm, highPer=p.high*prep*cond*color*rm;
  var low=Math.round(wall*lowPer/25)*25, high=Math.round(wall*highPer/25)*25;
  var add=eAddonTotals(); low+=add.low; high+=add.high;
  return {low:low, high:high, mid:Math.round((low+high)/2), wall:wall, area:eS.sqft, lowPer:lowPer, highPer:highPer, addons:add};
}

<script id="hs-script">
/* HOUSE SCAN — the map-to-house shot for every calculator except roofing.
   Source for embed-src/house-scan.html, which tools/build-house-scan.py
   assembles from this file plus the map and house code shared with the roof
   scan (embed-src/roof-scan.html), so that code lives in one place.

   The shot: their street from above, their home's outline lights up, the
   camera tilts and the house rises out of the map — then each trade ends its
   own way, all in the same white-block look:

     hvac         a condenser appears beside the house, fan spinning; the camera
                  closes in and turns around it
     countertops  the roof lifts off and the camera drops into a kitchen
     trim         the roof lifts off; baseboard, casing and crown trace a room
     painting     every wall is traced and washed (a room, for interior jobs)
     pools        a pool is outlined, dug and filled in the back yard
     landscaping  the back yard is laid out: lawn, planting, stepping stones
     plumbing     the house turns to glass; supply lines run in to the fixtures
     electrical   the house turns to glass; circuits run out from the panel
     general      the whole house, every edge traced

   Everything is white — how things will LOOK is the image generator's job —
   and nothing waits on the homeowner's choices: the pool and the yard are
   picked at random (the same for the same address), and the real questions
   come after the scan, on the calculator's own steps.

   The measurement is the roof scan's: rapid-handler's building read, so the
   house is theirs. What it hands to each calculator is the step-1 number that
   trade asks for, where the house can supply it (home size for HVAC, painting
   and electrical; pool and yard size from the questions); otherwise the size
   slider opens for them as before. */
(function(){
  var TRADE = window.HS_TRADE || 'general';
  var HS_END = 15.0, HS_WAIT_MAX = 28;
  var st = null;
  (function(){ try{ if(document.getElementById('rs-geist')) return; var l=document.createElement('link'); l.id='rs-geist'; l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap'; (document.head||document.documentElement).appendChild(l); }catch(e){} })();
  function $(id){ return document.getElementById(id); }
  function reduced(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }

  /* ── the house model, in feet ──────────────────────────────────────────────
     Footprint from the measured area and slope: plan = true area × cos(slope).
     Proportioned 1.55 : 1, which is close to the median US single-family
     footprint. Satellite gives the area and the pitch, not the plan shape, so
     the shape is the typical one and the size and steepness are theirs. */
  function modelFor(trueSqft, pitchDeg){
    var p=Math.max(0, Math.min(55, pitchDeg||22));
    var plan=Math.max(600, (trueSqft||2000)*Math.cos(p*Math.PI/180));
    var D=Math.sqrt(plan/1.55), W=D*1.55;
    return { W:W, D:D, H:10, pitch:p, o:1.6 };
  }

     Solar returns every roof plane with its slope, the compass direction it
     faces, its height and a north-up bounding box. Houses are rarely built
     square to north, so first find the house's own grid (planes face along
     it, 90° apart), turn everything onto that grid, and each plane becomes a
     rectangle sloping one of four ways. Its size comes from its measured
     ground area, so a garage wing is garage-sized and sits where the garage
     is. Under each plane, walls to the ground — a white block, not a render,
     but the outline and the roof are theirs. */
  function planesModel(roof, origin){
    var ps=(roof&&roof.planes)||[]; if(ps.length<2) return null;
    var lat0=0,lng0=0; ps.forEach(function(p){ lat0+=p.lat; lng0+=p.lng; }); lat0/=ps.length; lng0/=ps.length;
    var FT=3.28084, kx=111320*Math.cos(lat0*Math.PI/180)*FT, kz=110574*FT;
    function loc(la,ln){ return [ (ln-lng0)*kx, -(la-lat0)*kz ]; }        /* x east, z south */
    /* the house's grid: circular mean of the facing directions, folded to 90° */
    var sx=0, sy=0; ps.forEach(function(p){ var a=p.azimuth*Math.PI/180*4, w=p.groundSqft; sx+=Math.cos(a)*w; sy+=Math.sin(a)*w; });

    var facets=ps.map(function(p){
      var c=rot(loc(p.lat,p.lng));
      /* Solar's box is north-up around a plane that is turned th off north.
         For a w×d rectangle turned th, the box is  Bx = w|cos|+d|sin|,
         Bz = w|sin|+d|cos|  — solve that for w and d. Shrinking the loose box
         evenly instead would square every plane off: a 52 ft eave came out 32.

  }

  function buildGeometry(m){
    var W=m.W/2, D=m.D/2, H=m.H, o=m.o;
    var faces=[], roofEdges=[];
    /* walls */
    var g=[[-W,0,-D],[W,0,-D],[W,0,D],[-W,0,D]], t=[[-W,H,-D],[W,H,-D],[W,H,D],[-W,H,D]];

  /* ── projection ── */
  /* The house turns about a vertical axis through its own centre, and the
     framing is worked out once from the model rather than every frame: the
     scale fits the house's widest turning circle, so no angle of the turn
     is ever larger than another, and the centre never moves. Measuring each
     frame's outline and re-centring on it (as before) chased a shape that
     changes as it turns, which read as the house shaking. Orthographic, for
     the same reason — perspective makes the near corner swell and shrink. */

  /* cam: c (centre, world feet), R and H (what must fit), tilt (0.46 is
     the three-quarter view; PI/2 is straight down), yaw, zoom (1 = the

  /* ── the street around the house ─────────────────────────────────────────────
     The same white map the Lead Radar uses: OpenFreeMap's OpenMapTiles data
     (free, no key, no watermark, fine for commercial use). Rather than a map
     library, the scan fetches the one or few vector tiles around the address
     and draws the roads and buildings itself, in the same scene and with the
     same camera as the house — so the map can tilt and the house can rise
     out of it in one continuous shot, with no hand-off between two renderers.
     No key, no per-visitor cost, and nothing to download beyond the tiles.
     If the tiles cannot be had, the scan runs exactly as before, on white. */
  var RS_TILEJSON='https://tiles.openfreemap.org/planet';
  var RS_MAP_R=900;                 /* feet of street to draw around the house */
  var rsTileTpl=null;

  /* A minimal Mapbox Vector Tile reader: protobuf wire format, the layers,
     their features' tags and geometry commands. ~60 lines rather than a
     library on every contractor's site. */
  function rsMvt(buf){
    var b=new Uint8Array(buf), p=0;
    function vint(){ var r=0, s=0, c; do{ c=b[p++]; r+=(c&0x7f)*Math.pow(2,s); s+=7; }while(c>=0x80); return r; }

    function str(end){ var out=''; try{ out=new TextDecoder().decode(b.subarray(p,end)); }catch(e){} p=end; return out; }
    function packed(end){ var a=[]; while(p<end) a.push(vint()); return a; }

    while(p<b.length){
      var key=vint(), f=key>>3, t=key&7;
      if(f!==3||t!==2){ skip(t); continue; }

      while(p<lend){
        var k2=vint(), f2=k2>>3, t2=k2&7;
        if(f2===1&&t2===2){ var e1=vint()+p; L.name=str(e1); }
        else if(f2===5&&t2===0){ L.extent=vint(); }
        else if(f2===3&&t2===2){ var e3=vint()+p; L.keys.push(str(e3)); }
        else if(f2===4&&t2===2){
          var e4=vint()+p, v=null;
          while(p<e4){ var k4=vint(), f4=k4>>3, t4=k4&7;
            if(f4===1&&t4===2){ var e5=vint()+p; v=str(e5); }
            else if(f4===4||f4===5){ v=vint(); }
            else if(f4===7){ v=!!vint(); }
            else skip(t4); }
          L.vals.push(v);
        }
        else if(f2===2&&t2===2){
          var e2=vint()+p, F={type:0,tags:[],geom:[]};
          while(p<e2){ var k3=vint(), f3=k3>>3, t3=k3&7;
            if(f3===2&&t3===2){ var et=vint()+p; F.tags=packed(et); }
            else if(f3===3&&t3===0){ F.type=vint(); }
            else if(f3===4&&t3===2){ var eg=vint()+p; F.geom=packed(eg); }
            else skip(t3); }

  /* geometry commands -> rings / lines, in tile pixels */
  function rsGeom(g){

    function zz(n){ return (n>>>1) ^ -(n&1); }
    while(i<g.length){
      var ci=g[i++], cmd=ci&7, cnt=ci>>3;
      if(cmd===7){ if(cur&&cur.length) cur.push(cur[0]); continue; }
      for(var k=0;k<cnt;k++){

  }
  function rsProps(L,F){ var o={}; for(var i=0;i+1<F.tags.length;i+=2) o[L.keys[F.tags[i]]]=L.vals[F.tags[i+1]]; return o; }

  var RS_ROAD={motorway:60,trunk:56,primary:48,secondary:42,tertiary:36,minor:28,service:16};

  function rsMapFromTiles(tiles, origin){
    var FT=3.28084, kx=111320*Math.cos(origin.lat*Math.PI/180)*FT, kz=110574*FT;
    var roads=[], blds=[], water=[], park=[], lim=RS_MAP_R*1.35;

      var n=Math.pow(2,T.z);
      function w(px,py,ext){

        var lng=X/n*360-180, lat=Math.atan(Math.sinh(Math.PI*(1-2*Y/n)))*180/Math.PI;

      each('transportation', function(L,F,rings){ if(F.type!==2) return; var c=rsProps(L,F)['class']; var wd=RS_ROAD[c]; if(!wd) return;
        rings.forEach(function(r){ if(near(r)) roads.push({w:wd, pts:r}); }); });
      each('building', function(L,F,rings){ if(F.type!==3) return; rings.forEach(function(r){ if(r.length>2&&near(r)) blds.push(r); }); });
      each('water', function(L,F,rings){ if(F.type!==3) return; rings.forEach(function(r){ if(near(r)) water.push(r); }); });
      each('park', function(L,F,rings){ if(F.type!==3) return; rings.forEach(function(r){ if(near(r)) park.push(r); }); });

  function rsFetch(url, ms, kind){
    return new Promise(function(res,rej){
      var done=false, t=setTimeout(function(){ if(!done){ done=true; rej(new Error('timeout')); } }, ms);
      fetch(url).then(function(r){ if(!r.ok) throw new Error(r.status); return kind==='json'?r.json():r.arrayBuffer(); })
        .then(function(v){ if(!done){ done=true; clearTimeout(t); res(v); } })
        .catch(function(e){ if(!done){ done=true; clearTimeout(t); rej(e); } });
    });
  }

  function rsMapLoad(lat, lng){
    if(!st) return;
    var me=st, origin={lat:+lat, lng:+lng};
    me.origin=origin;
    if(typeof window.RS_DEMO_MAP==='function'){ setTimeout(function(){ if(st===me) me.map=window.RS_DEMO_MAP(origin); }, 250); return; }
    var tpl=rsTileTpl ? Promise.resolve(rsTileTpl)
      : rsFetch(RS_TILEJSON, 5000, 'json').then(function(j){ rsTileTpl={t:j.tiles[0], z:Math.min(14, j.maxzoom||14)}; return rsTileTpl; });
    tpl.then(function(tt){
      var z=tt.z, n=Math.pow(2,z);
      var xf=(origin.lng+180)/360*n, lr=origin.lat*Math.PI/180;
      var yf=(1-Math.log(Math.tan(lr)+1/Math.cos(lr))/Math.PI)/2*n;
      var tileFt=40075016*Math.cos(lr)/n*3.28084, m=RS_MAP_R*1.3/tileFt;
      var want=[];
      for(var dx=-1;dx<=1;dx++) for(var dy=-1;dy<=1;dy++){
        var tx=Math.floor(xf)+dx, ty=Math.floor(yf)+dy;
        if(tx+1<xf-m||tx>xf+m||ty+1<yf-m||ty>yf+m) continue;

      return Promise.all(want.map(function(T){
        var url=tt.t.replace('{z}',T.z).replace('{x}',T.x).replace('{y}',T.y);
        return rsFetch(url, 6000, 'buf').then(function(buf){ T.layers=rsMvt(buf); return T; }).catch(function(){ return null; });
      }));

      tiles=(tiles||[]).filter(Boolean); if(!tiles.length||st!==me) return;

  }
  window.rsMvt=rsMvt; window.rsGeom=rsGeom; window.rsMapFromTiles=rsMapFromTiles;   /* for tools/roof-map.test.js */

  function rsInside(pt, ring){
    var c=false; for(var i=0,j=ring.length-1;i<ring.length;j=i++){
      var a=ring[i], b=ring[j];
      if(((a[1]>pt[1])!==(b[1]>pt[1])) && (pt[0] < (b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])) c=!c; }
    return c;
  }

  /* the map, drawn flat at ground level through the same camera as the house */
  /* The map is flat, and the camera is orthographic, so every frame's view
     of it is just a stretch-and-turn of one top-down picture. It is painted
     once (twice: a wide one for the opening and a sharp close one for the
     lot) and each frame only places that picture — one drawImage instead of
     re-drawing a few hundred roads and houses 60 times a second. */
  function paintMap(map, halfFt, px, core){
    var c=document.createElement('canvas'); c.width=c.height=px;
    var m=c.getContext('2d'), k=px/(2*halfFt);
    m.setTransform(k,0,0,k,px/2,px/2);            /* world feet -> texture pixels, origin in the middle */
    function path(ring){ m.beginPath(); ring.forEach(function(q,i){ i?m.lineTo(q[0],q[1]):m.moveTo(q[0],q[1]); }); }
    m.fillStyle='#f3f5f8'; m.fillRect(-halfFt,-halfFt,2*halfFt,2*halfFt);
    m.fillStyle='#e7eee4'; map.park.forEach(function(r){ path(r); m.fill(); });
    m.fillStyle='#dde8f3'; map.water.forEach(function(r){ path(r); m.fill(); });
    m.lineCap='butt'; m.lineJoin='round';   /* square ends: round caps draw a loop at every dead end up close */
    m.strokeStyle='#dfe4ea'; map.roads.forEach(function(rd){ m.lineWidth=rd.w+6; path(rd.pts); m.stroke(); });
    m.strokeStyle='#ffffff'; map.roads.forEach(function(rd){ m.lineWidth=rd.w; path(rd.pts); m.stroke(); });
    /* every building, this one included: the measured outline is drawn
       over its own, and repainting to cut it out cost a visible hitch at
       the moment the house arrived */
    m.fillStyle='#e4e8ee'; m.strokeStyle='#d3d9e1'; m.lineWidth=1/k;
    map.blds.forEach(function(r){ path(r); m.fill(); m.stroke(); });

       being cut off by it */
    m.setTransform(1,0,0,1,0,0);
    m.globalCompositeOperation='destination-in';
    var gr=m.createRadialGradient(px/2,px/2,px*core,px/2,px/2,px*0.5);
    gr.addColorStop(0,'rgba(0,0,0,1)'); gr.addColorStop(1,'rgba(0,0,0,0)');

  /* painted as soon as the street arrives, in its own task, so no frame
     of the animation ever waits on it */
  function rsPaintMaps(me){
    if(!me||!me.map||me.mapWide) return;
    setTimeout(function(){ if(st!==me) return;
      me.mapWide=paintMap(me.map, RS_MAP_R, 1536, 0.22);
      setTimeout(function(){ if(st!==me) return; me.mapNear=paintMap(me.map, 260, 2048, 0.40); }, 0);
    }, 0);
  }

  function drawMap(ctx, P, dpr, alpha, foot, footA){
    if(!st.mapWide) return;
    /* the affine map from the ground plane to the screen, read off the camera */
    var o=P([0,0,0]), ex=P([1,0,0]), ez=P([0,0,1]);
    var A=ex.x-o.x, B=ex.y-o.y, C=ez.x-o.x, D=ez.y-o.y;

  /* "Random", but the same for the same address: seeded from it, so going

  function seeded(){ var str=String((st&&st.addrText)||'x'), h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }

  function randomYard(){ if(st._yard) return st._yard; var r=seeded(); r(); r();
    return (st._yard={size:900+Math.round(r()*1800), shrubs:4+Math.floor(r()*5), stones:3+Math.floor(r()*4)}); }

    else if(shape==='l'){ var a=L/2, b=W/2; pts=[[-a,-b],[a,-b],[a,b],[a*0.1,b],[a*0.1,b+W*0.55],[-a,b+W*0.55]]; }

  /* ── one frame ───────────────────────────────────────────────────────────── */

    st.cam.R+=(tR-st.cam.R)*k; st.cam.H+=(tH-st.cam.H)*k; st.cam.tilt+=(tTilt-st.cam.tilt)*k;

    var mapA=Math.min(span(T,0,0.8), 1-span(T,9.2,10.8));
    if(st.map&&!st.mapWide) rsPaintMaps(st);
    var mcv=st.mcv, mctx=st.mctx, mr=mcv.getBoundingClientRect();
    if(mcv.width!==Math.round(mr.width)||mcv.height!==Math.round(mr.height)){ mcv.width=Math.round(mr.width); mcv.height=Math.round(mr.height); }
    if(mapA>0||st.mapDrawn){ mctx.clearRect(0,0,mcv.width,mcv.height); st.mapDrawn=false; }
    var PM=makeProj(mcv,{c:st.cam.c,R:st.cam.R,H:st.cam.H,tilt:tilt,yaw:yaw,zoom:zoom,grow:1});
    if(st.mapWide&&mapA>0){ st.mapDrawn=true;
      var footA=geo?Math.min(span(T,Math.max(3.0,start),Math.max(4.2,start+1.2)),1):0;
      drawMap(mctx,PM,1,mapA,geo&&geo.foot,footA);
    }
    if(!geo||grow<=0.01){ st.raf=requestAnimationFrame(draw); return; }
    st.geoLocked=geo;

    /* ground-level work (pool, yard) sits under the house */
    if(fin&&fin.under) fin.under(ctx,P1,dpr,now);

    /* the house, plus whatever this ending adds, back to front */
    var lift=fin&&fin.roofLift||0, roofA=fin&&fin.roofA!==undefined?fin.roofA:1, houseA=fin&&fin.houseA!==undefined?fin.houseA:1;
    var list=geo.faces.map(function(f){
      if(f.kind==='roof'&&lift){ return {f:f, v:f.v.map(function(p){ return [p[0],p[1]+lift/Math.max(grow,0.01),p[2]]; }), a:roofA}; }
      return {f:f, v:f.v, a:1};
    });
    if(fin&&fin.faces) fin.faces.forEach(function(f){ list.push({f:f, v:f.v, a:1, extra:true}); });
    var faces=list.map(function(o){ var PP=o.extra?P1:P; var pts=o.v.map(PP), z=pts.reduce(function(s,p){ return s+p.z; },0)/pts.length; return {f:o.f,pts:pts,z:z,a:o.a,extra:o.extra,PP:PP}; });
    var gz={}; faces.forEach(function(F){ var g=F.f.grp; if(g===undefined) return; var o=gz[g]||(gz[g]={s:0,n:0}); F.pts.forEach(function(p){ o.s+=p.z; o.n++; }); });
    faces.sort(function(a,b){
      var ga=a.f.grp, gb=b.f.grp;
      if(ga!==undefined&&gb!==undefined&&ga!==gb) return gz[gb].s/gz[gb].n - gz[ga].s/gz[ga].n;
      return b.z-a.z;
    });
    var wash=fin&&fin.wallWash||0;
    function paint(c2,F,alpha){
      var sh=shade(F.f,F.PP,F.f.kind==='roof'||F.f.kind==='top'?'roof':'wall');
      var base=F.f.style&&F.f.style.fill ? F.f.style.fill : (F.f.kind==='roof'||F.f.kind==='top'?[255,255,255]:[226,232,240]);
      var col=base.map(function(c){ return Math.round(c*sh); });
      if(wash>0&&F.f.kind==='wall'&&!F.extra){ col=[Math.round(col[0]-(col[0]-214)*wash*0.55),Math.round(col[1]-(col[1]-230)*wash*0.55),Math.round(col[2]-(col[2]-255)*wash*0.4)]; }
      c2.save(); c2.globalAlpha=alpha;
      c2.fillStyle='rgb('+col.join(',')+')'; c2.strokeStyle=INK; c2.lineWidth=1*dpr; c2.lineJoin='round';
      c2.beginPath(); F.pts.forEach(function(p,i){ i?c2.lineTo(p.x,p.y):c2.moveTo(p.x,p.y); }); c2.closePath(); c2.fill(); c2.stroke();
      if(fin&&fin.face) fin.face(c2,F.PP,F,dpr);
      c2.restore();
    }
    var growA=Math.min(1,grow*4);
    if(houseA>=0.999){
      faces.forEach(function(F){ var a=F.a*growA; if(a>0.01) paint(ctx,F,a); });
    } else {
      /* Faded face by face, a house's walls pile up where they overlap into
         grey smears. Drawn whole on its own layer and faded as one picture,
         it reads as glass; what the ending adds goes on top, sharp. */
      var hc=st.hcv||(st.hcv=document.createElement('canvas'));
      if(hc.width!==w||hc.height!==h){ hc.width=w; hc.height=h; }
      var hctx=hc.getContext('2d'); hctx.clearRect(0,0,w,h);
      faces.forEach(function(F){ if(!F.extra){ var a=F.a*growA; if(a>0.01) paint(hctx,F,a); } });
      ctx.save(); ctx.globalAlpha=Math.max(0,houseA); ctx.drawImage(hc,0,0); ctx.restore();
      faces.forEach(function(F){ if(F.extra) paint(ctx,F,1); });
    }
    /* a see-through house keeps its outline, so it still reads as a house */
    if(fin&&fin.ghostEdges&&houseA<0.6){
      ctx.save(); ctx.globalAlpha=0.55; ctx.strokeStyle='rgba(0,21,48,.28)'; ctx.lineWidth=1*dpr;
      geo.faces.forEach(function(f){ if(f.kind==='roof') return; var pts=f.v.map(P); ctx.beginPath(); pts.forEach(function(p,i){ i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); }); ctx.closePath(); ctx.stroke(); });

  function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

  /* ── the clock ─────────────────────────────────────────────────────────────── */
  function tick(){
    if(!st) return;
    var el=(performance.now()-st.t0)/1000;
    var holdAt=STEP_T[4]-0.2, raw=el-(st.paused||0);
    if(st.data===undefined && raw>holdAt){
      st.paused=el-holdAt; raw=holdAt;
      if(el>HS_WAIT_MAX){ finish(null); return; }
    }
    if(st.failed && raw>=STEP_T[2]){ finish(null); return; }
    st.clock=Math.min(HS_END, raw);
    st.clockAt=performance.now(); st.clockHeld=(st.data===undefined && raw>=holdAt) || st.clock>=HS_END;
    var T=st.clock, idx=0;
    for(var i=0;i<STEP_T.length;i++){ if(T>=STEP_T[i]) idx=i; }
    if(idx!==st.idx){ st.idx=idx; $('rs-now').textContent=label(idx); }
    var pc=Math.round(T/HS_END*100); $('rs-bar').style.width=pc+'%'; $('rs-pct').textContent=pc+'%';
    if(T>=HS_END && st.data){ finish(st.data); return; }
    st.timer=setTimeout(tick, 60);
  }

  /* ── the stage ─────────────────────────────────────────────────────────────── */
  function panel(){ return $('hs-addrpanel') || $('e-addrpanel'); }
  function ensureStage(){
    var stage=$('rs-stage'); if(stage) return stage;
    var pn=panel(); if(!pn) return null;
    var anchor=$('e-mapwrap') || $('hs-anchor'); if(!anchor) return null;
    stage=document.createElement('div'); stage.className='rs-stage'; stage.id='rs-stage';
    stage.setAttribute('role','status'); stage.setAttribute('aria-live','polite');
    stage.innerHTML=
      '<div class="hs-q" id="hs-q"></div>'
     +'<div class="rs-canvas-wrap" id="hs-canvas"><canvas id="rs-mapcv" aria-hidden="true"></canvas><canvas id="rs-cv" aria-hidden="true"></canvas>'
     +'<div class="rs-addr"><i></i><span id="rs-addr"></span></div></div>'
     +'<div class="rs-panel" id="hs-livepanel">'
     +  '<div id="rs-live"><div class="rs-row"><b id="rs-now">Locating your home</b><span id="rs-pct">0%</span></div>'
     +  '<div class="rs-bar"><i id="rs-bar"></i></div></div>'
     +  '<div class="rs-result" id="rs-result"></div>'
     +'</div>';
    anchor.parentNode.insertBefore(stage, anchor);
    return stage;
  }

  /* nothing is asked before the shot any more; askFirst just starts it */
  function askFirst(go){ go(); }

  /* ── start: when an address is chosen ─────────────────────────────────────── */
  function begin(addr){
    var stage=ensureStage(); if(!stage) return;
    var pn=panel(); pn.classList.add('hs-mode'); pn.classList.remove('hs-done','hs-fallback');
    stop();
    $('rs-addr').textContent=String(addr||'').split(',').slice(0,3).join(',');
    $('rs-live').style.display=''; $('rs-result').className='rs-result'; $('rs-result').innerHTML='';
    $('rs-bar').style.width='0'; $('rs-pct').textContent='0%'; $('rs-now').textContent=label(0);
    stage.classList.add('on');
    var cv=$('rs-cv'), mcv=$('rs-mapcv');
    /* the scan state exists from the moment the address is picked, so the
       street and the measurement start loading while any questions are asked */
    st={ cv:cv, ctx:cv.getContext('2d'), mcv:mcv, mctx:mcv.getContext('2d'), dpr:Math.min(2, window.devicePixelRatio||1),
         t0:performance.now(), clock:0, idx:-1, data:undefined, target:null, waiting:true, addrText:String(addr||'') };
    /* where the scan replaces the trace, the size is the scan's to give;
       where the size is asked on its own step, leave it as that step set it */
    if(!$('hs-addrpanel')){ try{ eS.sqft=0; eCheckBtn1(); }catch(e){} }
    var me=st;
    askFirst(function(ans){
      if(st!==me) return;
      me.q=ans||{}; me.waiting=false; me.t0=performance.now(); me.paused=0; me.clock=0; me.clockAt=undefined; me.lastMs=undefined; me.spin=0;
      draw(); tick();
    });
  }

  function hsData(d){
    var me=st; if(!me) return;
    if(d && d.totalAreaSqft>0){
      var pitch=+d.avgPitchDegrees||0, trueSqft=Math.round(d.totalAreaSqft), plan=Math.round(trueSqft*Math.cos(pitch*Math.PI/180));
      me.data={ trueSqft:trueSqft, planSqft:plan, pitch:pitch, planes:(d.roof&&d.roof.planes&&d.roof.planes.length)||0 };
      me.target=modelFor(trueSqft, pitch);
      me.bc=(me.origin&&d.centerLat&&d.centerLng) ? worldOf(me.origin,d.centerLat,d.centerLng) : [0,0];
      try{ me.planes=planesModel(d.roof, me.origin); }catch(e){ me.planes=null; }
      if(!me.planes){
        var g0=buildGeometry(me.target), o=me.origin;
        if(o&&d.centerLat&&d.centerLng){
          var FT=3.28084, dx=(d.centerLng-o.lng)*111320*Math.cos(o.lat*Math.PI/180)*FT, dz=-(d.centerLat-o.lat)*110574*FT, seen=[];

          g0.faces.forEach(function(f){ f.v.forEach(mv); }); g0.roofEdges.forEach(function(e){ mv(e[0]); mv(e[1]); });
          (g0.foot||[]).forEach(function(f){ f.forEach(mv); }); if(g0.ridge){ mv(g0.ridge[0]); mv(g0.ridge[1]); }
          seen.forEach(function(v){ delete v._m; });

        me.gen=g0;
      }

  }

  /* ── the finish: what the scan found, and the hand-off to the calculator ──── */
  var RESULT = {
    hvac:        function(d){ return [[fmt(d.planSqft),'Home footprint, sq ft'],[d.planes>1?d.planes:'—','Roof planes'],[fmt(d.planSqft),'Living area to size for']]; },
    painting:    function(d){ return [[fmt(d.planSqft),'Home footprint, sq ft'],[fmt(Math.round(Math.sqrt(d.planSqft)*4*9)),'Exterior wall, approx. sq ft'],[d.planes>1?d.planes:'—','Roof planes']]; },
    electrical:  function(d){ return [[fmt(d.planSqft),'Home footprint, sq ft'],[d.planes>1?d.planes:'—','Roof planes'],[fmt(d.planSqft),'Home size to price']]; },
    _:           function(d){ return [[fmt(d.planSqft),'Home footprint, sq ft'],[d.planes>1?d.planes:'—','Roof planes'],[fmt(d.trueSqft),'Roof area, sq ft']]; }
  };
  var PREFILL = {
    hvac:function(d){ return d.planSqft; }, painting:function(d){ return d.planSqft; }, electrical:function(d){ return d.planSqft; }
  };
  function fmt(n){ return (typeof n==='number') ? Math.round(n).toLocaleString() : String(n); }

  function finish(data){
    if(!st) return;

        +'<p class="rs-note">Common with new builds and heavy tree cover. You can still enter the size below.</p>';
      res.className='rs-result on';
      handoff(null, q); return;
    }
    $('rs-bar').style.width='100%';
    var cards=(RESULT[TRADE]||RESULT._)(data,q);
    res.innerHTML='<div class="rs-grid hs-grid3">'+cards.map(function(c){ return '<div><b>'+c[0]+'</b><span>'+c[1]+'</span></div>'; }).join('')+'</div>'
      +'<p class="rs-note">'+(PREFILL[TRADE]?'Measured from satellite. Adjust the size below if it’s off.':'Measured from satellite. Now tell us about the job.')+'</p>';
    res.className='rs-result on';
    handoff(data, q);
    st.done=true;
  }

  function handoff(data, q){
    var pn=panel(); pn.classList.remove('hs-mode'); pn.classList.add('hs-done');
    var v = (data&&PREFILL[TRADE]) ? PREFILL[TRADE](data,q) : null;
    var sw=$('e-sldwrap'), sld=$('e-sld');
    if(sw&&!$('hs-addrpanel')){ sw.style.display='block'; try{ window.eManualOpen=true; eManualOpen=true; }catch(e){} }
    if(sld&&typeof eUpdateSlider==='function'){
      var val = v ? Math.max(+sld.min, Math.min(+sld.max, Math.round(v/10)*10)) : +sld.value;
      if(!$('hs-addrpanel') || v) { try{ eUpdateSlider(val); }catch(e){} }

  /* ── plumbing, electrical and remodel had no address step: add one ─────────── */
  function insertPanel(){

     +'<div class="e-stitle">What’s the<br><em>Property Address?</em></div>'
     +'<div class="e-ssub">Enter the address and we’ll find your home from satellite. Nothing to draw.</div></div>'
     +'<div class="e-asearch"><input type="text" class="e-asearch-input" id="e-addrIn" placeholder="Start typing a US address..." autocomplete="off" oninput="eHandleAddrInput(event)" onkeydown="eHandleAddrKey(event)">'

     +'<div id="hs-anchor"></div>'

  }

  /* ── wire into the estimator, wrapping rather than rewriting ──────────────── */
  function wire(){
    if(typeof eSelectAddress!=='function'||typeof eSolarMeasure!=='function') return false;
    insertPanel();
    var _select=eSelectAddress;

      fetch(E_SOLAR_URL,{ method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+E_SOLAR_ANON,'apikey':E_SOLAR_ANON}, body:JSON.stringify({lat:lat,lng:lon}) })

<!--HS-END--><!--ST-BEGIN--><!-- SITE THEME — dresses an estimator in the marketing site's design system
     (site/site.css), so the calculator reads as part of the website rather
     than a widget dropped into it.

     Injected by tools/inject-roof-scan.py; applied to roofing first. Written
     against the class names every estimator shares (.e-shdr, .e-oi,
     .e-btnmain ...), so extending it to the other nine is a list change, not
     a rewrite.

     The system, from site/site.css:
       type     General Sans (Geist behind it), 600 headlines at -0.03em,
                uppercase 12px 600 captions
       colour   canvas #edf2f6, cards white, ink #001530, muted #788493,
                ONE accent #006fff, hairlines rgba(0,0,0,.10)
       shape    16px cards, 6px gaps between cards, no drop shadows,
                every button a fully rounded uppercase pill
       motion   ease-settle for things arriving, ease-pill for fills,
                .3s colour changes on hover

     It sits after every other stylesheet on the page and is specific enough
     to win without fighting line by line; the older layers underneath carry
     !important in places, so this does too, deliberately and only there. -->
<style id="bp-site-theme">
#est-embed{

  --st-radius:16px; --st-gap:6px;
  --st-settle:cubic-bezier(.39,.575,.565,1); --st-pill:cubic-bezier(.215,.61,.355,1);

  --pri:#006fff !important; --pri-d:#003db8 !important; --ink:#001530 !important; --ink-2:#788493 !important;
  --line:rgba(0,0,0,.10) !important; --mu:#788493 !important; --txt:#001530 !important; --bs:#dce3ec !important;
}
